<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Filter Simulator V11.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginCard{width:min(390px,100%);background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0002}.loginCard h1{margin:0 0 8px;font-size:24px}.loginCard p{color:#667085}.loginCard input{width:100%;padding:13px;border:1px solid #ccd3da;border-radius:10px;margin:8px 0}.loginCard button{width:100%;padding:13px;border:0;border-radius:10px;background:#1769aa;color:white;font-weight:700}.err{color:#c62828;min-height:22px;margin-top:8px}
.app{max-width:1100px;margin:auto;padding:14px}.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.top h1{font-size:20px;margin:4px 0}.badge{font-size:12px;background:#e8f2ff;color:#1769aa;border-radius:999px;padding:5px 9px}.card{background:#fff;border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0000000d}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field label{display:block;font-size:12px;color:#667085;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #cfd6dd;border-radius:9px;background:white}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:10px 14px;border:0;border-radius:9px;background:#1769aa;color:#fff;font-weight:700}.actions .secondary{background:#e9eef3;color:#17202a}.check{display:flex;gap:5px;align-items:center;font-size:13px}.specNote{font-size:12px;color:#667085;margin-top:8px}
.chartWrap{position:relative;background:#0d1117;border-radius:12px;padding:8px;touch-action:none}.chartWrap canvas{width:100%;height:390px;display:block;border-radius:8px}.legend{display:flex;gap:14px;align-items:center;position:absolute;top:15px;left:16px;color:#fff;font-size:12px}.dot{width:10px;height:3px;display:inline-block;background:#4fc3f7}.dot.s11{background:#ffca58}.markerInfo{position:absolute;right:12px;top:12px;background:#0009;color:#fff;padding:7px 9px;border-radius:8px;font-size:12px}
.tuneGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sectionTitle{font-weight:800;margin-bottom:8px}.row{display:grid;grid-template-columns:72px 1fr 36px 36px;gap:6px;align-items:center;margin:6px 0}.row input{width:100%;padding:7px;border:1px solid #ccd3da;border-radius:7px;text-align:right}.row button{width:36px;height:34px;border:1px solid #ccd3da;background:#f6f8fa;border-radius:7px}.muted{color:#667085;font-size:12px}.schematic{overflow:auto}.schematic svg{min-width:720px;width:100%;height:170px}.status{font-size:12px;color:#475467;margin-top:8px}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.chartWrap canvas{height:310px}.tuneGrid{grid-template-columns:1fr}.row{grid-template-columns:62px 1fr 36px 36px}.app{padding:8px}}
</style>
</head>
<body>

<div id="app" class="app">
 <div class="top"><div><h1>LC Filter Simulator V11</h1><span class="badge">Real Topology • S11 / S21</span></div></div>
 <div class="card"><div class="grid">
  <div class="field"><label>Path</label><select id="path"><option>LPF</option><option>HPF</option></select></div>
  <div class="field"><label>Order</label><select id="order"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
  <div class="field"><label>Port 1 Z (Ω)</label><input id="z1" type="number" value="75" min="1" step="1"></div>
  <div class="field"><label>Port 2 Z (Ω)</label><input id="z2" type="number" value="75" min="1" step="1"></div>
  <div class="field"><label>Passband End (MHz)</label><input id="pb" type="number" value="85" min="0.001" step="0.001"></div>
  <div class="field"><label>Stopband Start (MHz)</label><input id="sb" type="number" value="108" min="0.001" step="0.001"></div>
  <div class="field"><label>X Start (MHz)</label><input id="x0" type="number" value="1" min="0.001" step="0.1"></div>
  <div class="field"><label>X End (MHz)</label><input id="x1" type="number" value="1218" min="0.01" step="1"></div>
  <div class="field"><label>Y Bottom (dB)</label><input id="y0" type="number" value="-80" step="1"></div>
  <div class="field"><label>Y Top (dB)</label><input id="y1" type="number" value="5" step="1"></div>
 </div><div class="actions" style="margin-top:10px"><button id="auto">Auto Calculate</button><button id="reset" class="secondary">Reset</button><label class="check"><input id="showS21" type="checkbox" checked>S21</label><label class="check"><input id="showS11" type="checkbox" checked>S11</label></div><div class="specNote">Auto Calculate 使用標準 Butterworth 起始值作為設計起點；手動調整後以目前實際拓撲重新計算。</div></div>
 <div class="card"><div class="chartWrap"><canvas id="chart"></canvas><div class="legend"><span><i class="dot"></i> S21</span><span><i class="dot s11"></i> S11</span></div><div id="markerInfo" class="markerInfo">Marker: —</div></div></div>
 <div class="card"><div class="sectionTitle">Circuit Topology</div><div id="schematic" class="schematic"></div></div>
 <div class="card"><div class="sectionTitle">Manual Tune <span class="muted">直接修改數值；± 每次 1 nH / 1 pF</span></div><div id="tune" class="tuneGrid"></div><div id="status" class="status"></div></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const state={path:'LPF',order:2,z1:75,z2:75,pb:85,sb:108,x0:1,x1:1218,y0:-80,y1:5,showS21:true,showS11:true,parts:[],markerF:85};
function num(id,def){const v=parseFloat($(id).value);return Number.isFinite(v)?v:def}
function setState(){state.path=$('path').value;state.order=+$('order').value;state.z1=Math.max(1,num('z1',75));state.z2=Math.max(1,num('z2',75));state.pb=Math.max(.001,num('pb',85));state.sb=Math.max(.001,num('sb',108));state.x0=Math.max(.001,num('x0',1));state.x1=Math.max(state.x0+.01,num('x1',1218));state.y0=num('y0',-80);state.y1=num('y1',5);state.showS21=$('showS21').checked;state.showS11=$('showS11').checked}
function omega(){return 2*Math.PI}
function c(re=0,im=0){return {re,im}}
function cadd(a,b){return {re:a.re+b.re,im:a.im+b.im}}
function cmul(a,b){return {re:a.re*b.re-a.im*b.im,im:a.re*b.im+a.im*b.re}}
function series(Z){return [[c(1,0),Z],[c(0,0),c(1,0)]]}
function shunt(Y){return [[c(1,0),c(0,0)],[Y,c(1,0)]]}
function mm(a,b){return [[cadd(cmul(a[0][0],b[0][0]),cmul(a[0][1],b[1][0])),cadd(cmul(a[0][0],b[0][1]),cmul(a[0][1],b[1][1]))],[cadd(cmul(a[1][0],b[0][0]),cmul(a[1][1],b[1][0])),cadd(cmul(a[1][0],b[0][1]),cmul(a[1][1],b[1][1]))]]} 
function zParallelLC(f,LnH,CpF){const w=2*Math.PI*f;const L=LnH*1e-9,C=CpF*1e-12;const ZL={re:0,im:w*L}, ZC={re:0,im:-1/(w*C)};const den={re:ZL.re+ZC.re,im:ZL.im+ZC.im};const n={re:ZL.re*ZC.re-ZL.im*ZC.im,im:ZL.re*ZC.im+ZL.im*ZC.re};const d=den.re*den.re+den.im*den.im;return {re:n.re/d,im:n.im/d}}
function zSeriesLC(f,LnH,CpF){const w=2*Math.PI*f;return {re:0,im:w*LnH*1e-9-1/(w*CpF*1e-12)}}
function add(a,b){return {re:a.re+b.re,im:a.im+b.im}} function mul(a,b){return {re:a.re*b.re-a.im*b.im,im:a.re*b.im+a.im*b.re}}
function div(a,b){const d=b.re*b.re+b.im*b.im;return {re:(a.re*b.re+a.im*b.im)/d,im:(a.im*b.re-a.re*b.im)/d}}
function mag2(a){return Math.hypot(a.re,a.im)}
function network(f){let M=[[c(1,0),c(0,0)],[c(0,0),c(1,0)]];for(let i=0;i<state.parts.length;i++){const p=state.parts[i];if(state.path==='LPF'){const zLpar=zParallelLC(f,p.L,p.Cpar);M=mm(M,series(zLpar));const w=2*Math.PI*f;const Y={re:0,im:w*p.Csh*1e-12};M=mm(M,shunt(Y));}else{const zc={re:0,im:-1/(2*Math.PI*f*p.Cser*1e-12)};M=mm(M,series(zc));const zlc=zSeriesLC(f,p.Lsh,p.Csh);const Y=div({re:1,im:0},zlc);M=mm(M,shunt(Y));}}
 // Termination-independent ABCD to S with real Z1/Z2
 const A=M[0][0],B=M[0][1],C=M[1][0],D=M[1][1];
 const den=add(add(A,{re:B.re/state.z2,im:B.im/state.z2}),add({re:C.re*state.z1,im:C.im*state.z1},D));
 const s11=div(add(add(A,{re:-B.re/state.z2,im:-B.im/state.z2}),add({re:-C.re*state.z1,im:-C.im*state.z1},D)),den);
 const s21=div({re:2*Math.sqrt(state.z1/state.z2),im:0},den);
 return {s11:20*Math.log10(Math.max(1e-12,mag2(s11))),s21:20*Math.log10(Math.max(1e-12,mag2(s21)))}
}
const bw={1:[1],2:[1.41421356,1.41421356],3:[1,2,1],4:[.76536686,1.84775907,1.84775907,.76536686],5:[.61803399,1.61803399,2,1.61803399,.61803399],6:[.51763809,1.41421356,1.93185165,1.93185165,1.41421356,.51763809]};
function autoCalc(){setState();const g=bw[state.order]||bw[2];state.parts=[];if(state.path==='LPF'){const fc=state.pb*1e6;for(let i=0;i<state.order;i++){const k=g[i];const isL=i%2===0;let L= isL ? k*state.z1/(2*Math.PI*fc)*1e9 : k*state.z1/(2*Math.PI*fc)*1e9;let C= isL ? k/(2*Math.PI*fc*state.z1)*1e12 : k/(2*Math.PI*fc*state.z1)*1e12;state.parts.push({L:Math.max(1,Math.round(L)),Cpar:Math.max(.1,Math.round(C)),Csh:Math.max(.1,Math.round(C))})}}else{const fc=state.sb>state.pb?state.sb:state.pb;const f0=fc*1e6;for(let i=0;i<state.order;i++){const k=g[i];const C=Math.max(.1,k/(2*Math.PI*f0*state.z1)*1e12);const L=Math.max(1,k*state.z1/(2*Math.PI*f0)*1e9);state.parts.push({Cser:Math.max(.1,Math.round(C)),Lsh:Math.max(1,Math.round(L)),Csh:Math.max(.1,Math.round(C*4))})}}
 renderAll('Auto Calculate completed');}
function reset(){state.path='LPF';state.order=2;state.z1=75;state.z2=75;state.pb=85;state.sb=108;state.x0=1;state.x1=1218;state.y0=-80;state.y1=5;$('path').value='LPF';$('order').value='2';$('z1').value=75;$('z2').value=75;$('pb').value=85;$('sb').value=108;$('x0').value=1;$('x1').value=1218;$('y0').value=-80;$('y1').value=5;$('showS21').checked=true;$('showS11').checked=true;autoCalc()}
function renderTune(){const el=$('tune');el.innerHTML='';state.parts.forEach((p,i)=>{const box=document.createElement('div');box.className='card';box.style.margin=0;box.innerHTML=`<div class="sectionTitle">Section ${i+1}</div>`+(state.path==='LPF'?row(i,'L','nH',p.L,1)+row(i,'Cpar','pF',p.Cpar,.1)+row(i,'Csh','pF',p.Csh,.1):row(i,'Cser','pF',p.Cser,.1)+row(i,'Lsh','nH',p.Lsh,1)+row(i,'Csh','pF',p.Csh,.1));el.appendChild(box)})}
function row(i,k,u,v,step){return `<div class="row"><span>${k} <small>${u}</small></span><input data-i="${i}" data-k="${k}" data-step="${step}" type="number" value="${v}" step="${step}" min="0.01"><button data-d="-1" data-i="${i}" data-k="${k}">−</button><button data-d="1" data-i="${i}" data-k="${k}">+</button></div>`}
function bindTune(){document.querySelectorAll('#tune input').forEach(inp=>inp.addEventListener('input',()=>{const i=+inp.dataset.i,k=inp.dataset.k;const v=parseFloat(inp.value);if(Number.isFinite(v)&&v>0){state.parts[i][k]=v;draw();drawSchematic();}}));document.querySelectorAll('#tune button').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.i,k=b.dataset.k,step=state.path==='LPF'?(k==='L'?1:0.1):(k==='Lsh'?1:0.1);state.parts[i][k]=Math.max(.01,state.parts[i][k]+(+b.dataset.d)*step);renderTune();bindTune();draw();drawSchematic();}));}
function drawSchematic(){const s=$('schematic');let x=30,svg=`<svg viewBox="0 0 ${Math.max(720,state.order*150+100)} 170" xmlns="http://www.w3.org/2000/svg"><line x1="20" y1="85" x2="${state.order*150+60}" y2="85" stroke="#344054" stroke-width="2"/>`;for(let i=0;i<state.order;i++){const cx=x+65;if(state.path==='LPF'){svg+=`<path d="M${x} 85 l10 -12 l10 24 l10 -24 l10 24 l10 -12" fill="none" stroke="#1769aa" stroke-width="3"/><line x1="${cx}" y1="109" x2="${cx}" y2="145" stroke="#344054"/><line x1="${cx-12}" y1="145" x2="${cx+12}" y2="145" stroke="#1769aa" stroke-width="3"/><line x1="${cx-12}" y1="153" x2="${cx+12}" y2="153" stroke="#1769aa" stroke-width="3"/><text x="${x}" y="30" font-size="12">S${i+1}: L ∥ C + Csh</text>`}else{svg+=`<line x1="${x}" y1="85" x2="${x+30}" y2="85"/><line x1="${x+35}" y1="70" x2="${x+35}" y2="100" stroke="#1769aa" stroke-width="3"/><line x1="${x+45}" y1="70" x2="${x+45}" y2="100" stroke="#1769aa" stroke-width="3"/><line x1="${x+50}" y1="85" x2="${x+85}" y2="85"/><line x1="${cx}" y1="85" x2="${cx}" y2="110" stroke="#344054"/><path d="M${cx} 110 l-10 12 l20 12 l-20 12 l20 12" fill="none" stroke="#1769aa" stroke-width="3"/><line x1="${cx}" y1="146" x2="${cx}" y2="155" stroke="#344054"/><text x="${x}" y="30" font-size="12">S${i+1}: Cser + Lsh-Csh</text>`}x+=150}svg+=`<text x="10" y="105" font-size="12">PORT 1</text><text x="${state.order*150+35}" y="105" font-size="12">PORT 2</text></svg>`;s.innerHTML=svg}
function draw(){const c=$('chart'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const ctx=c.getContext('2d');ctx.scale(d,d);const W=r.width,H=r.height;ctx.clearRect(0,0,W,H);const pad={l:48,r:14,t:25,b:30};const xMap=f=>pad.l+(Math.log10(f)-Math.log10(state.x0))/(Math.log10(state.x1)-Math.log10(state.x0))*(W-pad.l-pad.r);const yMap=v=>pad.t+(state.y1-v)/(state.y1-state.y0)*(H-pad.t-pad.b);ctx.strokeStyle='#29313d';ctx.lineWidth=1;for(let j=0;j<=5;j++){const y=pad.t+j*(H-pad.t-pad.b)/5;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();const val=state.y1-j*(state.y1-state.y0)/5;ctx.fillStyle='#b7c0cc';ctx.font='11px sans-serif';ctx.fillText(val.toFixed(0),5,y+4)}for(let i=0;i<=6;i++){const x=pad.l+i*(W-pad.l-pad.r)/6;ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,H-pad.b);ctx.stroke()}const pts=[];const n=700;for(let i=0;i<n;i++){const f=10**(Math.log10(state.x0)+(Math.log10(state.x1)-Math.log10(state.x0))*i/(n-1));const q=network(f*1e6);pts.push({f,s21:q.s21,s11:q.s11})}function curve(key,dash){ctx.strokeStyle=key==='s21'?'#4fc3f7':'#ffca58';ctx.lineWidth=2;ctx.setLineDash(dash? [5,4]:[]);ctx.beginPath();pts.forEach((p,i)=>{const x=xMap(p.f),y=yMap(Math.max(state.y0,Math.min(state.y1,p[key])));i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.setLineDash([])}if(state.showS21)curve('s21',false);if(state.showS11)curve('s11',true);const mx=Math.max(state.x0,Math.min(state.x1,state.markerF));const mi=Math.round((Math.log10(mx)-Math.log10(state.x0))/(Math.log10(state.x1)-Math.log10(state.x0))*(n-1));const mp=pts[Math.max(0,Math.min(n-1,mi))];const xx=xMap(mx);ctx.strokeStyle='#fff';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(xx,pad.t);ctx.lineTo(xx,H-pad.b);ctx.stroke();ctx.setLineDash([]);$('markerInfo').textContent=`Marker: ${mx.toFixed(3)} MHz | S21 ${mp.s21.toFixed(2)} dB | S11 ${mp.s11.toFixed(2)} dB`;c._xMap=xMap;c._pad=pad}
function renderAll(msg){setState();renderTune();bindTune();drawSchematic();draw();$('status').textContent=msg||`${state.path} ${state.order}-order • ${state.parts.length} sections`}
function marker(e){const c=$('chart'),rect=c.getBoundingClientRect(),x=e.clientX-rect.left;const pad=c._pad;const ratio=Math.max(0,Math.min(1,(x-pad.l)/(rect.width-pad.l-pad.r)));state.markerF=10**(Math.log10(state.x0)+ratio*(Math.log10(state.x1)-Math.log10(state.x0)));draw()}
$('auto').onclick=autoCalc;$('reset').onclick=reset;['path','order','z1','z2','pb','sb','x0','x1','y0','y1','showS21','showS11'].forEach(id=>$(id).addEventListener('change',()=>{if(id==='path'||id==='order')autoCalc();else renderAll('Settings updated')}));$('chart').addEventListener('pointerdown',e=>{e.preventDefault();$('chart').setPointerCapture?.(e.pointerId);marker(e)});$('chart').addEventListener('pointermove',e=>{if(e.buttons)marker(e)});window.addEventListener('resize',draw);
document.addEventListener('DOMContentLoaded',()=>{try{autoCalc();}catch(e){console.error(e);$('status').textContent='初始化錯誤：'+e.message;}});
</script></body></html>
