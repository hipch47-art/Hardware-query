tream transmit power commanded by the CMTS, up to the capability\n            of the CM. If the Extended Upstream Transmit Power Support TLV in the MDD is OFF, the CMTS MUST\n            NOT command the CM to a transmit power above Pmax listed in Table 6–7. If the Extended Upstream\n            Transmit Power Support TLV in the MDD is ON, the CMTS MUST NOT command the CM to a transmit\n            power above 61 dBmV. When this TLV is on, the CM is expected to be commanded to exceed the transmit\n            power Pmax listed in Table 6–7 by an amount that is vendor-specific, meeting operator requirements.\n\n31\n     Revised per PHYv3.0-N-10.0942-5 on 9/21/10 by JB. Revised per PHYv3.0-N-14.1173-2 on 1/5/15 by JB.\n\n\n                                                                     \n80                                                      CableLabs                                             12/07/17\n\fPhysical Layer Specification                                                           CM-SP-PHYv3.0-C01-171207\n\n\n           Note that all fidelity requirements specified in Section 6.2.22 still apply when the CM is operating over an\n           extended upstream transmit power range.\n            Table 6–10 - Minimum Transmit Power Pmin for Multiple Transmit Channel mode Not Enabled\n\n        Modulation Rate (kHz)                      Pmin (dBmV)                              Applicability\n                     160                                    17                             CM MAY support\n                     320                                    17                             CM MAY support\n                     640                                    17                             CM MAY support\n                    1280                                    17                            CM MUST support\n                    2560                                    20                            CM MUST support\n                    5120                                    23                            CM MUST support",71]],"viewer":{"atp_file":"pdf/CM-TP-PHYv3.0-Acceptance Test Plan(ATP)-I05-100204.pdf","atp_page":74,"spec_file":"pdf/CM-SP-PHYv3.0-C01-171207.pdf","spec_pages":[71],"atp_revision":"I05 Issued","spec_revision":"C01"}},"PHY 13.3":{"version":"D3.0","atp_page":null,"atp":"","spec":[["6.2.23 Upstream Demodulator Input Power Characteristics","6.2.23 Upstream Demodulator Input Power Characteristics\nThe instantaneous input signal level, including ingress and noise to the upstream demodulator, MUST NOT exceed\n29 dBmV in the 5-85 MHz frequency range of operation. The intended received power in each carrier MUST be\nwithin the values shown in Table 6–20.\n\n\n\n\n                                                                  \n96                                                   CableLabs                                              12/07/17\n\fPhysical Layer Specification                                                          CM-SP-PHYv3.0-C01-171207\n\n\nThe demodulator MUST operate within its defined performance specifications with received bursts within ±6 dB of\nthe nominal commanded received power. Thus the maximum power in a received burst MUST be less than or equal\n29 dBmV.\n                      Table 6–20 - Upstream Channel Demodulator Input Power Characteristics\n\n        Modulation Rate (kHz)               Maximum Range (dBmV)                         Applicability\n                   160                                -13 to +17                       CMTS MAY support\n                   320                                -13 to +17                       CMTS MAY support\n                   640                                -13 to +17                       CMTS MAY support\n                  1280                                -13 to +17                       CMTS MUST support\n                  2560                                -10 to +20                       CMTS MUST support\n                  5120                                -7 to +23                        CMTS MUST support\n\n                                                           45",96]],"viewer":{"atp_file":"pdf/CM-TP-PHYv3.0-Acceptance Test Plan(ATP)-I05-100204.pdf","atp_page":115,"spec_file":"pdf/CM-SP-PHYv3.0-C01-171207.pdf","spec_pages":[96],"atp_revision":"I05 Issued","spec_revision":"C01"}},"PHY 15.3":{"version":"D3.0","atp_page":null,"atp":"","spec":[["6.2.17 Spectral Shaping","6.2.17 Spectral Shaping\nThe CM upstream transmitter MUST approximate a Nyquist square-root raised-cosine pulse-shaping filter with roll-\noff factor alpha =0.25. For operation with a DOCSIS 3.0 CMTS (unless the CMTS is operating as a pre-3.0\nDOCSIS CMTS), the CM -30 dB transmitted bandwidth MUST NOT exceed the Channel Width values in Table 6–\n5. For backward compatibility with a CMTS operating as a pre-3.0-DOCSIS CMTS, the CM -30 dB transmitted\nbandwidth MUST NOT exceed the Channel Width values in Table 6–6. The Channel Width values are given\nanalytically by:\n\n                                  ChannelWidth = ModulationRate*(1+alpha).\n\n                     Table 6–5 - Maximum Channel Width for Operation with a DOCSIS 3.0 CMTS\n\n                           Modulation Rate (kHz)                        Channel Width (kHz)\n                                       1280                                     1600\n                                       2560                                     3200\n                                       5120                                     6400\n\n\n                  Table 6–6 - Maximum Channel Width for Operation with a pre-3.0-DOCSIS CMTS\n\n                       Modulation Rate            Channel Width (kHz)            Applicability\n                           (kHz)\n                                160                         200                  CM MAY support\n                                320                         400                  CM MAY support\n                                640                         800                  CM MAY support\n                               1280                        1600                 CM MUST support\n                               2560                        3200                 CM MUST support\n                               5120                        6400                 CM MUST support\n\n                                                           14\n6.2.17.1 Upstream Frequency Agility and Range\nThe CM MUST support:\n    • Operation over the Standard Upstream Frequency Range of 5-42MHz edge to edge, or\n    • Operation over the Extended Upstream Frequency Range of 5-85 MHz, edge to edge or\n    • Selectable operation between the Standard Upstream Frequency Range of 5-42MHz and the Extended\n       Upstream Frequency Range of 5-85MHz.\nOffset frequency commands MUST be supported per Table 6–12.\n\n\n14\n     Revised per PHYv3.0-N-14.1207-2 by JB on 1/5/15.\n\n\n                                                                    \n70                                                      CableLabs                                        12/07/17\n\fPhysical Layer Specification                                                       CM-SP-PHYv3.0-C01-171207\n\n\n6.2.17.2 Spectrum Format\nThe upstream modulator MUST provide operation with the format s(t) = I(t)*cos(ωt) - Q(t)*sin(ωt), where t denotes\ntime and ω denotes angular frequency.",70],["6.2.22 Fidelity Requirements","6.2.22 Fidelity Requirements\nThe following requirements assume that any pre-equalization is disabled, unless otherwise noted.\nThe lower band edge of the CM’s upstream is 5 MHz; the upper band edge of the CM’s upstream is 42 MHz, 85\nMHz, or selectable between 42 MHz and 85 MHz. If the CM supports a frequency range of 5 to 42 MHz edge to\nedge, it is only required to support the fidelity requirements provided for an operating range of 5-42 MHz. If the CM\nsupports a frequency range of 5 to 85 MHz edge to edge, it is only required to support the fidelity requirements\nprovided for an operating range of 5-85 MHz. If the CM supports a selectable frequency range, it is required to\nsupport the fidelity requirements provided for both an operating range of 5-42 MHz and an operating range of 5-85\nMHz.\n6.2.22.1 Spurious Emissions\nThe noise and spurious power MUST NOT exceed the levels given in Table 6–14, Table 6–15, and Table 6–17. The\nnoise and spurious power SHOULD NOT exceed the levels given in Table 6–16 and Table 6–18. When Multiple\nTransmit Channel mode is enabled, the noise and spurious power requirements for the individual channels are\n37\n     Revised per PHYv3.0-N-14.1207-2 by JB on 1/5/15.\n\n\n                                                                                  \n88                                                              CableLabs                                           12/07/17\n\fPhysical Layer Specification                                                         CM-SP-PHYv3.0-C01-171207\n\n\nsummed (absolute power, NOT in dB) to determine the composite noise floor for the multi-channel transmission\ncondition. Also when Multiple Transmit Channel mode is enabled, these spurious performance requirements only\napply when the CM is operating within certain ranges of values for Pload_n, for n = 1 to the number of upstream\nchannels in the Transmit Channel Set, and for the ratio of number_allocated_codes / number_active_codes from 1\ndown to 1/4th, for S-CDMA channels.\nFor S-CDMA mode, when a modem is transmitting fewer than 1/4th of the active spreading codes on a channel, the\nspurious emissions requirement limit is the power value (in dBmV), corresponding to the specifications for the\npower level associated with 1/4th of the active spreading codes (i.e., 6 dB below the channel power corresponding to\nall active codes for that channel allocated to the CM).\nWhen Multiple Transmit Channel mode is enabled and there are two or more channels in the Transmit Channel Set,\nthe spurious performance requirements MUST be met only when the following loading ranges are satisfied:\n       Two or more channels in the TCS: applicable when Pload_1 – Pload_min_set ≤ 3 dB, AND\n       Two channels in the TCS: applicable when Pload_2 – Pload_1 ≤ 12 dB.\n       Three channels in the TCS: applicable when Pload_3 – Pload_1 ≤ 8 dB.\n       Four channels in the TCS: applicable when:\n            Pload_2 – Pload_1 ≤ 4 dB.\n       AND            Pload_3 – Pload_2 ≤ 4 dB. 38\n       AND            Pload_4 – Pload_3 ≤ 4 dB.\nWhen a modem is transmitting at power levels falling outside these loading ranges (which is allowed by the 12 dB\ndynamic range), the spurious emissions requirement limits are the power values (in dBmV rather than dBc)\ncorresponding to the specifications associated with transmissions at the second and higher loaded channels if the\nloading of those channels were decreased (transmit power increased) to just meet the applicability ranges.\nWith Multiple Transmit Channel mode enabled, the spurious performance requirements do not apply to any\nupstream channel from the time the output power on any active upstream channel has varied by more than ±3 dB\nsince the last global reconfiguration time through the end of the next global reconfiguration time changes, excluding\ntransmit power changes due to UCD-induced change in Phi [MULPI3.0]. \"Global reconfiguration time\" is defined as\nthe inactive time interval provided between active transmissions, which simultaneously satisfies the requirement in\nSection 6.2.20.2 for all TDMA channels in the TCS and the requirement in Section 6.2.20.3 for all S-CDMA\nchannels in the TCS. With Multiple Transmit Channel mode enabled, the CMTS SHOULD provide global\nreconfiguration time to a CM before (or concurrently as) the CM has been commanded to change any upstream\nchannel transmit power by ±3 dB cumulative since its last global reconfiguration time, excluding transmit power\nchanges due to UCD-induced change in Phi [MULPI3.0]. 39\nAs one example, with three S-CDMA channels in the TCS, at transmit powers per channel of 53 dBmV, 41 dBmV,\nand 41 dBmV, the absolute spurious emissions requirements, when two or more channels in the TCS are\ntransmitting, correspond to the absolute spurious emissions requirements with transmit power per channel of 53\ndBmV, 45 dBmV, and 45 dBmV. The 41 dBmV power levels are raised for the purposes of determining the\nspurious emissions limits, up to 53 dBmV – 8 dB = 45 dBmV.\nAs an example, with four S-CDMA channels in the TCS, at transmit powers per channel of 53 dBmV, 41 dBmV, 41\ndBmV, and 41 dBmV, the absolute spurious emissions requirements, when two or more channels in the TCS are\ntransmitting, correspond to the absolute spurious emissions requirements with transmit power per channel of 53\ndBmV, 49 dBmV, 45 dBmV, and 41 dBmV. The 41 dBmV power levels are raised for the purposes of determining\nthe spurious emissions limits, up to 53 dBmV – 4 dB = 49 dBmV; and the artificial 49 dBmV – 4 dB = 45 dBmV;\nand the artificial 45 dBmV – 4 dB = 41 dBmV.\nIn Table 6–14, inband spurious emissions includes noise, carrier leakage, clock lines, synthesizer spurious products,\nand other undesired transmitter products. It does not include ISI. The measurement bandwidth for Inband spurious is\n\n\n38\n     Paragraph revised per PHYv3.0-N-06.0340-1 by GO on 1/11/07.\n39\n     Paragraph revised per PHYv3.0-N-08.0611-3 on 4/10/08 by KN.\n\n\n                                                                    \n12/07/17                                               CableLabs                                                  89\n\fCM-SP-PHYv3.0-C01-171207                                       Data-Over-Cable Service Interface Specifications\n\n\nequal to the modulation rate (e.g., 1280 to 5120 kHz). All requirements expressed in dBc are relative to the actual\ntransmit power that the CM emits in one channel.\nThe measurement bandwidth is 160 kHz for the Between Bursts (none of the channels in the TCS are bursting) specs\nof Table 6–14, except where called out as 4 MHz or 250 kHz.\nThe Transmitting Burst specs apply during the mini-slots granted to the CM (when the CM uses all or a portion of\nthe grant), and for 32 modulation intervals before and after the granted mini-slots. The Between Bursts specs apply\nexcept during a used grant of mini-slots on any active channel for the CM, and the 32 modulation intervals before\nand after the used grant.\nIn TDMA mode, a mini-slot may be as short as 32 modulation intervals, or 6.25 µs at the 5.12 MHz rate, or as short\nas 25 µs at the 1.28 MHz rate. 40\n                                                                            41\n                                        Table 6–14 - Spurious Emissions\n\n                 Parameter                           Transmitting Burst                   Between Bursts\nInband                                           -40 dBc                           -72 dBc\nAdjacent Band                                    See Table 6–15 and                -72 dBc\n                                                 Table 6–16.\nWithin the upstream operating range 5-42         See Table 6–17 and                -72 dBc\nMHz or 5-85 MHz (excluding assigned              Table 6–18.\nchannel, adjacent channels)\nFor the case where the upstream operating\nrange is 5-42 MHz:\nCM Integrated Spurious Emissions Limits\n(all in 4 MHz, includes discretes)1\n42 to 54 MHz                                     -40 dBc                           -26 dBmV\n54 to 60 MHz                                     -35 dBmV                          -40 dBmV\n60 to 88 MHz                                     -40 dBmV                          -40 dBmV\n88 to 870 MHz, or 1002 MHz if CM center          -45 dBmV                          max(-45 dBmV, -40 dB ref d/s2)\nfrequency ranges up to 999 MHz\nFor the case where the upstream operating\nrange is 5-42 MHz:\nCM Discrete Spurious Emissions Limits1\n42 to 54 MHz                                     -50 dBc                           -36 dBmV\n54 to 88 MHz                                     -50 dBmV                          -50 dBmV\n88 to 870 MHz, or 1002 MHz if CM center          -50 dBmV                          -50 dBmV\nfrequency ranges up to 999 MHz\nFor the case where the upstream operating\nrange is 5-85 MHz:\nCM Integrated Spurious Emissions Limits\n(all in 4 MHz, includes discretes)3\n85 to 108 MHz                                    -45 dBc                           -31 dBmV\n85 to 108 MHz (SHOULD)                           -50 dBc                           -36 dBmV\n108 to 136 MHz                                   -40 dBmV                          -40 dBmV\n136 to 870 MHz, or 1002 MHz if CM center         -45 dBmV                          max(-45 dBmV, -40 dB ref d/s4)\nfrequency ranges up to 999 MHz\n\n\n\n\n40\n  Paragraph modified per PHYv3.0-N-07.0465-1 #3 on 7/2/07 by KN.\n41\n  Table modified per PHYv3.0-N-07.0456-1 on 6/12/07, per PHYv3.0-N-07.0465-1 on 7/2/07, and per PHYv3.0-N-08.0361-1\non 4/17/08 by KN.\n\n\n                                                                  \n90                                                   CableLabs                                              12/07/17\n\fPhysical Layer Specification                                                          CM-SP-PHYv3.0-C01-171207\n\n\n\n                 Parameter                            Transmitting Burst                     Between Bursts\nFor the case where the upstream operating\nrange is 5-85 MHz:\nCM Discrete Spurious Emissions Limits1\n85 to 108 MHz                                     -50 dBc                            -36 dBmV\n108 to 870 MHz, or 1002 MHz if CM center          -50 dBmV                           -50 dBmV\nfrequency ranges up to 999 MHz\n\nTable Notes:\nNote 1    These spec limits exclude a single discrete spur related to the tuned received channel; this single discrete\nspur MUST be no greater than -40 dBmV.\nNote 2 \"dB ref d/s\" is relative to the received downstream signal level. Some spurious outputs are proportional to\nthe receive signal level.\nNote 3 These spec limits exclude a single discrete spur related to the tuned received channel; this spur MUST be\nno greater than -40 dBmV.\nNote 4 \"dB ref d/s\" is relative to the received downstream signal level.\n\n\n6.2.22.1.1 Adjacent Channel Spurious Emissions\nSpurious emissions from a transmitted carrier may occur in an adjacent channel which could be occupied by a\ncarrier of the same or different modulation rate. Table 6–15 lists the required adjacent channel spurious emission\nlevels for all combinations of transmitted carrier modulation rates and adjacent channel modulation rates. The\nmeasurement is performed in an adjacent channel interval of appropriate bandwidth and distance from the\ntransmitted carrier, based on the modulation rates of the transmitted carrier, and the carrier in the adjacent channel.\n Table 6–15 - Adjacent Channel Spurious Emissions Requirements Relative to the Per Channel Transmitted\n                                  Burst Power Level for Each Channel\n\n Specification in the           Measurement interval and distance                    Adjacent channel carrier\n      interval                         from carrier edge                                 modulation rate\n         -50 dBc                            20 kHz to 180 kHz                                   160 kHz\n         -50 dBc                            40 kHz to 360 kHz                                   320 kHz\n         -50 dBc                            80 kHz to 720 kHz                                   640 kHz\n         -50 dBc                          160 kHz to 1440 kHz                                  1280 kHz\n         -47 dBc                          320 kHz to 2880 kHz                                  2560 kHz\n         -44 dBc                          640 kHz to 5760 kHz                                  5120 kHz\n\n\nIn addition, the CM SHOULD meet the requirements in Table 6–16, under the same conditions as listed for Table 6–\n15 above. With a lower power channel bursting as a lone bursting channel (at that point in time), 2 dB relaxation\nwill apply to the absolute spurious emissions requirement of Table 6–16.\n  Table 6–16 - Adjacent Channel Spurious Emissions Goals Relative to the Per Channel Transmitted Burst\n                                     Power Level for Each Channel\n\n   Specification in the            Measurement interval and distance                   Adjacent channel carrier\n        interval                          from carrier edge                                modulation rate\n           -53 dBc                             20 kHz to 180 kHz                                  160 kHz\n           -53 dBc                             40 kHz to 360 kHz                                  320 kHz\n           -52 dBc                             80 kHz to 720 kHz                                  640 kHz\n           -51 dBc                            160 kHz to 1440 kHz                                1280 kHz\n\n\n                                                                   \n12/07/17                                              CableLabs                                                       91\n\fCM-SP-PHYv3.0-C01-171207                                        Data-Over-Cable Service Interface Specifications\n\n\n\n      Specification in the           Measurement interval and distance                Adjacent channel carrier\n           interval                         from carrier edge                             modulation rate\n             -50 dBc                           320 kHz to 2880 kHz                              2560 kHz\n             -48 dBc                           640 kHz to 5760 kHz                              5120 kHz\n\n                                                                           42\n6.2.22.1.2 Spurious Emissions in the Upstream Frequency Range\nTable 6–17 lists the possible modulation rates that could be transmitted in an interval, the required spurious level in\nthat interval, and the initial measurement interval at which to start measuring the spurious emissions. Measurements\nshould start at the initial distance and be repeated at increasing distance from the carrier until the upstream band\nedge is reached. The lower band edge of the upstream is 5 MHz; the upper band edge of the upstream is 42 MHz ,\n85 MHz, or 85 MHz with upstream frequency range selection.\n       Table 6–17 - Spurious Emissions Requirements in the Upstream Frequency Range Relative to the Per\n                            Channel Transmitted Burst Power Level for Each Channel\n\n Possible modulation rate in                Specification in the            Initial measurement interval and\n        this interval                            interval                       distance from carrier edge\n                160 kHz                            -54 dBc                           220 kHz to 380 kHz\n                320 kHz                            -52 dBc                           240 kHz to 560 kHz\n                640 kHz                            -50 dBc                           280 kHz to 920 kHz\n               1280 kHz                            -50 dBc                          360 kHz to 1640 kHz\n               2560 kHz                            -47 dBc                          520 kHz to 3080 kHz\n               5120 kHz                            -44 dBc                          840 kHz to 5960 kHz\n\n\nIn addition, the CM SHOULD meet the requirements in Table 6–18, under the same conditions as listed for Table 6–\n17 above. With a lower power channel bursting as a lone bursting channel (at that point in time), 2 dB relaxation\nwill apply to the absolute spurious emissions requirement of Table 6–18.\n      Table 6–18 - Spurious Emissions Goals in the Upstream Frequency Range Relative to the Per Channel\n                               Transmitted Burst Power Level for Each Channel\n\n Possible modulation rate in                Specification in the            Initial measurement interval and\n        this interval                            interval                       distance from carrier edge\n               160 kHz                              -60 dBc                          220 kHz to 380 kHz\n               320 kHz                              -58 dBc                          240 kHz to 560 kHz\n               640 kHz                              -56 dBc                          280 kHz to 920 kHz\n               1280 kHz                             -54 dBc                          360 kHz to 1640 kHz\n               2560 kHz                             -52 dBc                          520 kHz to 3080 kHz\n               5120 kHz                             -50 dBc                          840 kHz to 5960 kHz\n\n\n6.2.22.2 Spurious Emissions During Burst On/Off Transients\nEach transmitter MUST control spurious emissions, prior to and during ramp-up, during and following ramp-down,\nand before and after a burst.\nOn/off spurious emissions, such as the change in voltage at the upstream transmitter output, due to enabling or\ndisabling transmission, MUST be no more than 100 mV. Such a step MUST be dissipated no faster than 2 µs of\n\n42\n     Revised per PHYv3.0-N-14.1207-2 by JB on 1/5/15.\n\n\n                                                                    \n92                                                      CableLabs                                             12/07/17\n\fPhysical Layer Specification                                                          CM-SP-PHYv3.0-C01-171207\n\n\nconstant slewing. This requirement applies when the CM is transmitting at +55 dBmV or more per channel on any\nchannel. At backed-off transmit levels, the maximum change in voltage MUST decrease by a factor of 2 for each 6\ndB decrease of power level in the highest power active channel, from +55 dBmV per channel, down to a maximum\nchange of 7 mV at 31 dBmV per channel and below. This requirement does not apply to CM power-on and power-\noff transients. 43\n6.2.22.3 Modulation Error Ratio (MER)\nMER measures the cluster variance caused by the transmit waveform. It includes the effects of ISI, spurious, phase\nnoise, and all other transmitter degradations.\n6.2.22.3.1 Definitions\nSymbol MER: MERsymb is defined as follows for TDMA or S-CDMA symbols. The transmitted RF waveform\n(after appropriate down conversion) is applied to the ideal receive symbol matched filter and is sampled once per\nsymbol. For TDMA, the matched filter is a square-root raised cosine filter with alpha = 0.25. For S-CDMA, the\nmatched filter is a square-root raised cosine filter with alpha = 0.25, convolved with the time-reversed spreading\ncode sequence. (In this convolution, the spreading code sequence is expressed as a weighted impulse train spaced at\nthe chip period.) No external noise (AWGN) is added to the signal. The carrier frequency offset, carrier phase offset,\nsymbol timing and gain may be adjusted during each burst to maximize MERsymb. Equalization of the received\nwaveform is not permitted. For cases where the CM transmit equalizer is ON, the transmit equalizer coefficients\nmay be adjusted to maximize MERsymb. MERsymb is defined at the F connector of the CM, except that when an echo\nchannel is inserted, MERsymb is defined at the output of the echo channel. MERsymb is computed by the formula:\n\n                                                                           \n                                                                           \n                                                                           \n                                      MERsymb (dB ) = 10 • log10 \n                                                                    E av\n                                                                     N      \n                                                                 1\n                                                                         ∑\n                                                                           2\n                                                                 N      ej \n                                                                   j =1    \nwhere:\n       Eav is the average constellation energy for equally likely symbols (see Section 6.2.14 and Figure 6–20),\n       N is the number of symbols averaged;\n       ej is the error vector from the jth received symbol to the ideal transmitted QAM symbol on the grid of\n       Figure 6–20.\nFor S-CDMA, MERsymb is averaged over all active codes.\nMER of composite chips: MERchip is specified for composite S-CDMA chips to ensure that high SNR is\nmaintained, especially for a small number of allocated codes, to prevent noise funneling effects when many modems\ntransmit simultaneously. A composite S-CDMA chip is defined as the output of the spreader during one chip\ninterval, that is, an element of the transmission vector defined in Section 6.2.15, \"S-CDMA Spreader\".\nMERchip is defined as follows: The transmitted RF waveform (after appropriate down conversion) is applied to the\nideal receive chip matched filter and is sampled once per chip. The matched filter is a square-root raised cosine filter\nwith alpha = 0.25. No external noise (AWGN) is added to the signal. The carrier frequency offset, carrier phase\noffset, timing and gain may be adjusted during each burst to maximize MERchip. Equalization of the received\nwaveform is not permitted. For cases where the CM transmit equalizer is ON, the transmit equalizer coefficients\nmay be adjusted to maximize MERchip. MERchip is defined at the F connector of the CM. MERchip is computed by the\nformula where:\n\n\n\n\n43\n     Revised paragraph per PHYv3.0-N-06.0341-1 by GO on 1/12/07.\n\n\n                                                                    \n12/07/17                                               CableLabs                                                     93\n\fCM-SP-PHYv3.0-C01-171207                                        Data-Over-Cable Service Interface Specifications\n\n\n\n                                                                 N       2   \n                                                                 ∑ pj        \n                                                                 j =1        \n                                     MERchip (dB ) = 10 • log10  N           \n                                                                            2\n                                                                 ∑ p j − rj \n                                                                 j =1       \nwhere:\n       pj is the jth ideal transmitted composite chip\n       rj is the jth received composite chip\n       N is the number of composite chips observed\n6.2.22.3.2 Requirements\nUnless otherwise stated, the MER MUST meet or exceed the following limits over the full transmit power range of\nTable 6–12 for each modulation, modulation rate, and over the full carrier frequency range, and for S-CDMA, over\nany valid number of active and allocated codes. The 5-85 MHz carrier frequency range refers more precisely to [5\nMHz + modulation rate * 1.25 / 2] to [85 MHz - modulation rate * 1.25 / 2]. At the break points between regions,\nthe higher MER specification applies.\nCase 1: Flat channel, transmit equalization OFF\nCase 1a: for modulation rates 2.56 MHz and below for 5 MHz to 42 MHz mode of operation:\n       MERsymb ≥ 30 dB over 15 to 30 MHz carrier frequency\n       MERsymb ≥ 27 dB over 10 MHz to 15 MHz and 30 MHz to 35 MHz carrier frequency\n       MERsymb ≥ 26 dB over 5 MHz to 10 MHz and 35 MHz to 42 MHz carrier frequency\nCase 1b: for modulation rate 5.12 MHz for 5 MHz to 42 MHz mode of operation:\n       MERsymb ≥ 27 dB over 15 to 30 MHz carrier frequency\n       MERsymb ≥ 24 dB over 10 MHz to 15 MHz and 30 MHz to 35 MHz carrier frequency\n       MERsymb ≥ 23 dB over 5 MHz to 10 MHz and 35 MHz to 42 MHz carrier frequency\nCase 1c: for modulation rates 2.56 MHz and below for 5 MHz to 85 MHz mode of operation:\n       MERsymb ≥ 30 dB over 15 to 61 MHz carrier frequency\n       MERsymb ≥ 27 dB over 10 MHz to 15 MHz and 61 MHz to 71 MHz carrier frequency\n       MERsymb ≥ 26 dB over 5 MHz to 10 MHz and 71 MHz to 85 MHz carrier frequency\nCase 1d: for modulation rate 5.12 MHz for 5 MHz to 85 MHz mode of operation:\n       MERsymb ≥ 27 dB over 15 to 61 MHz carrier frequency\n       MERsymb ≥ 24 dB over 10 MHz to 15 MHz and 61 MHz to 71 MHz carrier frequency\n       MERsymb ≥ 23 dB over 5 MHz to 10 MHz and 71 MHz to 85 MHz carrier frequency\nCase 2: Flat channel, transmit equalization ON\nCase 2a: for TDMA/QPSK, MERsymb ≥ 30 dB.\nCase 2b: for S-CDMA and all TDMA modulations except QPSK, MERsymb ≥ 35 dB.\nCase 2c: for S-CDMA, MERchip ≥ 33 dB.\nCase 3: Echo channel, transmit equalization ON 44\n(Echo channel MUST NOT be limited by dynamic range. Echo channel MUST be a true representation described in\nTable 5–2.)\nCase 3a: In the presence of a single echo selected from the channel micro-reflections defined in Table 5–2, the\nmeasured MERsymb MUST be ≥30 dB for TDMA/QPSK, and ≥33 dB for S-CDMA and all TDMA modulations,\nexcept QPSK.\n\n\n44\n     Revised Case 3 per PHYv3.0-N-06.0341-1 by GO on 1/12/07.\n\n\n                                                                    \n94                                                      CableLabs                                       12/07/17\n\fPhysical Layer Specification                                                          CM-SP-PHYv3.0-C01-171207\n\n\nCase 3b: In the presence of two or three of the echoes defined in Table 5–2 (at most one of each specified magnitude\nand delay), the measured MERsymb MUST be ≥29 dB.\nSince the table does not bound echo delay for the -30 dBc case, for testing purposes, it is assumed that the time span\nof the echo at this magnitude is less than or equal to 1.5 µs.\nThe CMTS MUST provide a test mode in which it:\n•   accepts equalizer coefficients via an external interface, (e.g., Ethernet).\n•   sends the coefficients to the CM's pre-equalizer via ranging response message (both load and convolve modes).\n•   does not adjust the CM's frequency, timing or power.\n6.2.22.4 Filter Distortion\nThe following requirements assume that any pre-equalization is disabled.\n6.2.22.4.1 Amplitude\nThe spectral mask MUST be the ideal square-root raised-cosine spectrum with alpha = 0.25, within the ranges given\nin Table 6–19.\n                               Table 6–19 - Single Channel Filter Amplitude Distortion\n\n                   Frequency                                                Spectral Mask Limits\n\n                                                                 Lower                             Upper\n                      fc - 5Rs/8                                        -                           -30dB\n                       fc - Rs/2                                   -3.5dB                          -2.5dB\n                fc - 3Rs/8 to fc - Rs/4                            -0.5dB                          +0.3dB\n                fc - Rs/4 to fc + Rs/4                             -0.3dB                          +0.3dB\n               fc + Rs/4 to fc + 3Rs/8                             -0.5dB                          +0.3dB\n                      fc + Rs/2                                    -3.5dB                          -2.5dB\n                     fc + 5Rs/8                                         -                           -30dB\n\n\nWhere fc is the center frequency, Rs is the modulation rate, and the spectral density is measured with a resolution\nbandwidth of 10 kHz or less.\n6.2.22.5 Carrier Phase Noise\nThe upstream transmitter total integrated phase noise (including discrete spurious noise) MUST be less than or equal\nto -46 dBc, summed over the spectral regions spanning 200 Hz to 400 kHz above and below the carrier.\nThe upstream transmitter total integrated phase noise (including discrete spurious noise) MUST be less than or equal\nto -44 dBc, summed over the spectral regions spanning 8 kHz to 3.2 MHz above and below the carrier.\nThe CM MUST provide a test mode in which:\n•   A continuous (non-bursted), unmodulated (CW) upstream signal is transmitted at the commanded carrier\n    frequency, modulation rate and level. This is equivalent to replacing the chip sequence at the spreader output\n    with the constant sequence (1, 1, 1, 1, 1, 1,...) at nominal amplitude, equal on both I and Q.\n•   The CM tracks the downstream symbol clock and uses it to generate the upstream symbol clock as in normal\n    synchronous operation.\n6.2.22.6 Channel Frequency Accuracy\nThe CM MUST implement the assigned channel frequency within ±50 parts per million, over a temperature range of\n0 to 40 degrees C, and up to five years from date of manufacture.\n\n\n\n                                                                    \n12/07/17                                              CableLabs                                                       95\n\fCM-SP-PHYv3.0-C01-171207                                       Data-Over-Cable Service Interface Specifications\n\n\n6.2.22.7 Modulation Rate Accuracy\nThe MDD message [MULPI3.0] provides a TLV field that indicates whether the CMTS is providing a synchronous\ndownstream symbol clock, i.e., whether the downstream symbol clock is locked to the 10.24 MHz Master Clock. If\nthe MDD indicates that the downstream symbol clock is synchronous, the CM MUST lock its timing to the\ndownstream symbol clock. If the MDD indicates that the downstream symbol clock is asynchronous, the CM MUST\nNOT lock its timing to the downstream symbol clock.\nIn synchronous operation (i.e., when the CM is locked to the downstream symbol clock), the upstream modulator\nMUST lock the upstream modulation rate of all upstream channels (S-CDMA and/or TDMA) to the downstream\nsymbol rate, subject to the symbol timing jitter requirements of Section 6.2.22.8.\nIn asynchronous operation (i.e., when the CM timing is not locked to the downstream symbol clock), the upstream\nmodulator MUST provide an absolute modulation rate accuracy of symbol rates, ±50 parts per million, over a\ntemperature range of 0 to 40 degrees C, up to five years from date of manufacture.\n6.2.22.8 Modulation Timing Jitter\n6.2.22.8.1 Symbol Timing Jitter for TDMA Upstream Channels in Asynchronous Operation\nFor TDMA upstream channels in asynchronous operation, peak-to-peak symbol jitter, referenced to the previous\nsymbol zero-crossing of the transmitted waveform, MUST be less than 0.02 of the nominal symbol duration over a 2\ns period. In other words, the difference between the maximum and the minimum symbol duration during the 2 s\nperiod shall be less than 0.02 of the nominal symbol duration for each of the five upstream symbol rates.\nFor TDMA upstream channels in asynchronous operation, the peak-to-peak cumulative phase error, referenced to\nthe first symbol time, and with any fixed symbol frequency offset factored out, MUST be less than 0.04 of the\nnominal symbol duration over a 0.1 s period. In other words, the difference between the maximum and the minimum\ncumulative phase error during the 0.1 s period shall be less than 0.04 of the nominal symbol duration for each of the\nfive upstream symbol rates. Factoring out a fixed symbol frequency offset is to be done by using the computed mean\nsymbol duration during the 0.1 s.\n6.2.22.8.2 Modulation Timing Jitter for Synchronous Operation\nAll jitter specifications assume a downstream input to the CM per Sections 6.3.5, 6.3.3, and [DRFI].\nFor S-CDMA and TDMA upstream channels in synchronous operation, upstream modulation clock timing error\n(with the mean error subtracted out) relative to the CMTS master clock MUST be less than 0.005 RMS of the\nmodulation interval over a 35 s measurement duration. This applies to: 1) the worst-case jitter and frequency drift\nspecified for the CMTS Master clock and the CMTS downstream symbol clock in the requirements above; and 2)\nfor any round-trip propagation delay up to the maximum allowed.\nThe CM upstream modulation clock SHOULD track the jitter components below 10 Hz in the input downstream\nsymbol clock with an error transfer function below -25 dB. The CM upstream modulation clock SHOULD attenuate\nthe jitter components in the input downstream symbol clock above 200 Hz.\nThe CM MUST provide a test mode in which:\n•    A continuous (non-bursted) upstream signal is transmitted at the commanded carrier frequency, modulation rate\n     and level.\n•    The modulation sequence at the transmit equalizer input is replaced with an alternating binary sequence (1, -1,\n     1, -1, 1, -1,...) at nominal amplitude, equal on both I and Q.\n•    The CM tracks the downstream symbol clock and uses it to generate the upstream modulation clock as in\n     normal synchronous operation.",88]],"viewer":{"atp_file":"pdf/CM-TP-PHYv3.0-Acceptance Test Plan(ATP)-I05-100204.pdf","atp_page":120,"spec_file":"pdf/CM-SP-PHYv3.0-C01-171207.pdf","spec_pages":[70,88],"atp_revision":"I05 Issued","spec_revision":"C01"}},"PHY 16.3":{"version":"D3.0","atp_page":null,"atp":"","spec":[["6.2.8 Scrambler (Randomizer)","6.2.8    Scrambler (Randomizer) ...................................................................................................................... 41",4],["6.2.10 Preamble Prepend","6.2.10 Preamble Prepend\nThe upstream PMD sublayer MUST support a variable-length preamble field that is prepended to the data after it\nhas been randomized, Reed-Solomon encoded, and TCM encoded.\nThe first bit of the Preamble Pattern is the first bit into the symbol mapper (see Section 6.2.14). The first bit of the\nPreamble Pattern is designated by the Preamble Value Offset. The preamble is interleaved by the framer in S-\nCDMA mode.\nThe preamble sequence MUST be programmable. For DOCSIS 2.0/3.0 bursts (bursts encoded using a Type 5 burst\ndescriptor), the preamble MUST use the QPSK0 or QPSK1 constellation (per Figure 6–20 and Figure 6–21) with\npreamble length 0, 2, 4, 6,..., or 1536 bits (maximum 768 QPSK symbols). For DOCSIS 1.x compatible bursts (Type\n4 burst descriptor) that use QPSK modulation, the preamble and data MUST use the QPSK0 constellation with\npreamble length 0, 2, 4, 6,..., or 1024 bits (maximum 512 QPSK symbols). For DOCSIS 1.x compatible bursts (Type\n4 burst descriptor) that use 16-QAM modulation, the preamble and data MUST use the 16-QAM constellation with\npreamble length 0, 4, 8, 12,..., or 1024 bits (maximum 256 16-QAM symbols).\nThe preamble length and value MUST be configured in response to the Upstream Channel Descriptor message\ntransmitted by the CMTS.\n\n\n\n\n                                                                             \n12/07/17                                                 CableLabs                                                         45\n\fCM-SP-PHYv3.0-C01-171207                                        Data-Over-Cable Service Interface Specifications",45]],"viewer":{"atp_file":"pdf/CM-TP-PHYv3.0-Acceptance Test Plan(ATP)-I05-100204.pdf","atp_page":138,"spec_file":"pdf/CM-SP-PHYv3.0-C01-171207.pdf","spec_pages":[4,45],"atp_revision":"I05 Issued","spec_revision":"C01"}},"PHY 17.3":{"version":"D3.0","atp_page":null,"atp":"","spec":[["6.2.17 Spectral Shaping","6.2.17 Spectral Shaping\nThe CM upstream transmitter MUST approximate a Nyquist square-root raised-cosine pulse-shaping filter with roll-\noff factor alpha =0.25. For operation with a DOCSIS 3.0 CMTS (unless the CMTS is operating as a pre-3.0\nDOCSIS CMTS), the CM -30 dB transmitted bandwidth MUST NOT exceed the Channel Width values in Table 6–\n5. For backward compatibility with a CMTS operating as a pre-3.0-DOCSIS CMTS, the CM -30 dB transmitted\nbandwidth MUST NOT exceed the Channel Width values in Table 6–6. The Channel Width values are given\nanalytically by:\n\n                                  ChannelWidth = ModulationRate*(1+alpha).\n\n                     Table 6–5 - Maximum Channel Width for Operation with a DOCSIS 3.0 CMTS\n\n                           Modulation Rate (kHz)                        Channel Width (kHz)\n                                       1280                                     1600\n                                       2560                                     3200\n                                       5120                                     6400\n\n\n                  Table 6–6 - Maximum Channel Width for Operation with a pre-3.0-DOCSIS CMTS\n\n                       Modulation Rate            Channel Width (kHz)            Applicability\n                           (kHz)\n                                160                         200                  CM MAY support\n                                320                         400                  CM MAY support\n                                640                         800                  CM MAY support\n                               1280                        1600                 CM MUST support\n                               2560                        3200                 CM MUST support\n                               5120                        6400                 CM MUST support\n\n                                                           14\n6.2.17.1 Upstream Frequency Agility and Range\nThe CM MUST support:\n    • Operation over the Standard Upstream Frequency Range of 5-42MHz edge to edge, or\n    • Operation over the Extended Upstream Frequency Range of 5-85 MHz, edge to edge or\n    • Selectable operation between the Standard Upstream Frequency Range of 5-42MHz and the Extended\n       Upstream Frequency Range of 5-85MHz.\nOffset frequency commands MUST be supported per Table 6–12.\n\n\n14\n     Revised per PHYv3.0-N-14.1207-2 by JB on 1/5/15.\n\n\n                                                                    \n70                                                      CableLabs                                        12/07/17\n\fPhysical Layer Specification                                                       CM-SP-PHYv3.0-C01-171207\n\n\n6.2.17.2 Spectrum Format\nThe upstream modulator MUST provide operation with the format s(t) = I(t)*cos(ωt) - Q(t)*sin(ωt), where t denotes\ntime and ω denotes angular frequency.",70],["6.2.22 Fidelity Requirements","6.2.22 Fidelity Requirements\nThe following requirements assume that any pre-equalization is disabled, unless otherwise noted.\nThe lower band edge of the CM’s upstream is 5 MHz; the upper band edge of the CM’s upstream is 42 MHz, 85\nMHz, or selectable between 42 MHz and 85 MHz. If the CM supports a frequency range of 5 to 42 MHz edge to\nedge, it is only required to support the fidelity requirements provided for an operating range of 5-42 MHz. If the CM\nsupports a frequency range of 5 to 85 MHz edge to edge, it is only required to support the fidelity requirements\nprovided for an operating range of 5-85 MHz. If the CM supports a selectable frequency range, it is required to\nsupport the fidelity requirements provided for both an operating range of 5-42 MHz and an operating range of 5-85\nMHz.\n6.2.22.1 Spurious Emissions\nThe noise and spurious power MUST NOT exceed the levels given in Table 6–14, Table 6–15, and Table 6–17. The\nnoise and spurious power SHOULD NOT exceed the levels given in Table 6–16 and Table 6–18. When Multiple\nTransmit Channel mode is enabled, the noise and spurious power requirements for the individual channels are\n37\n     Revised per PHYv3.0-N-14.1207-2 by JB on 1/5/15.\n\n\n                                                                                  \n88                                                              CableLabs                                           12/07/17\n\fPhysical Layer Specification                                                         CM-SP-PHYv3.0-C01-171207\n\n\nsummed (absolute power, NOT in dB) to determine the composite noise floor for the multi-channel transmission\ncondition. Also when Multiple Transmit Channel mode is enabled, these spurious performance requirements only\napply when the CM is operating within certain ranges of values for Pload_n, for n = 1 to the number of upstream\nchannels in the Transmit Channel Set, and for the ratio of number_allocated_codes / number_active_codes from 1\ndown to 1/4th, for S-CDMA channels.\nFor S-CDMA mode, when a modem is transmitting fewer than 1/4th of the active spreading codes on a channel, the\nspurious emissions requirement limit is the power value (in dBmV), corresponding to the specifications for the\npower level associated with 1/4th of the active spreading codes (i.e., 6 dB below the channel power corresponding to\nall active codes for that channel allocated to the CM).\nWhen Multiple Transmit Channel mode is enabled and there are two or more channels in the Transmit Channel Set,\nthe spurious performance requirements MUST be met only when the following loading ranges are satisfied:\n       Two or more channels in the TCS: applicable when Pload_1 – Pload_min_set ≤ 3 dB, AND\n       Two channels in the TCS: applicable when Pload_2 – Pload_1 ≤ 12 dB.\n       Three channels in the TCS: applicable when Pload_3 – Pload_1 ≤ 8 dB.\n       Four channels in the TCS: applicable when:\n            Pload_2 – Pload_1 ≤ 4 dB.\n       AND            Pload_3 – Pload_2 ≤ 4 dB. 38\n       AND            Pload_4 – Pload_3 ≤ 4 dB.\nWhen a modem is transmitting at power levels falling outside these loading ranges (which is allowed by the 12 dB\ndynamic range), the spurious emissions requirement limits are the power values (in dBmV rather than dBc)\ncorresponding to the specifications associated with transmissions at the second and higher loaded channels if the\nloading of those channels were decreased (transmit power increased) to just meet the applicability ranges.\nWith Multiple Transmit Channel mode enabled, the spurious performance requirements do not apply to any\nupstream channel from the time the output power on any active upstream channel has varied by more than ±3 dB\nsince the last global reconfiguration time through the end of the next global reconfiguration time changes, excluding\ntransmit power changes due to UCD-induced change in Phi [MULPI3.0]. \"Global reconfiguration time\" is defined as\nthe inactive time interval provided between active transmissions, which simultaneously satisfies the requirement in\nSection 6.2.20.2 for all TDMA channels in the TCS and the requirement in Section 6.2.20.3 for all S-CDMA\nchannels in the TCS. With Multiple Transmit Channel mode enabled, the CMTS SHOULD provide global\nreconfiguration time to a CM before (or concurrently as) the CM has been commanded to change any upstream\nchannel transmit power by ±3 dB cumulative since its last global reconfiguration time, excluding transmit power\nchanges due to UCD-induced change in Phi [MULPI3.0]. 39\nAs one example, with three S-CDMA channels in the TCS, at transmit powers per channel of 53 dBmV, 41 dBmV,\nand 41 dBmV, the absolute spurious emissions requirements, when two or more channels in the TCS are\ntransmitting, correspond to the absolute spurious emissions requirements with transmit power per channel of 53\ndBmV, 45 dBmV, and 45 dBmV. The 41 dBmV power levels are raised for the purposes of determining the\nspurious emissions limits, up to 53 dBmV – 8 dB = 45 dBmV.\nAs an example, with four S-CDMA channels in the TCS, at transmit powers per channel of 53 dBmV, 41 dBmV, 41\ndBmV, and 41 dBmV, the absolute spurious emissions requirements, when two or more channels in the TCS are\ntransmitting, correspond to the absolute spurious emissions requirements with transmit power per channel of 53\ndBmV, 49 dBmV, 45 dBmV, and 41 dBmV. The 41 dBmV power levels are raised for the purposes of determining\nthe spurious emissions limits, up to 53 dBmV – 4 dB = 49 dBmV; and the artificial 49 dBmV – 4 dB = 45 dBmV;\nand the artificial 45 dBmV – 4 dB = 41 dBmV.\nIn Table 6–14, inband spurious emissions includes noise, carrier leakage, clock lines, synthesizer spurious products,\nand other undesired transmitter products. It does not include ISI. The measurement bandwidth for Inband spurious is\n\n\n38\n     Paragraph revised per PHYv3.0-N-06.0340-1 by GO on 1/11/07.\n39\n     Paragraph revised per PHYv3.0-N-08.0611-3 on 4/10/08 by KN.\n\n\n                                                                    \n12/07/17                                               CableLabs                                                  89\n\fCM-SP-PHYv3.0-C01-171207                                       Data-Over-Cable Service Interface Specifications\n\n\nequal to the modulation rate (e.g., 1280 to 5120 kHz). All requirements expressed in dBc are relative to the actual\ntransmit power that the CM emits in one channel.\nThe measurement bandwidth is 160 kHz for the Between Bursts (none of the channels in the TCS are bursting) specs\nof Table 6–14, except where called out as 4 MHz or 250 kHz.\nThe Transmitting Burst specs apply during the mini-slots granted to the CM (when the CM uses all or a portion of\nthe grant), and for 32 modulation intervals before and after the granted mini-slots. The Between Bursts specs apply\nexcept during a used grant of mini-slots on any active channel for the CM, and the 32 modulation intervals before\nand after the used grant.\nIn TDMA mode, a mini-slot may be as short as 32 modulation intervals, or 6.25 µs at the 5.12 MHz rate, or as short\nas 25 µs at the 1.28 MHz rate. 40\n                                                                            41\n MHz, or 1002 MHz if CM center         -45 dBmV                          max(-45 dBmV, -40 dB ref d/s4)\nfrequency ranges up to 999 MHz\n\n\n\n\n40\n  Paragraph modified per PHYv3.0-N-07.0465-1 #3 on 7/2/07 by KN.\n41\n  Table modified per PHYv3.0-N-07.0456-1 on 6/12/07, per PHYv3.0-N-07.0465-1 on 7/2/07, and per PHYv3.0-N-08.0361-1\non 4/17/08 by KN.\n\n\n                                                                  \n90                                                   CableLabs                                              12/07/17\n\fPhysical Layer Specification                                                          CM-SP-PHYv3.0-C01-171207\n\n\n\n                 Parameter                            Transmitting Burst                     Between Bursts\nFor the case where the upstream operating\nrange is 5-85 MHz:\nCM Discrete Spurious Emissions Limits1\n85 to 108 MHz                                     -50 dBc                            -36 dBmV\n108 to 870 MHz, or 1002 MHz if CM center          -50 dBmV                           -50 dBmV\nfrequency ranges up to 999 MHz\n\nTable Notes:\nNote 1    These spec limits exclude a single discrete spur related to the tuned received channel; this single discrete\nspur MUST be no greater than -40 dBmV.\nNote 2 \"dB ref d/s\" is relative to the received downstream signal level. Some spurious outputs are proportional to\nthe receive signal level.\nNote 3 These spec limits exclude a single discrete spur related to the tuned received channel; this spur MUST be\nno greater than -40 dBmV.\nNote 4 \"dB ref d/s\" is relative to the received downstream signal level.\n\n\n6.2.22.1.1 Adjacent Channel Spurious Emissions\nSpurious emissions from a transmitted carrier may occur in an adjacent channel which could be occupied by a\ncarrier of the same or different modulation rate. Table 6–15 lists the required adjacent channel spurious emission\nlevels for all combinations of transmitted carrier modulation rates and adjacent channel modulation rates. The\nmeasurement is performed in an adjacent channel interval of appropriate bandwidth and distance from the\ntransmitted carrier, based on the modulation rates of the transmitted carrier, and the carrier in the adjacent channel.\n Table 6–15 - Adjacent Channel Spurious Emissions Requirements Relative to the Per Channel Transmitted\n                                  Burst Power Level for Each Channel\n\n Specification in the           Measurement interval and distance                    Adjacent channel carrier\n      interval                         from carrier edge                                 modulation rate\n         -50 dBc                            20 kHz to 180 kHz                                   160 kHz\n         -50 dBc                            40 kHz to 360 kHz                                   320 kHz\n         -50 dBc                            80 kHz to 720 kHz                                   640 kHz\n         -50 dBc                          160 kHz to 1440 kHz                                  1280 kHz\n         -47 dBc                          320 kHz to 2880 kHz                                  2560 kHz\n         -44 dBc                          640 kHz to 5760 kHz                                  5120 kHz\n\n\nIn addition, the CM SHOULD meet the requirements in Table 6–16, under the same conditions as listed for Table 6–\n15 above. With a lower power channel bursting as a lone bursting channel (at that point in time), 2 dB relaxation\nwill apply to the absolute spurious emissions requirement of Table 6–16.\n  Table 6–16 - Adjacent Channel Spurious Emissions Goals Relative to the Per Channel Transmitted Burst\n                                     Power Level for Each Channel\n\n   Specification in the            Measurement interval and distance                   Adjacent channel carrier\n        interval                          from carrier edge                                modulation rate\n           -53 dBc                             20 kHz to 180 kHz                                  160 kHz\n           -53 dBc                             40 kHz to 360 kHz                                  320 kHz\n           -52 dBc                             80 kHz to 720 kHz                                  640 kHz\n           -51 dBc                            160 kHz to 1440 kHz                                1280 kHz\n\n\n                                                                   \n12/07/17                                              CableLabs                                                       91\n\fCM-SP-PHYv3.0-C01-171207                                        Data-Over-Cable Service Interface Specifications\n\n\n\n      Specification in the           Measurement interval and distance                Adjacent channel carrier\n           interval                         from carrier edge                             modulation rate\n             -50 dBc                           320 kHz to 2880 kHz                              2560 kHz\n             -48 dBc                           640 kHz to 5760 kHz                              5120 kHz\n\n                                                                           42\n6.2.22.1.2 Spurious Emissions in the Upstream Frequency Range\nTable 6–17 lists the possible modulation rates that could be transmitted in an interval, the required spurious level in\nthat interval, and the initial measurement interval at which to start measuring the spurious emissions. Measurements\nshould start at the initial distance and be repeated at increasing distance from the carrier until the upstream band\nedge is reached. The lower band edge of the upstream is 5 MHz; the upper band edge of the upstream is 42 MHz ,\n85 MHz, or 85 MHz with upstream frequency range selection.\n       Table 6–17 - Spurious Emissions Requirements in the Upstream Frequency Range Relative to the Per\n                            Channel Transmitted Burst Power Level for Each Channel\n\n Possible modulation rate in                Specification in the            Initial measurement interval and\n        this interval                            interval                       distance from carrier edge\n                160 kHz                            -54 dBc                           220 kHz to 380 kHz\n                320 kHz                            -52 dBc                           240 kHz to 560 kHz\n                640 kHz                            -50 dBc                           280 kHz to 920 kHz\n               1280 kHz                            -50 dBc                          360 kHz to 1640 kHz\n               2560 kHz                            -47 dBc                          520 kHz to 3080 kHz\n               5120 kHz                            -44 dBc                          840 kHz to 5960 kHz\n\n\nIn addition, the CM SHOULD meet the requirements in Table 6–18, under the same conditions as listed for Table 6–\n17 above. With a lower power channel bursting as a lone bursting channel (at that point in time), 2 dB relaxation\nwill apply to the absolute spurious emissions requirement of Table 6–18.\n      Table 6–18 - Spurious Emissions Goals in the Upstream Frequency Range Relative to the Per Channel\n                               Transmitted Burst Power Level for Each Channel\n\n Possible modulation rate in                Specification in the            Initial measurement interval and\n        this interval                            interval                       distance from carrier edge\n               160 kHz                              -60 dBc                          220 kHz to 380 kHz\n               320 kHz                              -58 dBc                          240 kHz to 560 kHz\n               640 kHz                              -56 dBc                          280 kHz to 920 kHz\n               1280 kHz                             -54 dBc                          360 kHz to 1640 kHz\n               2560 kHz                             -52 dBc                          520 kHz to 3080 kHz\n               5120 kHz                             -50 dBc                          840 kHz to 5960 kHz\n\n\n6.2.22.2 Spurious Emissions During Burst On/Off Transients\nEach transmitter MUST control spurious emissions, prior to and during ramp-up, during and following ramp-down,\nand before and after a burst.\nOn/off spurious emissions, such as the change in voltage at the upstream transmitter output, due to enabling or\ndisabling transmission, MUST be no more than 100 mV. Such a step MUST be dissipated no faster than 2 µs of\n\n42\n     Revised per PHYv3.0-N-14.1207-2 by JB on 1/5/15.\n\n\n                                                                    \n92                                                      CableLabs                                             12/07/17\n\fPhysical Layer Specification                                                          CM-SP-PHYv3.0-C01-171207\n\n\nconstant slewing. This requirement applies when the CM is transmitting at +55 dBmV or more per channel on any\nchannel. At backed-off transmit levels, the maximum change in voltage MUST decrease by a factor of 2 for each 6\ndB decrease of power level in the highest power active channel, from +55 dBmV per channel, down to a maximum\nchange of 7 mV at 31 dBmV per channel and below. This requirement does not apply to CM power-on and power-\noff transients. 43\n6.2.22.3 Modulation Error Ratio (MER)\nMER measures the cluster variance caused by the transmit waveform. It includes the effects of ISI, spurious, phase\nnoise, and all other transmitter degradations.\n6.2.22.3.1 Definitions\nSymbol MER: MERsymb is defined as follows for TDMA or S-CDMA symbols. The transmitted RF waveform\n(after appropriate down conversion) is applied to the ideal receive symbol matched filter and is sampled once per\nsymbol. For TDMA, the matched filter is a square-root raised cosine filter with alpha = 0.25. For S-CDMA, the\nmatched filter is a square-root raised cosine filter with alpha = 0.25, convolved with the time-reversed spreading\ncode sequence. (In this convolution, the spreading code sequence is expressed as a weighted impulse train spaced at\nthe chip period.) No external noise (AWGN) is added to the signal. The carrier frequency offset, carrier phase offset,\nsymbol timing and gain may be adjusted during each burst to maximize MERsymb. Equalization of the received\nwaveform is not permitted. For cases where the CM transmit equalizer is ON, the transmit equalizer coefficients\nmay be adjusted to maximize MERsymb. MERsymb is defined at the F connector of the CM, except that when an echo\nchannel is inserted, MERsymb is defined at the output of the echo channel. MERsymb is computed by the formula:\n\n                                                                           \n                                                                           \n                                                                           \n                                      MERsymb (dB ) = 10 • log10 \n                                                                    E av\n                                                                     N      \n                                                                 1\n                                                                         ∑\n                                                                           2\n                                                                 N      ej \n                                                                   j =1    \nwhere:\n       Eav is the average constellation energy for equally likely symbols (see Section 6.2.14 and Figure 6–20),\n       N is the number of symbols averaged;\n       ej is the error vector from the jth received symbol to the ideal transmitted QAM symbol on the grid of\n       Figure 6–20.\nFor S-CDMA, MERsymb is averaged over all active codes.\nMER of composite chips: MERchip is specified for composite S-CDMA chips to ensure that high SNR is\nmaintained, especially for a small number of allocated codes, to prevent noise funneling effects when many modems\ntransmit simultaneously. A composite S-CDMA chip is defined as the output of the spreader during one chip\ninterval, that is, an element of the transmission vector defined in Section 6.2.15, \"S-CDMA Spreader\".\nMERchip is defined as follows: The transmitted RF waveform (after appropriate down conversion) is applied to the\nideal receive chip matched filter and is sampled once per chip. The matched filter is a square-root raised cosine filter\nwith alpha = 0.25. No external noise (AWGN) is added to the signal. The carrier frequency offset, carrier phase\noffset, timing and gain may be adjusted during each burst to maximize MERchip. Equalization of the received\nwaveform is not permitted. For cases where the CM transmit equalizer is ON, the transmit equalizer coefficients\nmay be adjusted to maximize MERchip. MERchip is defined at the F connector of the CM. MERchip is computed by the\nformula where:\n\n\n\n\n43\n     Revised paragraph per PHYv3.0-N-06.0341-1 by GO on 1/12/07.\n\n\n                                                                    \n12/07/17                                               CableLabs                                                     93\n\fCM-SP-PHYv3.0-C01-171207                                        Data-Over-Cable Service Interface Specifications\n\n\n\n                                                                 N       2   \n                                                                 ∑ pj        \n                                                                 j =1        \n                                     MERchip (dB ) = 10 • log10  N           \n                                                                            2\n
