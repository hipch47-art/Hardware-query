on is not a description of CMTS or CM parameters. The data-over-cable system MUST be interoperable\nwithin the environment described in this section.\nWhenever a reference in this section to frequency plans, or compatibility with other services, conflicts with any legal\nrequirement for the area of operation, the latter takes precedence. Any reference to National Television System\nCommittee (NTSC) analog signals in 6 MHz channels does not imply that such signals are physically present.\n\n5.1       Overview\nThis specification defines the PHY layer protocol of DOCSIS 4.0. It also describes the channel assumptions over\nwhich DOCSIS 4.0 systems are expected to operate.\nDOCSIS 4.0's ultimate service goal of multi-gigabit per second in the downstream and upstream directions resulted\nin significant changes in the PHY layer approach compared to earlier DOCSIS versions, in addition to changes on\nthe cable network assumptions. As with DOCSIS 3.1, DOCSIS 4.0 focuses on the eventual use of the entire spectrum\nresources available in the cable environment by the CMTS and CM and on scalable cost-effective techniques to\nachieve full spectrum use. However, DOCSIS 4.0 adds Full Duplex (FDX) DOCSIS functionality to enable flexible\nusage of a portion of this spectrum for simultaneous upstream and downstream transmissions. DOCSIS 4.0 also\nprovides an extended Frequency Division Duplex (FDD) alternative to enable FDD upstream spectrum up to 684 MHz\nand downstream spectrum to 1794 MHz, further enhancing the efficiency and scalability of the usable spectrum\naccording to system needs.\nDOCSIS 4.0 assumes the Orthogonal Frequency Division Multiplexing (OFDM) downstream signals and\nOrthogonal Frequency Division Multiple Access (OFDMA) upstream signals introduced by [DOCSIS PHYv3.1] to\nachieve robust operation and provide more efficient use of the spectrum than previous DOCSIS versions.\nThe DOCSIS 3.0 systems and earlier versions are sometimes referred to in this document as single carrier QAM\n(SC-QAM) systems in contrast to the multicarrier OFDM/OFDMA system introduced by DOCSIS 3.1.\nSee also [DOCSIS PHYv3.1], section 5.1.\n\n5.2       Functional Assumptions\n\n5.2.1      Equipment Assumptions\n\n5.2.1.1     Frequency Plan\nIn the downstream direction, the cable system is assumed to have a pass band with a lower edge of 108 MHz and\nupper frequency edges extending to 1218 MHz for FDX operation. For FDD operation, the following Frequency\nPlan applies to the downstream.\n      •    The pass band is 1,536 MHz in width when set to a lower edge of 258 MHz and extends to 1,794 MHz.\n      •    Cable systems with downstream lower band edges above 258 MHz extend to 1,794 MHz. Higher upper\n           frequency edges may be considered in the specification according to future migrations of the plants.\n      •    Cable systems with downstream lower band edges below 258 MHz are supported by the nodes to assist\n           the operators in transitioning to DOCSIS 4.0, but the occupied downstream spectrum is limited to 1,536\n           MHz. FDD nodes that transmit below 258 MHz are considered to be operating in Legacy Transition\n           Mode. Since DOCSIS 4.0 cable modems are not required to receive signals below 258 MHz, it is expected\n           that any frequencies below 258 MHz will be restricted to video SC-QAM and other non-DOCSIS signals.\n\n\n\n12/02/20                                             CableLabs                                                        33\n\fCM-SP-PHYv4.0-I03-201202                                      Data-Over-Cable Service Interface Specifications\n\n\nWithin the downstream pass band, NTSC analog television signals in 6 MHz channels could be present on the\nstandard HRC or IRC frequency plans of [CTA 542], as well as other narrowband and wideband digital signals.\nFDX DOCSIS 4.0 specifies the continued full use of legacy upstream transmission capabilities in 5-85MHz. FDX\nintroduces the possibility of simultaneous upstream and downstream transmissions within the 108-684MHz band.\nAbove 684MHz FDX supports legacy downstream transmission, albeit with a transition band of reduced\nperformance that is unspecified between 684 and 804MHz.\nFDD DOCSIS 4.0 supports backwards compatibility to DOCSIS 3.1 high-split operation with full use of legacy\nupstream capabilities in 5 MHz to 204 MHz. As with DOCSIS 3.1 high-split, DOCSIS 4.0 supports legacy\ndownstream transmission beginning at 258 MHz. Unlike DOCSIS 3.1, the DOCSIS 4.0 downstream upper\nfrequency band edge can extend to 1794 MHz. DOCSIS 4.0 FDD nodes are required to support legacy plants via\nthe downstream transmission of video SC-QAM and other non-DOCSIS signals below 258 MHz to allow operators\na more gradual transition to a full FDD implementation of DOCSIS 4.0.\nFDD DOCSIS 4.0 introduces Ultra-high Split (UHS) operation with the potential to add OFDMA capacity across\nthe added upstream frequencies. UHS adds the possibility of extended splits at 300 MHz (UHS-300), 396 MHz\n(UHS-396), 492 MHz (UHS-492), and 684 MHz (UHS-684). Each of the new splits has a range in which the lower\ndownstream transmission band edge can lie as defined later in this specification. As with DOCSIS 4.0 high-split,\nthe UHS downstream upper frequency band edge can extend to 1794 MHz.\nUHS operation includes continued support for DOCSIS 3.1 CMs, which can fully utilize legacy upstream transmission\ncapabilities in 5 MHz to 204 MHz. DOCSIS 4.0 CMs can utilize legacy upstream transmission capabilities in 5 MHz\nto 85 MHz while also supporting OFDMA transmissions from 108 MHz to the chosen UHS extended split. For\nmore detailed descriptions and graphical representations, refer to Section 7.3.2.5 and its subsections.\n\n5.2.1.2    Compatibility with Other Services\nThe CM MUST coexist with any services on the cable network.\nThe CMTS MUST coexist with any services on the cable network.\nIn particular:\n     •    The CMTS MUST be interoperable in the cable spectrum assigned for CMTS and CM interoperation\n          while the balance of the cable spectrum is occupied by any combination of television and other signals.\n     •    The CM MUST be interoperable in the cable spectrum assigned for CMTS and CM interoperation while\n          the balance of the cable spectrum is occupied by any combination of television and other signals.\n     •    The CMTS MUST NOT cause harmful interference to any other services that are assigned to the cable\n          network in spectrum outside of that allocated to the CMTS.\n     •    The CM MUST NOT cause harmful interference to any other services that are assigned to the cable\n          network in spectrum outside of that allocated to the CM.\nHarmful interference is understood as:\n     •    No measurable degradation (highest level of compatibility),\n     •    No degradation below the perceptible level of impairments for all services (standard or medium level of\n          compatibility), or\n     •    No degradation below the minimal standards accepted by the industry (for example, FCC for analog video\n          services) or other service provider (minimal level of compatibility).\n\n5.2.1.3    Fault Isolation Impact on Other Users\nAs CMTS transmissions are on a shared-media, point-to-multipoint system, fault-isolation procedures should take\ninto account the potential harmful impact of faults and fault-isolation procedures on numerous users of the data-\nover-cable, video, and other services.\nFor the interpretation of harmful impact, see Section 5.2.1.2 above.\n\n\n\n\n34                                                  CableLabs                                            12/02/20\n\fPhysical Layer Specification                                                                 CM-SP-PHYv4.0-I03-201202\n\n\n5.2.1.4     Cable System Terminal Devices\nThe CM is expected to meet and preferably exceed all applicable regulations for Cable System Termination Devices\nand Cable Ready Consumer Equipment as defined in FCC Part 15 [FCC15] and Part 76 [FCC76]. None of these\nspecific requirements may be used to relax any of the specifications contained elsewhere within this document.\n\n5.2.2     RF Channel Assumptions\nThe data-over-cable system, configured with at least one set of defined physical-layer parameters (e.g., modulation,\ninterleaver depth, etc.) from the range of configurable settings described in this specification, is expected to be\ninteroperable on cable networks having characteristics defined in this section. This is accomplished in such a\nmanner that the forward error correction provides for equivalent operation in a cable system both with and without\nthe impaired channel characteristics described below.\n\n5.2.2.1     Transmission Downstream\nThe RF channel transmission characteristics of the cable network in the downstream direction are described in\nTable 3. These numbers assume total average power of a digital signal in a 192 MHz channel bandwidth for\nsubcarrier levels unless indicated otherwise. For impairment levels, the numbers in Table 3 assume average power\nin a bandwidth in which the impairment levels are measured in a standard manner for cable TV systems. For analog\nsignal levels, the numbers in Table 3 assume peak envelope power in a 6 MHz channel bandwidth. All conditions\nare present concurrently. It is expected that the HFC plant will have better conditions for DOCSIS 4.0 to provide\nthe higher throughput and capacities anticipated.\n                       Table 3 - Typical Downstream RF Channel Transmission Characteristics\n\n                                Parameter                                                         Value\nFrequency range                                                           FDX: 108 to 1218 MHz\n                                                                          FDD: 1,536 MHz of occupied downstream spectrum in\n ignals to support operators in the\n        transition to DOCSIS 4.0. DOCSIS 4.0 FDD nodes transmitting at frequencies below 258 MHz are said to be operating in\n        Legacy Transition Mode.\nNote 2. Cascaded group delay could possibly exceed the ≤113 ns value within approximately 30 MHz above the downstream\n        spectrum's lower band edge, depending on cascade depth, diplex filter design, and actual band split.\n\n\n\n\n12/02/20                                                 CableLabs                                                       35\n\fCM-SP-PHYv4.0-I03-201202                                              Data-Over-Cable Service Interface Specifications\n\n\n5.2.2.2     Transmission Upstream\nThe RF channel transmission characteristics of the cable network in the upstream direction are described in Table\n4. No combination of the following parameters will exceed any stated interface limit defined elsewhere in this\nspecification. Transmission is from the CM output at the customer location to the headend.\n                         Table 4 - Typical Upstream RF Channel Transmission Characteristics\n\n                              Parameter                                                          Value\nFrequency range                                                        FDX: 5 to 85 MHz and 108 to 684 MHz\n                                                                       FDD high-split backward compatibility: 5 MHz to 204 MHz\n                                                                       FDD UHS (DOCSIS 3.1 CMs): 5 MHz to 204 MHz\n                                                                       FDD UHS (DOCSIS 4.0 CMs): 5 to 85 and 108 to xxx MHz\n                                                                        (where xxx = 300, 396, 492, or 684 MHz)\nOne way transit delay from most distant customer to headend.           ≤ 0.400 ms (typically much less)\nCarrier-to-interference plus ingress (the sum of noise, distortion, the downstream or the upstream directions,\ni.e., a positive change in frequency at the input to the cable network will result in a positive change in frequency at\nthe output.\n\n\n\n\n36                                                      CableLabs                                                  12/02/20\n\fPhysical Layer Specification                                                          CM-SP-PHYv4.0-I03-201202\n\n\n6 PHY SUBLAYER FOR SC-QAM\n6.1     Scope\nThis section applies to cases where a DOCSIS 4.0 CM or CMTS is operating with simultaneous operation of SC-\nQAM and OFDM/OFDMA channels unless otherwise noted. Throughout this entire document, \"OFDM\" pertains\nto downstream, \"OFDMA\" pertains to upstream, and \"SC-QAM\" pertains to either a) DOCSIS 3.0 or earlier\ndownstream channels, or b) TDMA, ATDMA, collectively, from DOCSIS 3.0 or earlier, for the upstream channels.\nThe S-CDMA support is not required for the DOCSIS 4.0 CM and CMTS.\nThis specification defines the electrical characteristics and signal processing operations for a CM and CMTS. It is\nthe intent of this specification to define an interoperable DOCSIS 4.0 CM and CMTS such that any implementation\nof a DOCSIS 4.0 CM can work with any DOCSIS 4.0 or DOCSIS 3.1 CMTS. It is not the intent of this\nspecification to imply any specific implementation.\nAs the requirements for a DOCSIS 4.0 CM and CMTS are largely unchanged relative to SC-QAM operation, this\nsection is composed primarily of references to the appropriate DOCSIS 3.0 specification sections for the specific\nrequirements for a DOCSIS 4.0 CM and CMTS, as well as any deltas relative to those requirements.\nA DOCSIS 4.0 CM MUST comply with the referenced requirements in the [DOCSIS PHYv3.0] and [DOCSIS\nDRFI] specifications noted in this section, with the exception of any deltas called out in this section (which will be\nidentified with separate requirement statements). A DOCSIS 4.0 CMTS MUST comply with the referenced\nrequirements in the [DOCSIS PHYv3.0] and [DOCSIS DRFI] specifications noted in this section, with the\nexception of any deltas called out in this section (which will be identified with separate requirement statements).\n\n6.2     Upstream Transmit and Receive\n\nThis section is based on section 6.2 of [DOCSIS PHYv3.0].\n\n6.2.1    Overview\nSee section 6.2.1 of [DOCSIS PHYv3.0], with the exceptions noted in Section 7.2 for the FDX CM and Section 7.3\nfor the FDD CM.\n\n6.2.2    Signal Processing Requirements\nSee section 6.2.2 of [DOCSIS PHYv3.0].\n\n6.2.3    Modulation Formats\nSee section 6.2.3 of [DOCSIS PHYv3.0].\n\n6.2.4    R-S Encode\nSee section 6.2.4 of [DOCSIS PHYv3.0].\n\n6.2.5    Upstream R-S Frame Structure (Multiple Transmit Channel Mode Enabled)\nSee section 6.2.5 of [DOCSIS PHYv3.0].\n\n6.2.6    Upstream R-S Frame Structure (Multiple Transmit Channel Mode Disabled)\nSee section 6.2.6 of [DOCSIS PHYv3.0].\n\n6.2.7    TDMA Byte Interleaver\nSee section 6.2.7 of [DOCSIS PHYv3.0].\n\n\n\n\n12/02/20                                            CableLabs                                                      37\n\fCM-SP-PHYv4.0-I03-201202                                    Data-Over-Cable Service Interface Specifications\n\n\n6.2.8   Scrambler (randomizer)\nSee section 6.2.8 of [DOCSIS PHYv3.0].\n\n6.2.9   TCM Encoder\nSee section 6.2.9 of [DOCSIS PHYv3.0].\n\n6.2.10 Preamble Prepend\nSee section 6.2.10 of [DOCSIS PHYv3.0].\n\n6.2.11 Modulation Rates\nSee section 6.2.11 of [DOCSIS PHYv3.0].\n\n6.2.12 S-CDMA Framer and Interleaver\nSee section 6.2.12 of [DOCSIS PHYv3.0].\n\n6.2.13 S-CDMA Framer\nSee section 6.2.13 of [DOCSIS PHYv3.0].\n\n6.2.14 Symbol Mapping\nSee section 6.2.14 of [DOCSIS PHYv3.0].\n\n6.2.15 S-CDMA Spreader\nSee section 6.2.15 of [DOCSIS PHYv3.0].\n\n6.2.16 Transmit Pre-Equalizer\nSee section 6.2.16 of [DOCSIS PHYv3.0].\n\n6.2.17 Spectral Shaping\nSee section 6.2.17 of [DOCSIS PHYv3.0].\n\n6.2.18 Relative Processing Delays\nSee section 6.2.18 of [DOCSIS PHYv3.0].\n\n6.2.19 Transmit Power Requirements\nFor the case in which a DOCSIS 4.0 CM is operating with a DOCSIS 3.0 CMTS regardless of channel type, the\ntransmit power requirements are described in Section 7.2.4.12.4 for the FDX CM and in Section 7.3.4.12.4 for the\nFDD CM. The requirements in Section 7.2.4.12.4 or 7.3.4.12.4 apply even when all upstream channels on the\nDOCSIS 4.0 CM are SC-QAM.\n\n6.2.20 Burst Profiles\nSee section 6.2.20 of [DOCSIS PHYv3.0].\n\n6.2.21 Burst Timing Convention\nSee section 6.2.21 of [DOCSIS PHYv3.0].\n\n\n\n\n38                                                CableLabs                                            12/02/20\n\fPhysical Layer Specification                                                             CM-SP-PHYv4.0-I03-201202\n\n\n6.2.22 Fidelity Requirements\nFor the case in which a DOCSIS 4.0 CM is operating with a DOCSIS 4.0 CMTS regardless of channel type, the\nfidelity requirements are described in Section 7.2.4.12.7 for FDX CMs and Section 7.3.4.12.7 for FDD CM. The\nrequirements in Sections 7.2.4.12.7 and 7.3.4.12.7 apply even when all upstream channels on the DOCSIS 3.1 CM\nare SC-QAM. For this case there are no MER requirements for SC-QAM channels. So the Sections 7.2.4.12.7.2\nand 7.3.4.12.7.2 do not apply for this case.\n\n6.2.23 Upstream Demodulator Input Power Characteristics\nSee section 6.2.23 of [DOCSIS PHYv3.0].\n\n6.2.24 Upstream Electrical Output from the CM\nFor the case in which a DOCSIS 4.0 CM is operating with a DOCSIS 3.1 CMTS regardless of channel type, the\nupstream electrical output requirements are described in Section 7.2.4.13 (FDX CM) and 7.3.4.13 (FDD CM). The\nrequirements in these sections apply even when all upstream channels on the DOCSIS 4.0 CM are SC-QAM.\n                   Table 5 - CM Transmitter Output Signal Characteristics for SC-QAM channels\n\n            Parameter                                                     Value\nFrequency                       Support and be configurable to a permitted subset (see Section7.2.2.3 for allowed\n                                combinations) of the following frequency range:\n                                5 MHz to 85 MHz\n                                NOT to cause harmful interference above these frequencies for any configured option.\nSignal Type                     TDMA\nModulation Type                 QPSK, 8-QAM, 16-QAM, 32-QAM, and 64-QAM\nModulation Rate (nominal)       TDMA: 1280, 2560, and 5120 kHz\n                                Optional pre-3.0-DOCSIS operation,\n                                TDMA: 160, 320, and 640 kHz\nBandwidth                       TDMA: 1600, 3200, and 6400 kHz\n                                Optional pre-3.0-DOCSIS operation,\n                                TDMA: 200, 400, and 800 kHz\nLevel                           Total average output power of 65 dBmV.\n                                (See item # 1 immediately following this table)\n                                Total average output power greater than 65 dBmV.\n                                (See item # 2 following this table)\nOutput Impedance                75 ohms\nOutput Return Loss              > 6 dB 5 MHz to 85 MHz\nConnector                       F connector per [ISO/IEC-61169-24] or [SCTE 02]\n\n\nThe following is an itemized list of CM Transmitter Output Signal Characteristics based on Table 5 above.\n    1.   The DOCSIS 4.0 CM MUST be capable of transmitting a total average output power of 65 dBmV when\n         operating in DOCSIS 3.1 mode.\n    2.   The DOCSIS 4.0 CM MAY be capable of transmitting a total average output power greater than 65 dBmV\n         when operating in DOCSIS 3.1 mode.\n\n6.2.25 Upstream CM Transmitter Capabilities\nFor the case in which a DOCSIS 4.0 CM is operating with a DOCSIS 3.0 CMTS or where a DOCSIS 4.0 CMTS is\noperating with a DOCSIS 3.0 CM; see section 6.2.25 of [DOCSIS PHYv3.0].\nFor the case in which a DOCSIS 4.0 CM is operating with a DOCSIS 4.0 CMTS regardless of channel type, the\ntransmitter capabilities are described in [DOCSIS PHYv3.1].\n\n\n\n\n12/02/20                                             CableLabs                                                        39\n\fCM-SP-PHYv4.0-I03-201202                                       Data-Over-Cable Service Interface Specifications\n\n\n6.3       Downstream Transmit\n\nThis section is based on section 6.3 of [DOCSIS DRFI].\n\n6.3.1      Downstream Protocol\nSee section 6.3.1 of [DOCSIS DRFI].\n\n6.3.2      Spectrum Format\nSee section 6.3.2 of [DOCSIS DRFI].\n\n6.3.3      Scalable Interleaving to Support Video and High-Speed Data Services\nSee section 6.3.3 of [DOCSIS DRFI].\n\n6.3.4      Downstream Frequency Plan\nSee section 6.3.4 of [DOCSIS DRFI].\n\n6.3.5      DRFI Output Electrical\nApplies only the case where a DOCSIS 4.0 device is operating in DOCSIS 3.0 mode only.\nFor legacy SC-QAMs, the EQAM and CMTS MUST support the electrical output requirements specified in the\nfollowing sections and tables of [DOCSIS DRFI]:\n      •    Section 6.3.5, DRFI Output Electrical\n      •    Section 6.3.5.1, CMTS or EQAM Output Electrical\n      •    Table titled: RF Output Electrical Requirements, in Section 6\n      •    Section 6.3.5.1.1, Power per Channel CMTS or EQAM\n      •    Table titled: DRFI Device Output Power, in Section 6\n      •    Section 6.3.5.1.2, Independence of Individual Channels within the Multiple Channels on a Single RF Port\n      •    Section 6.3.5.1.3, Out-of-Band Noise and Spurious Requirements for CMTS or EQAM\n      •    Table titled: EQAM or CMTS Output Out-of-Band Noise and Spurious Emissions Requirements for\n           N ≤ 8, in Section 6\n      •    Table titled: EQAM or CMTS Output Out-of-Band Noise and Spurious Emissions Requirements N ≥ 9\n           and N' ≥ N/4, in Section 6\n      •    Table titled: EQAM or CMTS Output Out-of-Band Noise and Spurious Emissions Requirements N ≥ 9\n           and N' < N/4, in Section 6\n\n6.3.6      CMTS or EQAM Clock Generation\nApplies only to the case where a DOCSIS 4.0 CMTS is operating in a DOCSIS 3.0 mode only.\nSee section 6.3.6 of [DOCSIS DRFI].\n\n6.3.7      Downstream Symbol Clock Jitter for Synchronous Operation\nApplies only to the case where a DOCSIS 4.0 CMTS is operating in a DOCSIS 3.0 mode only.\nSee section 6.3.7 of [DOCSIS DRFI].\n\n6.3.8      Downstream Symbol Clock Drift for Synchronous Operation\nApplies only to the case where a DOCSIS 4.0 CMTS is operating in a DOCSIS 3.0 mode only.\n\n\n40                                                   CableLabs                                          12/02/20\n\fPhysical Layer Specification                                                    CM-SP-PHYv4.0-I03-201202\n\n\nSee section 6.3.8 of [DOCSIS DRFI].\n\n6.3.9     Timestamp Jitter\nSee section 6.3.9 of [DOCSIS DRFI].\n\n6.4     Downstream Receive\n\nThis section is based on section 6.3 of [DOCSIS PHYv3.0].\n\n6.4.1     Downstream Protocol and Interleaving Support\nSee section 6.3.1 of [DOCSIS PHYv3.0].\n\n6.4.2     Downstream Electrical Input to the CM\nSee section 6.3.2 of [DOCSIS PHYv3.0], with the exception noted below.\nA CM MUST support at least 32 active downstream SC-QAM channels.\nA CMTS MUST support at least 32 active downstream SC-QAM channels.\n\n6.4.3     CM BER Performance\nSee section 6.3.3 of [DOCSIS PHYv3.0].\n\n6.4.3.1    FDX CM BER Performance Above the FDX Transition Band\nThe CM BER performance of an FDX CM operating in FDX mode receiving SC-QAM channels between 804\nMHz and 1002 MHz with a flat receive PSD in the presence of AWGN is given in sections 6.3.3.1.1 and 6.3.3.2.1\nof [DOCSIS PHYv3.0].\nImplementation loss of the FDX CM when in FDX mode MUST be such that the CM achieves a post-FEC BER\nless than or equal to 10-8 when operating at a carrier to noise ratio (ES/N0) as shown in Table 6 - Minimum CNR\nPerformance 804 MHz to 1002 MHz for FDX CM Operating in FDX Mode. If it is not possible to measure post-\nFEC BER directly, Codeword Error Ratio, RC (as defined in section 6.3.3.1.1 of [DOCSIS PHYv3.0]) may be used.\nIn this case, the FDX CM MUST achieve a Codeword Error Ratio of less than or equal to 9 x 10-7 when operating\nat a carrier to noise ratio (ES/N0), as shown in Table 6 - Minimum CNR Performance 804 MHz to 1002 MHz for\nFDX CM Operating in FDX Mode below.\n        Table 6 - Minimum CNR Performance 804 MHz to 1002 MHz for FDX CM Operating in FDX Mode\n\n              SC-QAM Modulation              Receive Signal Level              Minimum CNR\n                   Order                        (dBmV/6MHz)                        (dB)\n                       256                          -6 to +15                        30\n                       256                         -15 to <-6                        33\n                       64                          -15 to +15                       23.5\n\n\nFor an FDX CM not operating in FDX mode, the requirements in [DOCSIS PHYv3.0] apply for downstream SC-\nQAM performance.\n\n6.4.4     Downstream Multiple Receiver Capabilities\nSee section 6.3.4 of [DOCSIS PHYv3.0].\n\n6.4.5     Non-Synchronous DS Channel Support\nApplies only to the case where a DOCSIS 4.0 CM operating with a DOCSIS 3.0 CMTS.\nSee section 6.3.5 of [DOCSIS PHYv3.0].\n\n\n\n12/02/20                                         CableLabs                                                 41\n\fCM-SP-PHYv4.0-I03-201202                                     Data-Over-Cable Service Interface Specifications\n\n\n7 PHY SUBLAYER FOR OFDM\n7.1    Scope\nThis specification defines the electrical characteristics and signal processing operations for a cable modem (CM)\nand Cable Modem Termination System (CMTS). It is the intent of this specification to define an interoperable CM\nand CMTS such that any implementation of a CM can work with any CMTS. It is not the intent of this\nspecification to imply any specific implementation.\nThis section describes CM and CMTS physical layer requirements for DOCSIS 4.0-compliant devices in either\nFull-Duplex DOCSIS (FDX) or Frequency Division Duplexed (FDD) environments.\nDOCSIS 4.0 FDX is an expansion of the DOCSIS 3.1 specification that is targeted at significantly increasing\nupstream capacity by using the spectrum currently used for downstream transmission for simultaneous upstream\nand downstream communications via full duplex communications. Therefore, many sections refer to basic OFDM\nsublayer definitions described in the [DOCSIS PHYv3.1] specification.\nDOCSIS 4.0 FDD is an expansion of the DOCSIS 3.1 specification that is targeted at significantly increasing\nupstream and downstream capacity by extending the available upstream dedicated spectrum beyond previously\ndefined upper bounds to as much as 684 MHz and also extending the available downstream spectrum capabilities to\n1794 MHz, while maintaining spectrum separation between upstream and downstream transmissions at a\npredefined frequency.\nThe following sections are intended to treat separately the PHY OFDM sublayer requirements for FDX or FDD\ncapability requirements. Section 7.2 and its subsections address the PHY sublayer requirements specific to\nDOCSIS 4.0 FDX functionality. Section 7.3 and its subsections address the PHY sublayer requirements specific to\nDOCSIS 4.0 FDD functionality.\n\n7.2    PHY Sublayer for FDX OFDM\nFull Duplex capability requires additional functions to be added to the DOCSIS 3.1 requirements. These new\nfunctions are specified in this specification. As with previous generations of DOCSIS technologies, DOCSIS 4.0-\ncompliant devices will be backward-compatible with previous generations of DOCSIS technology. The FDX\nAllocated Spectrum is subdivided into FDX channels that can be assigned to modems according to system\nrequirements. FDX channels carry both upstream and downstream traffic. The CMTS assignment of FDX channels\nwithin the FDX band for Full Duplex DOCSIS operation can be done incrementally over time as a transition\nstrategy, from existing DOCSIS networks to Full Duplex DOCSIS networks, as FDX-capable CMTSs and modems\nbecome available.\nFor an FDX DOCSIS system, a distributed architecture is assumed due to the echo cancellation functionality that is\nrequired. Thus, this portion of the specification refers to the physical layer functionality of an FDX-capable CMTS\nas the FDX Node. The CMTS is occasionally used to refer to the total functionality across the MAC layer and the\nPhysical layer.\nAn FDX-compliant FDX Node supports simultaneous upstream and downstream communications over each FDX\nchannel; this is enabled by cancellation techniques for self-interference and echo cancellation. FDX-compliant\ncable modems will operate in frequency division duplexing mode, where on any FDX channel, the CM is either\ntransmitting in the upstream or receiving in the downstream. An FDX-compliant CMTS allocates FDX channels to\ncable modems by providing modems access to upstream and downstream channels through FDD; a CM's operation\non an FDX channel in either US or DS can be changed by the CMTS. FDX channels can be bonded with non-FDX\nchannels and with other FDX channels.\nTo avoid the risk of co-channel interference (CCI) and adjacent channel interference (ACI) between CMs, the\nCMTS schedules transmissions and grants such that a CM does not transmit at the same time as other CMs that are\nsusceptible to interference from the transmitting CM are receiving. CM to CM interference susceptibility is\nmeasured through a sounding process that is defined in the specification. After measuring CM to CM interference\nsusceptibility, the CMTS creates groups of CMs that are susceptible to interfering with one another, called\n\n\n\n\n42                                                 CableLabs                                            12/02/20\n\fPhysical Layer Specification                                                                        CM-SP-PHYv4.0-I03-201202\n\n\nInterference Groups (IG), and schedules transmissions and grants to CMs to avoid having a CM transmit when\nother CMs in its IG are receiving.\nA DOCSIS 4.0-compliant CM supports two modes of operation related to FDX:\n    1.   DOCSIS 3.1 mode: The FDX CM behaves identically to a DOCSIS 3.1-compliant cable modem and\n         adheres to the requirements in section 7 of [DOCSIS PHYv3.1]. An FDX CM is in this mode if it is on a\n         non-FDX plant or it is on an FDX plant but configured to operate in DOCSIS 3.1 mode.\n    2.   FDX mode: An FDX CM is in this mode when it is on an FDX plant and is configured for FDX operation.\n         In this mode the CM adheres to the requirements in this specification. This includes when in both non-\n         FDX and FDX operational states.\nTransitioning between modes 1 and 2 requires a CM reboot.",5]],"viewer":{"atp_file":"pdf/CM-TP-PHYv4.0-ATP-D01-23xxxx_Clean-23Aug16.pdf","atp_page":1,"spec_file":"pdf/CM-SP-PHYv4.0-I03-201202.pdf","spec_pages":[98,5],"atp_revision":"D01 Draft · DOCX 已轉 PDF","spec_revision":"I03 Issued"}},"PHY-91.40":{"version":"D4.0","atp_page":1,"atp":"3.2\tFDD CM Error Rate Performance (PHY-91.40)(Roman)\t108\nPart 1. Receiver Packet Error Rate Tests with AWGN and Loaded Channel Scenario\t113\nProcedure 1.1: PER Test, AWGN Test with Loaded Channels 4k FFT\t123\nProcedure 1.2: PER Test, AWGN Test with Loaded Channels 8k FFT\t124","spec":[["7.3.5 FDD Downstream Transmit and Receive","7.3.5    FDD Downstream Transmit and Receive ..................................................................................... 123\n8      PHY-MAC CONVERGENCE ................................................................................................................. 137\n9      PROACTIVE NETWORK MAINTENANCE ........................................................................................ 138\nAPPENDIX I               ICI FROM CWT SOUNDING SIGNAL (INFORMATIVE) .............................................. 139\n o as the DOCSIS 3.1 and earlier specifications), leveraging the existing Media Access Control\n(MAC) and Physical (PHY) layers. It includes backward compatibility for the existing PHY layers in order to\nenable a seamless migration to the new technology. Further, the DOCSIS 4.0 specifications introduces Full Duplex\n(FDX) DOCSIS PHY layer technology as an expansion of the OFDM PHY layer introduced in the [DOCSIS\nPHYv3.1] specification to increase upstream capacity without significant loss of downstream capacity versus\nDOCSIS 3.1. The DOCSIS 4.0 specification also builds upon DOCSIS 3.1 OFDM and OFDMA technology with\nan extended Frequency Division Duplex (FDD) DOCSIS alternative. DOCSIS 4.0 FDD supports legacy high-split\nand also provides extended splits up to 684 MHz in an operational band plan which is referred to as Ultra-high\nSplit (UHS). DOCSIS 4.0 FDD also introduces expansion of usable downstream spectrum up to 1794 MHz. Both\nthe FDX and FDD DOCSIS 4.0 alternatives are based on OFDM PHY. Many sections refer to basic OFDM\nsublayer definitions described in [DOCSIS PHYv3.1].\nThere are differences in the cable spectrum planning practices adopted for different networks in the world. For the\nPHY layer defined in this specification, there is flexibility to deploy the technology in any spectrum plan; therefore,\nno special accommodation for different regions of the world is required for this new PHY layer.\nHowever, due to the inclusion of the DOCSIS 3.0 PHY layers for backward-compatibility purposes, there is still a\nneed for different region-specific physical layer technologies. Therefore, three options for physical layer\ntechnologies are included in this specification, which have equal priority and are not required to be interoperable.\nOne technology option is based on the downstream channel identification plan that is deployed in North America\nusing 6 MHz spacing. The second technology option is based on the corresponding European multi-program\ntelevision distribution. The third technology option is based on the corresponding Chinese multi-program television\ndistribution. All three options have the same status, notwithstanding that the document structure does not reflect\nthis equal priority. The first of these options is defined in Sections 5 and 6, whereas the second is defined by\nreplacing the content of those sections with the content of annex C of [DOCSIS PHYv3.1]. The third is defined by\nreplacing the content of those sections with the content of annex D of [DOCSIS PHYv3.1]. Correspondingly, [ITU-\nT J.83-B] and [CTA 542] apply only to the first option, and [EN 300 429] applies to the second and third.\nCompliance with this document requires compliance with one of these implementations, but not with all three. It is\nnot required that equipment built to one option interoperate with equipment built to the others.\nCompliance with frequency planning and EMC requirements is not covered by this specification and remains the\noperators' responsibility. In this respect, [FCC15] and [FCC76] are relevant to the USA; [CAN/CSA CISPR 22-10]\nand [ICES 003 Class A] to Canada; [EG 201 212], [EN 50083-1], [EN 50083-2], [EN 50083-7], [EN 61000-6-1],\nand [EN 61000-6-3] are relevant to the European Union; and [GB 8898-2011] and [GB/T 11318.1-1996] are\nrelevant to China.\nSee also [DOCSIS PHYv3.1], section 1.1.\n\n1.2     Background\n\n1.2.1    Broadband Access Network\nA coaxial-based broadband access network is assumed. This may take the form of either an all-coax or hybrid-\nfiber/coax (HFC) network. The generic term \"cable network\" is used here to cover all cases.\nA cable network uses a tree-and-branch architecture with analog transmission. The key functional characteristics\nassumed in this document are the following:\n\n\n\n8                                                     CableLabs                                                12/02/20\n\fPhysical Layer Specification                                                       CM-SP-PHYv4.0-I03-201202\n\n\n    •     Two-way transmission.\n    •     A maximum optical/electrical spacing between the CMTS and the most distant CM of 100 miles (160 km)\n          in each direction, although typical maximum separation may be 10-15 miles (16-24 km).\n\n1.2.2     Network and System Architecture\n\n1.2.2.1    The DOCSIS Network\nThe elements that participate in the provisioning of DOCSIS services are shown in Figure 1.\n\n\n\n\n                                          Figure 1 - The DOCSIS Network\n\n\nThe CM connects to the operator's HFC network and to a home network, bridging packets between them. Many\nCPE devices can connect to the CMs' LAN interfaces. CPE can be embedded with the CM in a single device, or\nthey can be separated into standalone devices, as shown in Figure 1. CPE may use IPv4, IPv6 or both forms of IP\naddressing. Examples of typical CPE are gateways, home routers, set-top devices, personal computers, etc.\nThe CMTS connects the operator's back office and core network to the HFC network. The CMTS's main function\nis to forward packets between these two domains, and optionally to forward packets between upstream and\ndownstream channels on the HFC network. The CMTS performs this forwarding with any combination of link-\nlayer (bridging) and network-layer (routing) semantics.\nFor a DOCSIS 4.0 system, a distributed architecture is assumed. Thus, where DOCSIS 4.0 specifications use the\n\"CMTS\" terminology it is implied to refer to legacy CMTS functionality as instantiated in the elements of the\ndistributed architecture.\nVarious applications are used to provide back office configuration and other support to the devices on the DOCSIS\nnetwork. These applications use IPv4 and/or IPv6 as appropriate to the particular operator's deployment. The\nfollowing applications include:\nProvisioning Systems:\n    •     The DHCP servers provide the CM with initial configuration information, including the device IP\n          address(es), when the CM boots.\n    •     The Configuration File server is used to download configuration files to CMs when they boot.\n          Configuration files are in binary format and permit the configuration of the CM's parameters.\n    •     The Software Download server is used to download software upgrades to the CM.\n    •     The Time Protocol server provides Time Protocol clients, typically CMs, with the current time of day.\n    •     The Certificate Revocation server provides certificate status.\n\n\n\n12/02/20                                             CableLabs                                                   9\n\fCM-SP-PHYv4.0-I03-201202                                      Data-Over-Cable Service Interface Specifications\n\n\nNetwork Management System (NMS):\n     •   The SNMP Manager allows the operator to configure and monitor SNMP Agents, typically the CM and\n         the CMTS.\n     •   The Syslog server collects messages pertaining to the operation of devices.\n     •   The IPDR Collector server allows the operator to collect bulk statistics in an efficient manner.\n\n1.2.3    Service Goals\nAs cable operators have widely deployed high-speed data services on cable television systems, the demand for\nbandwidth has increased. To this end, CableLabs' member companies have decided to add new features to the\nDOCSIS specification for the purpose of increasing capacity, increasing peak speeds, improving scalability,\nenhancing network maintenance practices, and deploying new service offerings.\nThe DOCSIS system allows transparent bi-directional transfer of Internet Protocol (IP) traffic, between the cable\nsystem headend and customer locations, over an all-coaxial or Hybrid-Fiber/Coax (HFC) cable network. This is\nshown in simplified form in Figure 2.\n                                                                                             CM\n                                                                                         Customer\n                                                                                          Premises\n                                                                                         Equipment\n                                                                                          Interface\n         Wide Area                                           Cable\n          Network                                           Network\n                       CMTS\n                     Network Side                                              Cable Modem            Customer\n                      Interface       CMTS\n                                                                                                      Premises\n                                                                                                      Equipment\n\n                     Figure 2 - Transparent IP Traffic through the Data-Over-Cable System\n\n1.2.4    Statement of Compatibility\nThis specification defines the DOCSIS 4.0 interface. Prior generations of DOCSIS were commonly referred to as\nthe DOCSIS 1.0, 1.1, 2.0, 3.0, and 3.1 interfaces. DOCSIS 4.0 is backward-compatible with some equipment built\nto the previous specifications. DOCSIS 4.0-compliant CMs interoperate seamlessly with DOCSIS 4.0, DOCSIS 3.1\nand DOCSIS 3.0 CMTSs. DOCSIS 4.0-compliant CMTSs seamlessly support DOCSIS 4.0, DOCSIS 3.1, DOCSIS\n3.0, DOCSIS 2.0, and DOCSIS 1.1 CMs.\n\n\n\n\n10                                                  CableLabs                                              12/02/20\n\fPhysical Layer Specification                                                                                                                    CM-SP-PHYv4.0-I03-201202\n\n\n1.2.5    Reference Architecture\n\n                     DOCSIS 4.0 Distributed CMTS Reference Architecture\n Interface Specification\n     CM-SP-R-PHY                 Remote PHY Specification\n     CM-SP-R-UEPI                Remote Upstream External PHY Interface Specification\n     CM-SP-TEI                   TDM Emulation Interfaces Specification\n\n\n1.3     Requirements\nThroughout this document, the words that are used to define the significance of particular requirements are\ncapitalized. These words are:\n     \"MUST\"              This word means that the item is an absolute requirement of this specification.\n     \"MUST NOT\"          This phrase means that the item is an absolute prohibition of this specification.\n     \"SHOULD\"            This word means that there may exist valid reasons in particular circumstances to ignore this item,\n                         but the full implications should be understood, and the case carefully weighed before choosing a\n                         different course.\n\n\n\n\n12                                                        CableLabs                                                 12/02/20\n\fPhysical Layer Specification                                                                 CM-SP-PHYv4.0-I03-201202\n\n\n   \"SHOULD NOT\"           This phrase means that there may exist valid reasons in particular circumstances when the listed\n                          behavior is acceptable or even useful, but the full implications should be understood, and the case\n                          carefully weighed before implementing any behavior described with this label.\n   \"MAY\"                  This word means that this item is truly optional. One vendor may choose to include the item\n                          because a particular marketplace requires it or because it enhances the product, for example;\n                          another vendor may omit the same item.\n\nThis document defines many features and parameters, and a valid range for each parameter is usually specified.\nEquipment (CM and CMTS) requirements are always explicitly stated. Equipment is required to comply with all\nmandatory (MUST and MUST NOT) requirements to be considered compliant with this specification. Support of\nnon-mandatory features and parameter values is optional.\n\n1.4    Conventions\nIn this specification, the following convention applies any time a bit field is displayed in a figure. The bit field\nshould be interpreted by reading the figure from left to right, then top to bottom, with the most-significant bit\n(MSB) being the first bit read, and the least-significant bit (LSB) being the last bit read.\n\n1.5    Organization of Document\nSection 1 provides an overview of the DOCSIS 4.0 series of specifications including the DOCSIS reference\narchitecture and statement of compatibility.\nSection 2 includes a list of normative and informative references used within this specification or related\nspecifications.\nSection 3 defines the terms used throughout this specification or related specifications.\nSection 4 defines the abbreviations and acronyms used throughout this specification or related specifications.\nSection 5 provides a technical overview and lists the key features of DOCSIS 4.0 technology for the functional area\nof this specification; it also describes the key functional assumptions for the DOCSIS 4.0 system.\nSection 6 defines the PHY sublayer for SC-QAM.\nSection 7 defines the interface and related requirements for operation with the DOCSIS 4.0 channels, as well as for\ncombined operation of DOCSIS 3.0, DOCSIS 3.1 and DOCSIS 4.0 channels. This is addressed for each of: the CM\ndownstream and upstream physical layer; and for the CMTS downstream upstream physical layer.\nSection 8 defines PHY-MAC convergence - how information is transferred between the MAC layer and the PHY\nlayer - in both the upstream and downstream.\nSection 9 defines the requirements supporting Proactive Network Maintenance (PNM).\nThe appendices contain informative material that provides more detailed explanations and examples of certain\naspects of this specification.\n\n\n\n\n12/02/20                                                CableLabs                                                              13\n\fCM-SP-PHYv4.0-I03-201202                                           Data-Over-Cable Service Interface Specifications\n\n\n2 REFERENCES\n2.1    Normative References\nIn order to claim compliance with this specification, it is necessary to conform to the following standards and other\nworks as indicated, in addition to the other requirements of this specification. Notwithstanding, intellectual\nproperty rights may be required to use or implement such normative references.\nAll references are subject to revision, and parties to agreement based on this specification are encouraged to\ninvestigate the possibility of applying the most recent editions of the documents listed below.\n [CAN/CSA           Information technology equipment - Radio disturbance characteristics - Limits and methods of\n CISPR 22-10]       measurement (Adopted IEC CISPR 22:2008, sixth edition, 2008-09).\n [DOCSIS DRFI]      Downstream Radio Frequency Interface Specification, CM-SP-DRFI-I16-170111, January 11, 2017, Cable\n                    Television Laboratories, Inc.\n [DOCSIS            DOCSIS 3.1, MAC and Upper Layer Protocols Interface Specification, CM-SP-MULPIv3.1-I21-201020,\n MULPIv3.1]         October 20, 2020, Cable Television Laboratories, Inc.\n [DOCSIS            DOCSIS 4.0, MAC and Upper Layer Protocols Interface Specification, CM-SP-MULPIv4.0-I03-201202,\n MULPIv4.0]         December 2, 2020, Cable Television Laboratories, Inc.\n [DOCSIS            DOCSIS 3.0, Physical Layer Specification, CM-SP-PHYv3.0-C01-171207, December 07, 2017, Cable\n PHYv3.0]           Television Laboratories, Inc.\n [DOCSIS            DOCSIS 3.1, Physical Layer Specification, CM-SP-PHYv3.1-I17-190917, September 17, 2019, Cable\n PHYv3.1]           Television Laboratories, Inc.\n [DVB-C2]           ETSI
