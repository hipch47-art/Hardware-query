const DATA={"D3.0":[["PHY 01.3","Downstream","CM Input Power and Frequency Range","確認 CM Downstream Receiver 在規定的輸入功率與頻率範圍內，能正常取得下行訊號、鎖定頻率並維持接收。","符合 ATP 指定的 Downstream 頻率、輸入功率與接收/鎖定條件；各測試點的頻率誤差與接收功率須符合 ATP 判定。",["Downstream Frequency","RX Input Power","Channel Lock","Frequency Accuracy"],["RX Input Level / CNR","RF Filter / Diplexer","Matching / PCB","Integrated Tuner","Clock / Reference"],"先確認 RX level 與頻率是否正常，再判斷外部 RF path 或接收 IC。若只有特定頻率失敗，優先做頻率掃描比較。","VSA / Spectrum Analyzer / Power Meter / CM Diagnostics"],["PHY 05.3","Downstream","CM ITU-T J.83 Annex B Interleaving","驗證 CM 對 ITU-T J.83 Annex B Downstream Interleaving 設定的接收與解碼能力。","依 ATP 指定的 Interleaver 設定與接收條件完成測試，且錯誤/不可更正 codeword 符合 ATP 判定。",["Downstream Modulation","Interleaver Setting","RX Level","CER / Uncorrectable Codewords"],["Interleaver Configuration","RX C/N","Integrated Receiver","Clock / Reference","Firmware / Configuration"],"若基本接收正常但特定 Interleaver 組合失敗，優先比較 CM 設定、PHY configuration 與 receiver decoding。","CM Diagnostics / MIB / VSA / Packet Generator"],["PHY 07.3","Downstream","Bit Error Rate and Codeword Error Rate","驗證 Cable Modem Downstream Receiver 在 AWGN、Adjacent Channel、Non-Adjacent/Image Channel 及 Loaded Plant 等條件下的錯誤率性能。","ATP 以 Codeword Error Rate / Uncorrectable Codewords 判定；測試條件下不得超過 ATP 規定的錯誤率限制。",["Downstream RX Power","C/N","Channel Lock","CER / Uncorrectable Codewords","Interference Condition"],["RX Level / CNR","RF Filter / Selectivity","Integrated Tuner / Receiver","Clock / Reference","Power Integrity"],"RX power 與 C/N 正常但 CER 仍 FAIL，優先查 receiver/clock/power；只有加入鄰頻干擾才 FAIL，優先查 filter/selectivity。","VSA / Spectrum Analyzer / Power Meter / CM MIB / Packet Generator"],["PHY 10.3","Upstream","Upstream Frequency Range","確認 Cable Modem Upstream 發射頻率與頻率準確度符合 DOCSIS 3.0 規定，並能在指定 Upstream 頻率正常建立傳輸。","符合 ATP 指定的 Upstream 頻率範圍與 Frequency Accuracy 測試條件。",["TX Frequency","Channel Lock / Ranging","Frequency Accuracy","TX Level"],["TX Frequency Setting","Clock / Reference","Integrated RF TX","RF TX Path","Firmware / Configuration"],"只有特定頻率 FAIL 時，先比較頻率、TX power 與 RF response；不要直接判定 PA。","Spectrum Analyzer / Frequency Counter / VSA / CM Diagnostics"],["PHY 12.3","Upstream","Upstream Channel Transmit Power","驗證 CM 在不同 Upstream Channel、頻率、調變與多頻道條件下的 TX Output Power 與 Power Accuracy。","各測試條件的 TX power / power accuracy 符合 ATP 指定限制。",["TX Output Power","PA VDD","PA Current","Channel Frequency","Calibration"],["PA Gain / Compression","PA Bias","PA VDD / PSU","RF Path Loss","Calibration"],"高功率或多頻道才 FAIL，優先分辨 PA compression 與 PSU droop；單頻率異常再查 RF path。","Power Meter / Spectrum Analyzer / Oscilloscope / Current Probe"],["PHY 13.3","Upstream","CMTS Input Power Operating Range","驗證 CM 在規定的 Upstream 傳輸條件下，CMTS 端能接收到符合要求的輸入功率範圍。","CMTS 接收的 CM upstream signal level 符合 ATP 指定操作範圍。",["CM TX Power","CMTS RX Level","Frequency","Cable Attenuation"],["TX Power Calibration","PA Gain","RF Path Loss","CMTS/Plant Path","Configuration"],"先區分 CM 本端輸出與 cable/plant attenuation；CM 端 power 正常而 CMTS 端異常時，不要直接判定 PA。","Power Meter / Spectrum Analyzer / CMTS Diagnostics"],["PHY 15.3","Upstream","Carrier Power Flatness","驗證 Upstream carrier 在規定頻率範圍內的功率平坦度。","Carrier power flatness 符合 ATP 指定的頻率範圍與平坦度限制。",["TX Power vs Frequency","RF Path Response","PA Gain","Filter/Diplexer"],["RF Matching / Filter","PA Frequency Response","Diplexer","PCB Trace","PA Bias"],"頻率越高越差通常優先查 RF path / filter / matching；全頻段一起變動則查 PA/PSU。","VNA / Spectrum Analyzer / Power Meter"],["PHY 16.3","Upstream","CM Upstream Randomizer and Preamble","驗證 CM Upstream Randomizer 與 Preamble 的產生與傳送符合 DOCSIS 3.0 規定。","CM 產生的 Randomizer / Preamble 與 ATP 指定格式及接收判定一致。",["Burst Waveform","Preamble","Randomizer Pattern","VSA Decode"],["PHY Configuration","Integrated RF TX","Clock / Timing","Firmware","Configuration"],"若 RF level 正常但 waveform/preamble decode 異常，優先查 PHY configuration、clock/timing 與 firmware。","VSA / Spectrum Analyzer / CM Diagnostics"],["PHY 17.3","Upstream","Upstream Spectrum and Out-of-Band Noise and Spurs (On-Burst)","驗證 CM 在 Upstream burst 傳輸期間的頻譜形狀、帶外雜訊與 spur 是否符合規範。","On-Burst 頻譜與 out-of-band noise/spurs 符合 ATP 各測試條件的限制。",["TX Spectrum","Spur Frequency/Level","TX Power","Channel Configuration"],["PA Nonlinearity","PA Compression","Clock / PLL","DC-DC Coupling","PCB / Ground"],"跟著 TX power 移動的 spur 優先查 PA；固定頻率 spur 優先查 clock/PLL/DC-DC/digital coupling。","Spectrum Analyzer / Near-field Probe / Oscilloscope"],["PHY 18.3","Upstream","Upstream Spectrum and Out-of-Band Noise and Spurs (Off-Burst)","驗證 CM 未進行 Upstream burst 傳輸時的頻譜、帶外雜訊與 spur。","Off-Burst noise/spurs 符合 ATP 指定限制。",["TX Off Spectrum","Fixed Spurs","DC-DC Ripple","Reference Clock"],["Clock / PLL","DC-DC Switching","Digital Coupling","Ground / PCB","LO Leakage"],"TX OFF 仍有固定 spur 時，不要先換 PA；優先追 clock、DC-DC、digital coupling 與 grounding。","Spectrum Analyzer / Near-field Probe / Oscilloscope"],["PHY 20.3","Upstream","Pre-Equalizer Test","驗證 CM Upstream Pre-Equalizer 能依通道響應產生正確係數，並改善接收端的等化後 MER。","依 ATP 指定 echo/channel response 與 equalization 條件，MER、係數格式與相關判定符合要求。",["Pre-EQ Coefficients","RF Frequency Response","MER","Echo Condition"],["RF Frequency Response","RF Matching","Filter/Diplexer","PA Response","Calibration"],"先確認 RF path 的頻率響應；若 un-equalized 異常，先查外部 RF path，不要直接判定 pre-EQ 演算法。","VNA / VSA / CMTS Diagnostics"],["PHY 21.3","Downstream","CM Receive Power Test","驗證 CM Downstream Receiver 在規定頻率、調變與輸入功率條件下能正確量測並維持接收。","各測試頻率與輸入功率條件下，CM reported receive power 與接收功能符合 ATP 判定。",["RX Input Power","Reported RX Power","Frequency","Channel Lock"],["External RF Path","Filter/Diplexer","Matching / PCB","Integrated Tuner","Calibration"],"VSA 實測 power 與 CM reported power 要分開比較；實測正常、CM 讀值異常時優先查 calibration/receiver。","Power Meter / VSA / Spectrum Analyzer / CM Diagnostics"],["PHY 22.3","Upstream","Upstream Packet Error Rate","驗證 CM Upstream 傳輸在 AWGN、Ingress、Adjacent Channel、Burst Interference 與 Common Path Interference 條件下的封包錯誤性能。","各 ATP 干擾條件下的 Packet Error Rate 符合指定限制。",["TX Power","MER","Interference","Packet Error Rate"],["RF Noise / Ingress","PA Linearity","Clock / Timing","RF Isolation","Power Integrity"],"先看 MER 與頻譜，再依干擾型態判斷是 RF noise、PA、clock 或 isolation。","VSA / Spectrum Analyzer / Packet Generator / CMTS"],["PHY 23.3","Upstream","Symbol Rate Change","驗證 CM 在 TDMA / S-CDMA 模式切換或 Symbol Rate 改變時，能維持規定的傳輸功率與重新 ranging 行為。","依 ATP 指定的 Symbol Rate、Power 與 Ranging 條件完成切換並符合判定。",["Symbol Rate","TX Power","Ranging","MER"],["PHY Configuration","PA Power Control","Clock / Timing","Firmware","Calibration"],"若改變 symbol rate 後 power 或 ranging 異常，優先查 power control、timing 與 configuration。","VSA / Power Meter / CMTS Diagnostics"],["PHY 24.3","Upstream","Modulation Error Rate (MER)","驗證 CM Upstream 發射訊號的 Modulation Error Ratio 在不同頻率、模式與 channel loading 條件下符合要求。","MER 符合 ATP 指定的調變、頻率與 channel loading 測試限制。",["MER","TX Power","C/N","Channel Frequency"],["CNR / Noise","PA Linearity","Clock / PLL","Integrated RF TX","Power Integrity"],"Power PASS + MER FAIL 時不要先判定 gain；優先查 noise、PA linearity、clock/PLL 與 integrated RF TX。","VSA / Spectrum Analyzer / Oscilloscope"],["PHY 25.3","Upstream","Clock Synchronization","驗證 CM Upstream transmitter 的 timing、frequency synchronization 與 phase-noise/jitter performance 符合要求。","Clock jitter、carrier frequency/phase noise 與 synchronization 測試符合 ATP 判定。",["Reference Clock","Frequency Error","Jitter","Phase Noise"],["Reference Clock / Crystal","PLL","Clock Power","Ground / PCB","Firmware Configuration"],"PLL LOCK 不代表 phase-noise 一定正常；要直接量 reference/phase noise 與溫度相關性。","Phase Noise Analyzer / Frequency Counter / Oscilloscope"],["PHY 27.3","Upstream","CM Code Hopping Test","驗證 CM 在規定的 upstream frequency/code hopping 條件下能正確切換並維持傳輸。","Code hopping sequence、frequency、power 與傳輸結果符合 ATP 指定條件。",["Frequency Hop","TX Power","Channel Lock","Timing"],["Clock / Reference","PHY Configuration","Integrated RF TX","Firmware","Calibration"],"若單頻正常、hop 後異常，優先查 timing、frequency control 與 firmware/configuration。","Spectrum Analyzer / VSA / CM Diagnostics"],["PHY 29.3","Upstream","CM Return Loss","驗證 CM Upstream RF interface 在規定頻率範圍內具有符合要求的 Return Loss。","Upstream RF interface Return Loss 符合 ATP 指定限制。",["S11 / Return Loss","Connector","RF Matching","Filter/Diplexer"],["RF Matching","PCB Impedance","Connector / Launch","Filter/Diplexer","TVS / ESD"],"S11 FAIL 先確認 cable/adapter、connector 與校正，再用 TDR/VNA 定位；不要直接更換 PA。","VNA / TDR / Calibration Kit"]],"D3.1":[["TC1407 / PHY 30.31","Downstream","Cable Modem Downstream Input","驗證 CM Downstream input 在 D3.1 規定條件下的接收、頻率與輸入能力。","依 ATP 指定 Downstream input、頻率、power 與 lock/registration 條件判定。",["DS Input Power","Frequency","Channel Lock","MER/CER"],["RX Level / CNR","RF Filter / Diplexer","Integrated Tuner","Clock / Reference"],"先區分輸入 level、頻率與接收品質；若 level 正常但 error fail，再查 receiver/clock。","VSA / Spectrum Analyzer / Power Meter"],["TC1408 / PHY 31.31","Downstream","Error Rate Performance Tests","驗證 CM 在 D3.1 Downstream 接收條件下的 error-rate performance。","依 ATP 指定 error-rate/CNR 測試條件符合限制。",["RX Power","CNR/MER","Error Rate","Interference"],["RX CNR","Filter/Selectivity","Integrated Tuner","Clock / Reference"],"Power/CNR 正常仍 error fail，優先查 receiver/clock；有干擾才 fail 則查 selectivity。","VSA / Spectrum Analyzer / Packet Generator"],["TC1409 / PHY 32.31","Upstream","OFDM Upstream Transmitter Capabilities","驗證 CM D3.1 upstream OFDMA transmitter 的 channel、modulation、FFT 與傳輸能力。","支援 ATP 指定 OFDMA channel、FFT、modulation/profile 與 transmitter capability。",["OFDMA Configuration","TX Spectrum","TX Power","MER"],["PHY Configuration","Integrated RF TX","PA","Clock / Timing","Power Integrity"],"配置異常先查 PHY profile；power/MER/頻譜異常再分 PA、clock、power。","VSA / Spectrum Analyzer / CM Diagnostics"],["TC1410 / PHY 33.31","Upstream","Upstream TX Output Power","驗證 CM Upstream TX output power 與 power accuracy。","TX output power / accuracy 符合 ATP 指定限制。",["TX Output Power","PA VDD","PA Current","Frequency"],["PA Gain / Compression","PA Bias","PA VDD / PSU","RF Path","Calibration"],"高功率、多 channel 才 fail，優先分 PA compression 與 PSU droop。","Power Meter / Oscilloscope / Current Probe"],["TC1411 / PHY 34.31","Upstream","Upstream Noise and Spurs with Transmitted Burst ON","驗證 upstream transmitted burst ON 時的 in-band/out-of-band noise 與 spurs。","Burst ON noise/spurs 符合 ATP 限制。",["TX Spectrum","Spur","TX Power","Burst Condition"],["PA Nonlinearity","PA Compression","PSU","Clock / PLL","PCB Coupling"],"跟著 TX power 移動→PA；固定 spur→clock/PLL/DC-DC；多 channel 才 fail→PSU/IMD。","Spectrum Analyzer / Near-field Probe"],["TC1412 / PHY 35.31","Upstream","Upstream Noise and Spurs with Transmitted Burst OFF","驗證 transmitter burst OFF 時的 upstream noise 與 spurs。","Burst OFF noise/spurs 符合 ATP 限制。",["TX OFF Spectrum","Fixed Spur","DC-DC Ripple","Clock"],["Clock / PLL","DC-DC Switching","Digital Coupling","Ground / PCB","LO Leakage"],"TX OFF 仍有 spur，優先查 clock/PLL/DC-DC/digital coupling，不先判 PA。","Spectrum Analyzer / Near-field Probe / Oscilloscope"],["TC1413 / PHY 36.31","Upstream","Ranging and Equalization","驗證 CM ranging 與 upstream equalization 能在規定條件下建立正確傳輸。","Ranging、timing、equalization 與傳輸結果符合 ATP。",["Ranging","Timing","TX Power","Equalizer"],["RF Level/Path","Clock / Timing","Equalizer/PHY","Configuration"],"若 level 正常但 ranging 不穩，優先查 timing/clock；頻率相關再查 RF path。","CMTS Diagnostics / VSA / Spectrum Analyzer"],["TC1414 / PHY 37.31","Upstream","Cable Modem Return Loss","驗證 CM upstream RF interface 的 return loss。","Return Loss 符合 ATP 指定限制。",["S11","Connector","Matching","Filter"],["RF Matching","PCB","Connector / Launch","Filter/Diplexer"],"先做 VNA calibration 與 connector/adapter A/B，再定位 PCB/matching。","VNA / TDR"],["TC1415 / PHY 38.31","Upstream","Upstream Transmitter Burst Flatness","驗證 upstream transmitter burst 期間的 power flatness。","Burst power flatness 符合 ATP 指定 peak-to-peak 限制。",["Burst Flatness","Frequency Response","TX Power","PA Bias"],["PA Gain Flatness","RF Matching","Filter/Diplexer","PA Bias / PSU"],"頻率相關→RF path；時間相關→PA bias/AGC/PSU；多 channel 才 fail→PA loading/PSU。","VSA / Spectrum Analyzer / Oscilloscope"],["TC1416 / PHY 39.31","Upstream","Cable Modem Timing and Synchronization","驗證 CM upstream timing、frequency synchronization 與相關穩定性。","Timing/frequency synchronization 符合 ATP。",["Reference Clock","Frequency Error","Timing","Phase Noise"],["Reference Clock","PLL","Clock Power","Ground / PCB"],"固定 frequency error/phase-noise 問題優先查 reference/PLL，不只看 LOCK。","Frequency Counter / Phase Noise Analyzer / Oscilloscope"],["TC1417 / PHY 40.31","Upstream","CM's Proactive Network Maintenance","驗證 CM 的 PNM/diagnostic data 與 upstream channel measurement 能力。","PNM measurement、coefficients/data 與 ATP 指定項目符合要求。",["PNM Data","Channel Response","Pre-EQ Coefficients","MER"],["RF Path Response","Equalizer/PHY","Configuration","Firmware","Calibration"],"若 PNM data 與實際 RF response 不一致，先比較 VNA/VSA 與 CM report，再判 calibration/PHY。","VNA / VSA / CM Diagnostics"]],"D4.0":[["PHY-90.40","Downstream","Basic CM OFDM/FDD Input","驗證 CM Downstream Receiver 能在 D4.0 FDD 頻率範圍內正確接收 OFDM 訊號，支援規定的 OFDM Channel 頻寬與多 Channel 配置，並能完成同步、Lock 及 Registration。","至少 32 個 SC-QAM、至少 5 個獨立 OFDM channels；OFDM channel 最大 192 MHz；接收頻率涵蓋至 1794 MHz；完成 acquisition/lock/registration；1000 packets 至少 990 成功。",["DS Input Power","Frequency / Lock","OFDM Channel Configuration","Registration","Packet Reception"],["RX Level / CNR","RF Filter / Diplexer","PCB / Matching","Integrated Tuner / Demod","Clock / Reference"],"頻率高端失敗先查 external RF path；RF path 正常但多 OFDM 才 fail，優先查 integrated tuner/IC、clock、power/config。","VSA / Spectrum Analyzer / VNA / CM Diagnostics"],["PHY-91.40","Downstream","FDD CM Error Rate Performance","驗證 CM 在 D4.0 FDD Downstream 的 OFDM/SC-QAM 接收條件下，達到規定 CNR 時的 packet error performance。","依 PHY/ATP CNR table 與測試流程，PER ≤ 10^-6；測試以 1500-byte packets 及規定 packet count 判定。",["RX Power","CNR","PER","Modulation"],["CNR / Noise","RF Filter / Selectivity","Integrated Tuner","Clock / Reference","Power Integrity"],"RX power 正常但 PER fail，優先查 CNR/noise、receiver、clock；高頻才 fail 查 RF path。","VSA / Spectrum Analyzer / Packet Generator"],["PHY-92.40","Upstream","OFDM Upstream Transmitter Capabilities","驗證 CM D4.0 FDD upstream OFDMA transmitter 支援規定的 split、channel 數量、FFT、modulation 與同時傳輸能力。","至少支援 2 個指定 US upper edges；至少 7 個獨立約 95/96 MHz OFDMA channels；2K/4K FFT；BPSK–4096-QAM；可同時傳輸。",["Split Configuration","OFDMA Channel Count/BW","FFT","TX MER","Simultaneous TX"],["PHY Configuration","Integrated RF TX","PA","Clock / Timing","PSU"],"單 channel pass、多 channel fail 優先查 PA loading/PSU/IC resource；特定 split fail 查 RF path。","VSA / Spectrum Analyzer / CM Diagnostics"],["PHY-93.40","Upstream","Upstream TX Output Power","驗證 D4.0 FDD CM upstream transmitter 在各支援 split、頻率、功率與多 channel 條件下的實際輸出功率及功率準確度。","實際 transmitted power 依 PHY/ATP 指定條件符合 power accuracy；以 UHS split、P1.6r_n 與 multi-channel power difference 等條件判定。",["TX Output Power","P1.6r_n / Commanded Power","PA VDD","PA Current","Channel Frequency"],["PA Gain / Compression","PA Bias","PA VDD / PSU","RF Path Loss","Calibration"],"高功率或多 channel 才 FAIL，先分 PA compression 與 PSU droop；單一頻率異常再查 RF path 與 matching。","Power Meter / Spectrum Analyzer / Oscilloscope / Current Probe"],["PHY-94.40","Upstream","FDD/US Upstream Noise/Spurious Burst ON","驗證 FDD upstream transmitter burst ON 時的 in-band、out-of-band noise 與 spurious emissions。","依 PHY I03 Table 33/34 的 transmitting-burst limits 判定，包括 in-band OFDMA、85–108 MHz、U/D transition 與 DS range 等限制。",["TX Spectrum","Spur","TX Power","Burst Condition"],["PA Nonlinearity","PA Compression","PSU","Clock / PLL","PCB / Ground"],"TX-related spur→PA/linearization；fixed spur→clock/PLL/DC-DC；85–108/transition→diplexer/isolation。","Spectrum Analyzer / Near-field Probe / Oscilloscope"],["PHY-95.40","Upstream","FDD/US Upstream Noise/Spurious Burst OFF","驗證 FDD upstream transmitter burst OFF 時的 noise 與 spurious emissions。","依 PHY I03 Between-Burst limits 判定；ATP D01 procedure 尚未完整定稿，避免自行補寫不存在的 ATP 步驟。",["TX OFF Spectrum","Fixed Spur","DC-DC Ripple","Reference Clock"],["Clock / PLL","DC-DC Switching","Digital Coupling","Ground / PCB","LO Leakage"],"TX OFF 也有 spur，優先查 clock/PLL、DC-DC、digital coupling 與 grounding。","Spectrum Analyzer / Near-field Probe / Oscilloscope"],["PHY-98.40","Upstream","Upstream Transmitter Burst Flatness","驗證 D4.0 FDD upstream transmitter 在 OFDMA burst 期間的 transmitted power flatness，確認不同 grant、channel loading 與 FFT 條件下 burst 內功率維持要求。","OFDMA burst 期間 transmitted power peak-to-peak 符合 ATP/PHY 指定限制；ATP D01 使用 0.1 dB 等級的 burst flatness 判定。",["Burst Flatness","TX Power vs Time","Frequency Response","PA Bias","Single/Dual Channel"],["PA Gain Flatness","RF Matching","Filter/Diplexer","PA Bias","PSU / Load Transient"],"頻率相關→RF path；時間相關→PA bias/AGC/PSU transient；雙 channel 才 FAIL→PA loading/PSU/IMD。","VSA / Spectrum Analyzer / Oscilloscope"]]};const SOURCES={"PHY 01.3":{"version":"D3.0","atp_page":10,"atp":"2.1 CM INPUT POWER AND FREQUENCY RANGE (PHY 01.3)\n\nIntroduction and Scope\nThis test verifies the ability of the CM to receive transmissions at minimum, nominal, and maximum power.\nThe cable modem must be able to accept input RF signals that are centered on frequencies from 111 MHz to 867\nMHz, with a nominal channel spacing of 6 MHz. This test will test the ability of the cable modem to power up and\nlocate different center frequencies across the above-specified range. The channels chosen include the lowest and\nhighest CATV channels within those bounds. The non-channel end frequencies are not tested because a normally\noperating cable modem will only search for carriers that are within normal CATV channels. Tests are performed on\none channel out of each ten channels, in each of the STD/IRC and HRC channel plans that should be supported by\nthe cable modem. The center frequencies to be tested are the same as Table 2-1.\n                                  Table 2-1 - CM Input Power Range Test Frequencies\n\n                      Test Case         CEA Channel #        STD/IRC               HRC\n                      Number X\n                         1                   99              117 MHz            115.75 MHz\n                         2                   19              153 MHz            151.75 MHz\n                         3                   13              213 MHz            211.75 MHz\n                         4                   32              273 MHz            271.75 MHz\n                         5                   42              333 MHz            331.75 MHz\n                         6                   52              393 MHz            391.75 MHz\n                         7                   62              453 MHz            451.75 MHz\n                         8                   72              513 MHz            511.75 MHz\n                         9                   82              573 MHz            571.75 MHz\n                         10                  92              633 MHz            631.75 MHz\n                         11                  107             693 MHz            691.75 MHz\n                         12                  117             753 MHz            751.75 MHz\n                         13                  127             813 MHz            811.75 MHz\n                         14                  136             867 MHz            865.75 MHz\n\n\n\nAssumptions\nThe cable modem must work at the above frequencies with input levels ranging from +15 dBmV to -15 dBmV. The\nroutine procedures will test each of the above frequencies at the following RF levels:\n0 dBmV, +15 dBmV, and -15 dBmV\nThese tests will be executed using both 64-QAM and 256-QAM downstream modulation modes.\n\nSetup and Configuration\nThis test uses.\nEquipment List\n•   Vector Signal Analyzer\n•   CMTS\n•   Test Controller\n\n\n                                                                ®\n2                                                   CableLabs                                               2/04/10\n\fPhysical Layer Interface Acceptance Test Plan                                  CM-TP-PHYv3.0-ATP-I05-100204\n\n\n•   Downstream Attenuator\n•   Packet Generator\nTopology\n\n\n\n\n                         Figure 2-1 - Input Power and Frequency Range Test Topology\n\n\n\nSystem Configuration\nThis test requires SNMP control of the CMTS output transmitter frequency and SNMP access to MIB objects in the\nCM. The CMTS SNMP MIB objects to verified are:\n                                     Table 2-2 - docsIfDownstreamChannelTable\n\n                     MIB Object                             OID                     Syntax          Access\n        docsIfDownChannelId                   1.3.6.1.2.1.10.127.1.1.1.1.1     INTEGER            RO\n        docsIfDownChannelFrequency            1.3.6.1.2.1.10.127.1.1.1.1.2     INTEGER            RW\n        docsIfDownChannelModulation           1.3.6.1.2.1.10.127.1.1.1.1.4     INTEGER            RW\n        docsIfDownChannelPower                1.3.6.1.2.1.10.127.1.1.1.1.6     TenthdBmV          RW\n\n\nThe CM SNMP MIB objects to be verified are:\n                                        Table 2-3 - docsIfSignalQualityTable\n\n                     MIB Object                            OID                     Syntax          Access\n          docsIfSigQUnerroreds               1.3.6.1.2.1.10.127.1.1.4.1.2      Counter32         RO\n          docsIfSigQCorrecteds               1.3.6.1.2.1.10.127.1.1.4.1.3      Counter32         RO\n          docsIfSigQUncorrectables           1.3.6.1.2.1.10.127.1.1.4.1.4      Counter32         RO\n\n\nThe CM and CMTS must be configured to allow for unrestricted SNMP SET and GET accesses by the controller.\nVector Analyzer to verify CMTS downstream RF center frequency and verify RF power delivered to the CM.\n\nProcedures\nPart 1. CM Input Power and Frequency Range for 64-QAM STD/IRC\nProcedures do not itemize appropriate warm up times, settling times, or time outs. Procedures test case scenarios\nrefer to Table 2-1.\n\n\n\n                                                                  ®\n2/04/10                                            CableLabs                                                        3\n\fCM-TP-PHYv3.0-ATP-I05-100204                                                                                DOCSIS 3.0\n\n\nPROCEDURE 1.1: CM INPUT POWER FOR 64QAM STD/IRC AT FREQUENCIES\nIDENTIFIED BY TEST CASE X 1\n      Step #                                                Step Description\n    1.x.1      Connect test setup as shown in Figure 2-1 above.\n    1.x.2      CM AC power off.\n    1.x.3      CMTS power on. Wait for CMTS ready.\n    1.x.4      Provision the CMTS as follows:\n    1.x.4.1    Configure MAC Domain according to scenario described in Appendix D.5 (1 DS & 1 US)\n    1.x.4.2    Using MIB docsIfDownChannelFrequency set the downstream frequency to the STD/IRC frequency\n               indicated by test case X of Table 2-1.\n    1.x.4.3    Using MIB docsIfDownChannelModulation set the downstream channel modulation to 64-QAM.\n    1.x.4.4    Using MIB docsIfDownChannelInterleave set the downstream interleaver to taps128increment1.\n    1.x.4.5    Using MIB docsIfDownChannelPower and by adjusting the downstream path attenuator make sure that the\n               input receive power level at the CM is 0 dBmV ± 0.5 dB.\n    1.x.4.6    Provision upstream using PHYChannel1.cfg described in Appendix A.\n    1.x.4.7    Using MIB docsIfUpChannelModulationProfile select a burst profile with characteristics as described by\n               Burst Profile 8 Appendix C.\n    1.x.4.8    Using MIB docsIfUpChannelFrequency set the upstream center frequency to 30 MHz.\n    1.x.5      Set the Vector Signal Analyzer (VSA) as follows:\n    1.x.5.1    Set VSA for 64-QAM demodulation.\n    1.x.5.2    Set the VSA reference filter as Root Nyquist with Alpha = 0.18.\n    1.x.5.3    Set the VSA Symbol Rate to 5.056941 MHz.\n    1.x.5.4    Set the number of equalized taps at the VSA to 31.\n    1.x.5.5    Set the VSA to use an averaging of 50.\n    1.x.5.6    On the VSA adjust the Input Range to optimize performance.\n    1.x.5.7    On the VSA adjust the step size between E10-8 to E10-6 to optimize performance.\n    1.x.5.8    On the VSA adjust the Result Length between 256 and 1024 symbols to optimize performance.\n    1.x.6      Measure and record the downstream channel frequency shown on the VSA display.\n    1.x.7      Measure and record the downstream channel power at the CM port on the VSA.\n    1.x.8      Turn CM power on. Wait for CM ready.\n    1.x.9      Using CM MIB docsIfDownChannelFrequency verify the magnitude of frequency error is ≤ ±30 kHz.\n                            MIB Object                       Expected Value            Recorded Value         Pass/Fail\n    1.x.9.1    docsIfDownChannelFrequency               Frequency error ≤ ± 30\n                                                        kHz\n    1.x.10     Using CM MIB docsIfDownChannelPower verify that the input receive power level at the CM is 0 dBmV ±\n               2dB.\n                            MIB Object                       Expected Value            Recorded Value         Pass/Fail\n    1.x.10.1   docsIfDownChannelPower                   0 dBmV ±3 dB\n    1.x.11     Configure packet generator setting packet length to 1518 bytes.\n    1.x.12     Using packet generator, send downstream packets through CM at a rate of 10 packets per second to verify\n               ability to receive transmissions and proper operation.\n    1.x.13     Using MIBs read the CM uncorrectable codewords on a 10 second interval.\n    1.x.13.1   Using MIB docsIfSigQUncorrectables read the uncorrectable codewords counter and record as\n               docsIfSigQUncorrectables (t=0s).\n\n\n1\n Procedure updated per PHYv3.0-ATP-N-08.0746-1 by JS on 02/02/09 and revised per PHYv3.0-ATP-N-09.0781\non 6/8/09 by JB.\n\n\n                                                                    ®\n4                                                       CableLabs                                                 2/04/10\n\fPhysical Layer Interface Acceptance Test Plan                                     CM-TP-PHYv3.0-ATP-I05-100204\n\n\n   Step #                                                  Step Description\n 1.x.13.2   Wait for 10 seconds.\n 1.x.13.3   Using MIB docsIfSigQUncorrectables read the uncorrectable codewords counter and record as\n            docsIfSigQUncorrectables (t=10s).\n 1.x.14     Command packet generator to stop sending packets.\n 1.x.15     Verify that there are no uncorrectable codewords errors are present during a measurement interval of 10\n            seconds.\n                    Element Tested                       Expected Value             Recorded Value         Pass/Fail\n 1.x.15.2   If test was repeated, number of    > 10\n            subsequent consecutive runs\n            with no errors.\n 1.x.16     AC power off to CM.\n 1.x.17     Controlling the variable downstream attenuator and if necessary using the CMTS MIB\n            docsIfDownChannelPower set the receive power at the CM to -15 dBmV -0/+0.5 dB.\n 1.x.18     On the VSA adjust the Input Range to optimize performance.\n 1.x.19     Measure and record the downstream channel power at the CM port on the VSA.\n 1.x.20     Turn CM power on. Wait for CM ready.\n 1.x.21     Using CM MIB docsIfDownChannelFrequency verify the magnitude of frequency error is ≤ ±30 kHz.\n                        MIB Object                         Expected Value           Recorded Value         Pass/Fail\n 1.x.21.1   docsIfDownChannelFrequency                Frequency error ≤ ±30 kHz\n 1.x.22     Using CM MIB docsIfDownChannelPower verify that the input receive power level at the CM is -15 dBmV ±\n            2dB.\n                        MIB Object                         Expected Value           Recorded Value         Pass/Fail\n 1.x.22.1   docsIfDownChannelPower                    -15 dBmV ±3 dB\n 1.x.23     Configure packet generator setting packet length to 1518 bytes.\n 1.x.24     Using packet generator, send downstream packets through CM at a rate of 10 packets per second to verify\n            ability to receive transmissions and proper operation.\n 1.x.25     Using MIBs read the CM uncorrectable codewords on a 10 second interval.\n 1.x.25.1   Using MIB docsIfSigQUncorrectables read the uncorrectable codewords counter and record as\n            docsIfSigQUncorrectables (t=0s).\n 1.x.25.2   Wait for 10 seconds.\n 1.x.25.3   Using MIB docsIfSigQUncorrectables read the uncorrectable codewords counter and record as\n            docsIfSigQUncorrectables (t=10s).\n 1.x.26     Command packet generator to stop sending packets.\n 1.x.27     Verify that there are no uncorrectable codewords errors are present during a measurement interval of 10\n            seconds.\n                    Element Tested                       Expected Value             Recorded Value         Pass/Fail\n 1.x.27.1   No Uncorrectable Codewords (In    docsIfSigQUncorrectables\n            case of failure, test should be   (t=0s) -\n            repeated and recorded at least    docsIfSigQUncorrectables\n            ten more times to verify          (t=10s)=0\n            measurement has not been\n            corrupted by extraneous noise.)\n 1.x.27.2   If test was repeated, number of    > 10\n            subsequent consecutive runs\n            with no errors.\n 1.x.28     AC power off to CM.\n 1.x.29     Controlling the variable downstream attenuator and if necessary using the CMTS MIB\n            docsIfDownChannelPower set the receive power at the CM to +15 dBmV +0/-0.5 dB.\n 1.x.30     On the VSA adjust the Input Range to optimize performance.\n\n\n\n\n                                                                  ®\n2/04/10                                            CableLabs                                                           5\n\fCM-TP-PHYv3.0-ATP-I05-100204                                                                                 DOCSIS 3.0\n\n\n      Step #                                                   Step Description\n    1.x.31      Measure and record the downstream channel power at the CM port on the VSA.\n    1.x.32      Turn CM power on. Wait for CM ready.\n    1.x.33      Using CM MIB docsIfDownChannelFrequency verify the magnitude of frequency error is ≤ ±30 kHz.\n                             MIB Object                        Expected Value           Recorded Value         Pass/Fail\n    1.x.33.1    docsIfDownChannelFrequency                Frequency error ≤ ±30 kHz\n    1.x.34      Using CM MIB docsIfDownChannelPower verify that the input receive power level at the CM is 15 dBmV ±\n                2dB.\n                             MIB Object                        Expected Value           Recorded Value         Pass/Fail\n    1.x.34.1    docsIfDownChannelPower                    15 dBmV ±3 dB\n    1.x.35      Configure packet generator setting packet length to 1518 bytes.\n    1.x.36      Using packet generator, send downstream packets through CM at a rate of 10 packets per second to verify\n                ability to receive transmissions and proper operation.\n    1.x.37      Using MIBs read the CM uncorrectable codewords on a 10 second interval.\n    1.x.37.1    Using MIB docsIfSigQUncorrectables read the uncorrectable codewords counter and record as\n                docsIfSigQUncorrectables (t=0s).\n    1.x.37.2    Wait for 10 seconds.\n    1.x.37.3    Using MIB docsIfSigQUncorrectables read the uncorrectable codewords counter and record as\n                docsIfSigQUncorrectables (t=10s).\n    1.x.38      Command packet generator to stop sending packets.\n    1.x.39      Verify that there are no uncorrectable codewords errors are present during a measurement interval of 10\n                seconds.\n                        Element Tested                       Expected Value             Recorded Value         Pass/Fail\n    1.x.39.1    No Uncorrectable Codewords         docsIfSigQUncorrectables\n                (In case of failure, test should   (t=0s) -\n                be repeated and recorded at        docsIfSigQUncorrectables\n                least ten more times to verify     (t=10s)=0\n                measurement has not been\n                corrupted by extraneous noise)\n    1.x.39.2    If test was repeated, number of    > 10\n                subsequent consecutive runs\n                with no errors.\n\n\nPart 2. CM Input Power and Frequency Range for 64-QAM HRC\nProcedures do not itemize appropriate warm up times, settling times, or time outs. For procedures test case scenarios\nrefer to Table 2-1.\nPROCEDURE 2.1: CM INPUT POWER FOR 64-QAM HRC AT FREQUENCIES\nIDENTIFIED BY TEST CASE X 2\n\n    Step #                                                   Step Description\n2.x.1          Connect test setup as shown in Figure 2-1 above.\n2.x.2          CM AC power off.\n2.x.3          CMTS power on. Wait for CMTS ready.\n2.x.4          Provision the CMTS as follows:\n2.x.4.1        Configure MAC Domain according to scenario described in Appendix D.5 (1 DS & 1 US).\n\n\n2\n Procedure updated per PHYv3.0-ATP-N-08.0746-1 by JS on 02/02/09 and revised per PHYv3.0-ATP-N-09.0781\non 6/8/09 by JB.\n\n\n                                                                      ®\n6                                                      CableLabs                                                  2/04/10\n\fPhysical Layer Interface Acceptance Test Plan                                   CM-TP-PHYv3.0-ATP-I05-100204\n\n\n  Step #                                                 Step Description\n2.x.4.2    Using MIB docsIfDownChannelFrequency set the downstream frequency to the HRC frequency indicated\n           by test case X of Table 2-1.\n2.x.4.3    Using MIB docsIfDownChannelModulation set the downstream channel modulation to 64-QAM.\n2.x.4.4    Using MIB docsIfDownChannelInterleave set the downstream interleaver to taps128increment1.\n2.x.4.5    Using MIB docsIfDownChannelPower and by adjusting the downstream path attenuator make sure that the\n           input receive power level at the CM is 0 dBmV ± 0.5 dB.\n2.x.4.6    Provision upstream using PHYChannel1.cfg described in Appendix A.\n2.x.4.7    Using MIB docsIfUpChannelModulationProfile select a burst profile with characteristics as described by\n           Burst Profile 8 Appendix C.\n2.x.4.8    Using MIB docsIfUpChannelFrequency set the upstream center frequency to 30 MHz.\n2.x.5      Set the Vector Signal Analyzer (VSA) as follows:\n2.x.5.1    Set VSA for 64-QAM demodulation.\n2.x.5.2    Set the VSA reference filter as Root Nyquist with Alpha = 0.18.\n2.x.5.3    Set the VSA Symbol Rate to 5.056941 MHz.\n2.x.5.4    Set the number of equalized taps at the VSA to 31.\n2.x.5.5    Set the VSA to use an averaging of 50.\n2.x.5.6    On the VSA adjust the Input Range to optimize performance.\n2.x.5.7    On the VSA adjust the step size between E10-8 to E10-6 to optimize performance.\n2.x.5.8    On the VSA adjust the Result Length between 256 and 1024 symbols to optimize performance.\n2.x.6      Measure and record the downstream channel frequency shown on the VSA display.\n2.x.7      Measure and record the downstream channel power at the CM port on the VSA.\n2.x.8      Turn CM power on. Wait for CM ready.\n2.x.9      Using CM MIB docsIfDownChannelFrequency verify the magnitude of frequency error is ≤ ±30 kHz.\n                        MIB Object                     Expected Value           Recorded Value            Pass/Fail\n2.x.9.1    docsIfDownChannelFrequency               Frequency error ≤ ±30\n                                                    kHz\n2.x.10     Using CM MIB docsIfDownChannelPower verify that the input receive power level at the CM is 0 dBmV ±\n           2dB.\n                        MIB Object                     Expected Value           Recorded Value            Pass/Fail\n2.x.10.1   docsIfDownChannelPower                   0 dBmV ±3 dB\n2.x.11     Configure packet generator setting packet (Multiple       TDMA:\nTransmit Channel mode disabled,         Pmin to +57 dBmV (32-QAM, 64-QAM)\nor only Multiple Transmit Channel       Pmin to +58 dBmV (8-QAM, 16-QAM)\nmode enabled with one channel in        Pmin to +61 dBmV (QPSK)\nthe TCS)                                S-CDMA:\n                                        Pmin to +56 dBmV (all modulations)\n                                        where\n                                        Pmin = +17 dBmV, 1280 kHz modulation rate\n                                        Pmin = +20 dBmV, 2560 kHz modulation rate\n                                        Pmin = +23 dBmV, 5120 kHz modulation rate\nLevel range per channel                 TDMA:\n(two channels in the TCS)               Pmin to +54 dBmV (32-QAM, 64-QAM)\n                                        Pmin to +55 dBmV (8-QAM, 16-QAM)\n                                        Pmin to +58 dBmV (QPSK)\n                                        S-CDMA:\n                                        Pmin to +53 dBmV (all modulations)\n                                        where\n                                        Pmin = +17 dBmV, 1280 kHz modulation rate\n                                        Pmin = +20 dBmV, 2560 kHz modulation rate\n                                        Pmin = +23 dBmV, 5120 kHz modulation rate\n\n\n\n\n45\n     Revised per PHYv3.0-N-14.1207-2 by JB on 1/5/15.\n46\n     Table modified per PHYv3.0-N-07.0456-1 #3 on 6/12/07 by KN.\n\n\n                                                                   \n12/07/17                                               CableLabs                                                   97\n\fCM-SP-PHYv3.0-C01-171207                                        Data-Over-Cable Service Interface Specifications\n\n\n\n            Parameter                                                    Value\nLevel range per channel             TDMA:\n(three or four channels in the TCS) Pmin to +51 dBmV (32-QAM, 64-QAM)\n ultiple Transmit Channel mode enabled. Requirements with Multiple\nTransmit Channel mode disabled are addressed in Section 6.2.19.4 below.\nThe CM MUST support varying the amount of transmit power. Requirements are presented for 1) range of reported\ntransmit power per channel; 2) step size of power commands; 3) step size accuracy (actual change in output power\nper channel compared to commanded change); and 4) absolute accuracy of CM output power per channel. The\nprotocol by which power adjustments are performed is defined in [MULPI3.0]. Such adjustments by the CM MUST\nbe within the ranges of tolerances described below. A CM MUST confirm that the transmit power per channel limits\nare met after a RNG-RSP is received for each of the CM's active channels that is referenced. An active channel for a\nCM is defined as any channel for which the CM has been given a grant, which it will use for channel initialization,\nor ranging, or any channel for which the CM is \"ranged.\" The set of \"active channels\" is also called the Transmit\n\n15\n Revised per PHYv3.0-N-06.0288-1 by GO on 10/19/06; revised equation per PHYv3.0-N-06.0340-1 by GO on 1/12/07.\n16\n Section modified per PHYv3.0-N-07.0570-2 on 1/25/08 and per PHYv3.0-N-08.0611-3 on 4/10/08 by KN. Revised per\nPHYv3.0-N-14.1173-2 on 1/5/15 by JB.\n\n\n                                                                 \n12/07/17                                            CableLabs                                                    71\n\fCM-SP-PHYv3.0-C01-171207                                          Data-Over-Cable Service Interface Specifications\n\n\nChannel Set. (There will be some mechanism by which a CMTS can command a CM to deactivate an active\nchannel, for the purpose of either reducing the number of active channels on that CM or for the purpose of adding a\ndifferent active channel as a replacement upstream channel for that CM.) Note that the set of channels actually\nbursting upstream from a CM is a subset of the active channels on that CM; often one or all active channels on a CM\nwill not be bursting, but such quiet channels are still \"active channels\" for that CM.\nTransmit power per channel is defined as the average RF power in the occupied bandwidth (channel width)\ntransmitted in the data symbols of a burst, assuming equal likely QAM symbols, measured at the F-connector of the\nCM. Total transmit power is defined as the sum of the transmit power per channel of each channel transmitting a\nburst at a given time. Maximum and minimum transmit power per channel level requirements refer to the CM's\ntarget transmit power per channel levels, defined as the CM's estimate of its actual transmit power per channel. The\nactual transmitted power per channel MUST be within ±2 dB of the target power. The target transmit power per\nchannel MUST be variable over the range specified in Table 6–12. The CM MUST use the target transmit power per\nchannel commanded by the CMTS, up to the maximum capability of the CM. If the Extended Upstream Transmit\nPower Support TLV in the MDD is OFF, the CMTS MUST NOT command the CM to a transmit power above Pmax\ngiven in Table 6–7, Table 6–8, and Table 6–9.If the Extended Upstream Transmit Power Support TLV in the MDD\nis ON, the CMTS MUST NOT command the CM to use a target transmit power level per channel greater than 61\ndBmV. When this TLV is on, the CM is expected to be commanded to exceed the transmit power Pmax listed in\nTable 6–7, Table 6–8, and Table 6–9 by an amount that is vendor-specific, meeting operator requirements. Note that\nall fidelity requirements specified in Section 6.2.22 still apply when the CM is operating over an extended transmit\npower range.\nThe CM communicates its ability to transmit above the maximum levels defined in Table 6–7, Table 6–8, and Table\n6–9 to the CMTS via a modem capability encoding as defined in [MULPI3.0]. When the CM indicates that it\nsupports the extended range and the CMTS confirms this capability, for each combination of the number of channels\nin the Transmit Channel Set and constellation the CM and CMTS MUST use the greater of the value from the CM’s\nadvertised capability encoding and the default value of Pmax specified in Table 6–7, Table 6–8, and Table 6–9 as Pmax\nfor that particular combination. When the CM indicates that it supports the extended range and the CMTS disables\nthis capability, the CM and CMTS MUST use the default values of Pmax specified in Table 6–7, Table 6–8, and\nTable 6–9. 17\nWith Multiple Transmit Channel mode enabled, let Pload = Phi _ Pr, for each channel, using the definitions for Phi and\nPr in the following subsections of 6.2.19. The channel corresponding to the minimum value of Pload is called the\nhighest loaded channel, and its value is denoted as Pload_1, in this specification even if there is only one channel in the\nTransmit Channel Set. A channel with high loading has a low Pload_n value (but not less than 0); the value of Pload_n is\nanalogous to an amount of back-off for an amplifier from its max power output. A channel has lower power output\nwhen that channel has a lower loading (more back-off) and thus a higher value of Pload_n. Note that the highest\nloaded channel is not necessarily the channel with the highest transmit power, since a channel’s max power depends\non the modulations it is supporting in its burst profiles. The channel with the second lowest value of Pload is denoted\nas the second highest loaded channel, and its loading value is denoted as Pload_2; the channel with the third lowest\nvalue of Pload is the third highest loaded channel, and its loading value is denoted as Pload_3; and the channel with the\nfourth lowest loading value is denoted as the fourth highest loaded channel, and its loading value is Pload_4 (in the\ncase of fewer than 4 channels in the Transmit Channel Set, Pload_n will only be valid for the n active upstream\nchannels). Pload_min_set defines the upper end of the Dynamic Range Window for the CM with respect to Phi for each\nchannel. Pload_min_set will limit the maximum power possible for each active channel to a value less than Phi when\nPload_min_set is greater than zero. Pload_min_set is a value commanded to the CM from the CMTS when the CM is given a\nTCC in registration and RNG-RSP messages [MULPI3.0]. Pload_min_set, Pload_n, Phi_n, Pr_n, etc., are defined only when\nMultiple Transmit Channel mode is enabled. 18\nThe CMTS MUST provide Pload_min_set such that Phi_n – Pload_min_set ≥ Plow_n for each active channel, or equivalently,\n\n                                         0 ≤ Pload_min_set ≤ Phi_n – Plow_n.\n\n\n\n17\n     Revised per PHYv3.0-N-10.0942-5 on 9/21/10 by JB.\n18\n     Revised this paragraph per PHYv3.0-N-06.0340-1 by GO on 1/11/07.\n\n\n                                                                        \n72                                                      CableLabs                                               12/07/17\n\fPhysical Layer Specification                                                           CM-SP-PHYv3.0-C01-171207\n\n\nCMTS commands adjusting Pr_n MUST be consistent with the Pload_min_set previously assigned to the CM and with\nthe following limits:\n\n                                Pload_min_set ≤ Phi_n – Pr_n ≤ Pload_min_set + 12 dB\nand the equivalent:\n\n                      Phi_n – (Pload_min_set + 12 dB) ≤ Pr_n ≤ Phi_n – Pload_min_set 19\nA value is computed, Plow_multi_n, for each channel in the Transmit Channel Set, which sets the lower end of the\ntransmit power Dynamic Range Window for that channel, given the upper end of the range (which is determined by\nPload_min_set). 20\n\n                                    Plow_multi_n = Phi_n – Pload_min_set – 12 dB.\nThe effect of Plow_multi_n is to restrict the dynamic range required (or even allowed) by a CM across its multiple\nchannels, when operating with multiple active channels. 21\nWhen the CMTS sends a new value of Pload_min_set to the CM, there is a possibility that the CM will not be able to\nimplement the change to the new value immediately, because the CM may be in the middle of bursting on one or\nmore of its upstream channels at the instant the command to change Pload_min_set is received at the CM. Some amount\nof time may elapse before the CMTS grants global reconfiguration time to the CM. Similarly, commanded changes\nto Pr_n may not be implemented immediately upon reception at the CM if the nth channel is bursting. Commanded\nchanges to Pr_n may occur simultaneously with the command to change Pload_min_set. The CMTS SHOULD NOT issue\na change in Pload_min_set after commanding a change in Pr_n until after also providing a sufficient reconfiguration time\non the nth channel. The CMTS SHOULD NOT issue a change in Pload_min_set after commanding a prior change in\nPload_min_set until after also providing a global reconfiguration time for the first command. Also, the CMTS SHOULD\nNOT issue a change in Pr_n a) until after providing a global reconfiguration time following a command for a new\nvalue of Pload_min_set and b) until after providing a sufficient reconfiguration time on the nth channel after issuing a\nprevious change in Pr_n. In other words, the CMTS is to avoid sending consecutive changes in Pr_n and/or Pload_min_set\nto the CM without a sufficient reconfiguration time for instituting the first command. When a concurrent new value\nof Pload_min_set and change in Pr_n are commanded, the CM MAY wait to apply the change in Pr_n at the next global\nreconfiguration time (i.e., concurrent with the institution of the new value of Pload_min_set) rather than applying the\nchange at the first sufficient reconfiguration time of the nth channel. The value of Pload_min_set which applies to the\nnew Pr_n is the concurrently commanded Pload_min_set value, and thus if the change to Pr_n falls outside the Dynamic\nRange Window of the old Pload_min_set, then the CM MUST wait for the global reconfiguration time to apply the\nchange in Pr_n. 22\nThe CM MUST ignore the command to increase the per channel transmit power if such a command would cause\nPload n for that channel to drop below Pload_min_set. Note that the CMTS can allow small changes of power in the CM's\nhighest loaded channel, without these fluctuations impacting the transmit power dynamic range with each such small\nchange. This is accomplished by setting Pload_min_set to a smaller value than normal, and fluctuation of the power per\nchannel in the highest loaded channel is expected to wander. The CM also MUST ignore any commanded change of\nper channel transmit power which would result in Pr n falling below the Dynamic Range Window, i.e., lower power\nthan permitted by the Dynamic Range Window, which is determined by Pload_min_set. The CM also MUST ignore a\ncommand changing Pload_min_set such that existing values of Pr n would fall outside the new Dynamic Range\nWindow. 23\nThe following two paragraphs define the CM and CMTS behavior in cases where there are Dynamic Range Window\nviolations due to indirect changes to Phi_n, or addition of a new channel with incompatible parameters without direct\nchange of Pr_n or Pload_min_set.\n\n\n\n19\n   Added equation per PHYv3.0-N-06.0340-1 by GO on 1/11/07.\n20\n   Revised this sentence and following equation per PHYv3.0-N-06.0340-1 by GO on 1/11/07.\n21\n   Revised this sentence per PHYv3.0-N-06.0340-1 by GO on 1/11/07.\n22\n   Revised this paragraph and one Requirement per PHYv3.0-N-06.0341-1 by GO on 1/12/07.\n23\n   Revised this paragraph per PHYv3.0-N-06.0340-1 by GO on 1/11/07.\n\n\n                                                                    \n12/07/17                                              CableLabs                                                      73\n\fCM-SP-PHYv3.0-C01-171207                                            Data-Over-Cable Service Interface Specifications\n\n\nA change in the number of active channels changes Phi_n of the existing active channels (due to different Phi_n\ncalculation tables for different number of active channels). Prior to changing the number of active channels, the\nCMTS SHOULD change Pr_n of all current active channels, if necessary, to fit in the new expected Dynamic Range\nWindow. If the change in the number of active channels would cause a violation of the Dynamic Range Window of\none of the existing active channels, the CM will ignore the change (i.e., not adding/removing an active channel). In\nsuch case, the CM will also indicate partial service message in the REG-ACK or DBC response [MULPI3.0].\nWhen adding a new active channel to the transmit channel set, the new channel's power is calculated according to\nthe offset value defined in TLV 46.8.4 [MULPI3.0], if it is provided. The CMTS SHOULD NOT set an offset value\nthat will result in a Pr_n for the new channel outside the Dynamic Range Window. In the absence of the TLV, the\nnew channel’s power is initially set by the CM at the minimum allowable power, i.e., the bottom of the Dynamic\nRange Window.\nIf one of the new active channels added by the change in the number of active channels violates the Dynamic Range\nWindow, the CM will ignore the change (i.e., not adding/removing an active channel). In such case, the CM will\nalso indicate partial service message in the REG-ACK or DBC response [MULPI3.0].\nFor a UCD change, Phi_n may change due to a change in the modulation types. Additionally a UCD change that\nmodifies the Symbol Rate may result in a change in Plow_n. The CMTS MUST NOT send a UCD change for the nth\nactive channel that violates Phi_n – Pload_min_set ≥ Plow_n. If a UCD changes the Phi_n for the nth active channel\n[MULPI3.0], the CM sets Pr_n = Phi_n - Pload_n for that channel, when the change count of the MAP matches the\nchange count in the new UCD. The new (changed) Phi_n and the current Pload_n are used in the calculation. The CM\nmaintains Pload_n at its value at the time the MAP change count matches the new UCD change count, and calculates a\nnew Pr_n and target power for the channel, to be applied for bursts granted in the MAP with change count matching\nthe change count in the new UCD. The change in the transmit power Pr_n due to the recalculation with the new Phi_n\nis not considered a change in the “commanded” transmit power, for example as in Section 6.2.19, Section, 6.2.20,\nand Section 6.2.22, and thus this change is required to be transparent on all active channels continuously bursting\nthroughout such a change. The CM is expected to meet all requirements without need of global reconfiguration time,\neven with the induced change in Pr_n, unless, of course, other parameters are changed which do imply the CM should\nbe provided a global reconfiguration time.\nThe spurious performance requirements of Sections 6.2.22.1, 6.2.22.1.1, and 6.2.22.1.2 apply when the CM is\noperating within certain ranges of values for Pload_n, for n = 1 to the active number of upstream channels, and for\ncertain ranges of the number of spreading codes being transmitted as a fraction of the total number of active codes\non a channel for S-CDMA channels, as detailed in those sections. 24\nTransmit power per channel, for each channel, as reported by the CM in the MIB, is referenced to the 64-QAM\nconstellation. When transmitting with other constellations, a slightly different transmit power will result, depending\non the constellation gain in Table 6–7, Table 6–8, and Table 6–9 below. As an example, if the reported power in a\nchannel is 30 dBmV, 64-QAM will be transmitted with a target power of 30 dBmV in that channel, while QPSK\nwill be transmitted with 28.82 dBmV in that channel.\n                         Table 6–7 - Constellation Gains and Per Channel Power Limits with\n                                      One Channel in the Transmit Channel Set\n                    Constellation                                                                   Pmax -\n                                             Pmin\n                     Gain Gconst                             Pmax           Pmax                    Gconst   Pmax - Gconst\n                                           (dBmV)\n                     Relative to                           (dBmV)         (dBmV)   Pmin - Gconst   (dBmV)     (dBmV)\nConstellation       64-QAM (dB)       L      M    H         TDMA          S-CDMA    (dBmV)          TDMA      S-CDMA\n       QPSK              -1.18        17     20     23        61            56        18.18         62.18       57.18\n       8-QAM             -0.21        17     20     23        58            56        17.21         58.21       56.21\n       16-QAM            -0.21        17     20     23        58            56        17.21         58.21       56.21\n       32-QAM             0.00        17     20     23        57            56        17.00         57.00       56.00\n       64-QAM             0.00        17     20     23        57            56        17.00         57.00       56.00\n      128-QAM             0.05        17     20     23       N/A            56        16.95          N/A        55.95\n\n(Pmin is a function of Modulation Rate, with L = 1280 kHz, M = 2560 kHz, and H = 5120 kHz.)\n\n24\n     Paragraph modified per PHYv3.0-N-07.0599-1 on 1/25/08 by KN.\n\n\n                                                                      \n74                                                       CableLabs                                             12/07/17\n\fPhysical Layer Specification                                                          CM-SP-PHYv3.0-C01-171207\n\n\n\n\n                       Table 6–8 - Constellation Gains and Per Channel Power Limits with\n                                   Two Channels in the Transmit Channel Set\n                  Constellation                                                                    Pmax -\n                                            Pmin\n                   Gain Gconst                              Pmax          Pmax                     Gconst   Pmax - Gconst\n                                          (dBmV)\n                   Relative to                            (dBmV)        (dBmV)    Pmin - Gconst   (dBmV)     (dBmV)\nConstellation     64-QAM (dB)        L      M    H         TDMA         S-CDMA     (dBmV)          TDMA      S-CDMA\n     QPSK              -1.18        17     20     23         58           53          18.18        59.18       54.18\n     8-QAM             -0.21        17     20     23         55           53          17.21        55.21       53.21\n    16-QAM             -0.21        17     20     23         55           53          17.21        55.21       53.21\n    32-QAM              0.00        17     20     23         54           53          17.00        54.00       53.00\n    64-QAM              0.00        17     20     23         54           53          17.00        54.00       53.00\n    128-QAM             0.05        17     20     23        N/A           53          16.95         N/A        52.95\n\n(Pmin is a function of Modulation Rate, with L = 1280 kHz, M = 2560 kHz, and H = 5120 kHz.)\n\n\n                       Table 6–9 - Constellation Gains and Per Channel Power Limits with\n                              Three or Four Channels in the Transmit Channel Set\n                   Constellation                                                                   Pmax -      Pmax -\n                                          Pmin\n                    Gain Gconst                              Pmax         Pmax        Pmin -       Gconst      Gconst\n                                        (dBmV)\n                    Relative to                            (dBmV)       (dBmV)        Gconst      (dBmV)      (dBmV)\n Constellation     64-QAM (dB)        L    M   H            TDMA        S-CDMA       (dBmV)        TDMA       S-CDMA\n     QPSK               -1.18        17     20     23        55           53          18.18        56.18       54.18\n     8-QAM              -0.21        17     20     23        52           53          17.21        52.21       53.21\n    16-QAM              -0.21        17     20     23        52           53          17.21        52.21       53.21\n    32-QAM              0.00         17     20     23        51           53          17.00        51.00       53.00\n    64-QAM              0.00         17     20     23        51           53          17.00        51.00       53.00\n    128-QAM             0.05         17     20     23       N/A           53          16.95         N/A        52.95\n\n(Pmin is a function of Modulation Rate, with L = 1280 kHz, M = 2560 kHz, and H = 5120 kHz.)\n\n\nThe actual transmitted power per channel, within a burst, MUST be constant to within 0.1 dB peak to peak, even in\nthe presence of power changes on other active channels. This excludes the amplitude variation, which is\ntheoretically present due to QAM amplitude modulation, pulse shaping, pre-equalization, and for S-CDMA,\nspreading and varying number of allocated codes.\nThe CM MUST support the transmit power calculations defined in Section 6.2.19.1 and Section 6.2.19.2.\n6.2.19.1 TDMA Transmit Power Calculations\nIn TDMA mode, the CM determines its target transmit power per channel Pt as follows, for each channel that is\nactive. Define for each active channel, for example, upstream channel X:\n     Pr = Reported power level (dBmV) of CM in MIB (refers to 64-QAM constellation) for channel X.\n     ∆P = Power level adjustment (dB), for example, as commanded in ranging response message.\n     Gconst = Constellation gain (dB) relative to 64-QAM constellation (see above table).\n     Pmin = Minimum target transmit power per channel permitted for the CM per Section 6.2.19 (see above table).\n     Pmax = Maximum target transmit power permitted for the CM per Section 6.2.19 (see above table).\n     Phi = min(Pmax - Gconst) over all burst profiles used by the CM in channel X (see above table).\n     Plow = max(Pmin - Gconst) over all burst profiles used by the CM in channel X (see above table).\n\n\n\n\n                                                                    \n12/07/17                                                CableLabs                                                      75\n\fCM-SP-PHYv3.0-C01-171207                                           Data-Over-Cable Service Interface Specifications\n\n\n     Pt = Target transmit power per channel level (dBmV) of CM in channel X (actual transmitted power per channel\n     in channel X as estimated by CM).\nIn the event of a UCD which changes the Phi for an active channel [MULPI3.0], the CM sets Pr = Phi - Pload for that\nchannel when the MAP change count matches the change count in the new UCD, where the new (changed) Phi for\nthe channel and the current Pload for the channel are used in the calculation. 25\nThe CM updates its reported power per channel in each channel by the following steps:\n1.   Pr = Pr + ∆P    //Add power level adjustment (for each channel) to reported power level for each channel.\n2.   Pr = min[Pr, Phi]    //Clip at max power limit per channel.\n3.   Pr = max[Pr, Plow]    //Clip at min power limit per channel.\n4.   Test, IF[Pr < Plow_multi], ignore command and restore previous Pr     //Power per channel from this command\n     would violate the set Dynamic Range Window.\n5.   Test, IF[Pr > Phi - Pload_min_set], ignore command and restore previous Pr   //Power per channel from this\n     command would violate the set Dynamic Range Window. 26\nThe CM then transmits, in channel X with target power per channel Pt = Pr + Gconst, i.e., the reported power, plus the\nconstellation gain.\nUsually the reported power level is a relatively constant quantity, while the transmitted power level in channel X\nvaries dynamically as different burst profiles, with different constellation gains, are transmitted. A CM's target\ntransmit power per channel MUST never be below Pmin or above Pmax. This implies that in some cases, the extreme\ntransmit power levels (e.g., 61 dBmV for QPSK and 17 dBmV) may not be permitted if burst profiles with multiple\nconstellations are active. Also, if only QPSK is used, the reported power per channel may be greater than 61 dBmV,\nalthough the target transmit power per channel will not exceed 61 dBmV.\nFor example, if in channel X, only QPSK and 64-QAM burst profiles are active, Phi = 54 dBmV and Plow = 18.2\ndBmV for 1280 kHz modulation rate. Plow is dependent on modulation rate. The maximum permitted QPSK\ntransmitted power in channel X is 54 dBmV - 1.2 dB= 52.8 dBmV, the minimum QPSK power in channel X is 18.2\ndBmV - 1.2 dB= 17 dBmV (with 1280 kHz modulation rate), the maximum 64-QAM power in channel X is 54\ndBmV, and the minimum 64-QAM power in channel X is 18.2 dBmV (with 1280 kHz modulation rate).\n6.2.19.2 S-CDMA Transmit Power Calculations\nIn S-CDMA mode, the power calculations depend on whether the Maximum Scheduled Codes feature is enabled.\n6.2.19.2.1 S-CDMA Transmit Power Calculations when Maximum Scheduled Codes Is Not Enabled\nIn S-CDMA mode when Maximum Scheduled Codes is not enabled, the CM determines its target transmit power\nper channel Pt, as follows, for each channel which is active. Define for each active channel, for example, upstream\nchannel X:\n     Pr = reported power level (dBmV) of CM in MIB (refers to 64-QAM constellation and all active codes\n     transmitted) for channel X.\n     Phi = min[Pmax - Gconst] over all burst profiles used by the CM in channel X (see Table 6–7, Table 6–8, and Table\n     6–9).\n     Plow = max[Pmin - Gconst] + 10 log (number_active_codes / number_of_codes_per_mini-slot) where the\n     maximum is over all burst profiles used by the CM in channel X (see Table 6–7, Table 6–8, and Table 6–9).\nIn the event of a UCD which changes the Phi for an active channel [MULPI3.0], the CM sets Pr = Phi - Pload for that\nchannel when the MAP change count matches the change count in the new UCD, where the new (changed) Phi for\nthe channel and the current Pload for the channel are used in the calculation. 27\n\n\n\n25\n   Paragraph added per PHYv3.0-N-08.0611-3 on 4/10/08 by KN.\n26\n   Step modified per PHYv3.0-N-07-0465-1, #1 on 7/2/07 and PHYv3.0-N-07.0599-1 on 1/25/08 by KN.\n27\n   Paragraph added per PHYv3.0-N-08.0611-3 on 4/10/08 by KN.\n\n\n                                                                     \n76                                                    CableLabs                                              12/07/17\n\fPhysical Layer Specification                                                             CM-SP-PHYv3.0-C01-171207\n\n\nThe CM updates its reported power per channel in each channel by the following steps: 28\n1.     Pr = Pr + ΔP       //Add power level adjustment (for each channel) to reported power level for each channel.\n2.     Pr = min[Pr, Ph]      //Clip at max power limit per channel.\n3.     Pr = max[Pr, Plow]      //Clip at min power limit per channel.\n4.     Test, IF[Pr < Plow_multi], ignore command and restore previous Pr     //Power per channel from this command\n       would violate the set Dynamic Range Window.\n5.     Test, IF[Pr > Phi-Pload_min_set], ignore command and restore previous Pr   //Power per channel from this\n       command would violate the set Dynamic Range Window.\nIn a spreader-on frame, the CM then transmits each code i with target power:\n\n                                   Pt,i = Pr + Gconst,i - 10 log(number_active_codes)\ni.e., the reported power for channel X, plus the constellation gain Gconst,i of that code, less a factor taking into\naccount the number of active codes. The total transmit power in channel X, Pt, in a frame is the sum of the\nindividual transmit powers Pt,i of each code in channel X, where the sum is performed using absolute power\nquantities [non-dB domain].\nIn a spreader-off frame, the CM target transmit power in channel X is Pt = Pr + Gconst.\nThe transmitted power level in channel X varies dynamically as the number of allocated codes varies, and as\ndifferent burst profiles, with different constellation gains, are transmitted. A CM's target transmit power per channel\nMUST never be below Pmin or above Pmax, including overall numbers of allocated codes and all burst profiles. This\nimplies that in some cases the extreme transmit power levels per channel (e.g., 17 and 56 dBmV) may not be\npermitted. Also, if only QPSK is used, the reported power in a channel may be greater than 56 dBmV, although the\ntarget transmit power per channel will not exceed 56 dBmV.\nIf, for example, the Transmit Channel Set contains only one channel, and this channel, channel X, has QPSK and\n64-QAM burst profiles, the number of active codes is 128 and the number of codes per mini-slot is 2, then Phi = 56\ndBmV and Plow = 36.24 dBmV for 1280 kHz modulation rate. Plow is dependent on modulation rate. The maximum\npermitted QPSK transmitted power in channel X is 56 – 1.18 = 54.82 dBmV when all active codes are transmitted.\nThe minimum QPSK power in channel X is 36.24 dBmV – 1.18 dB – 10log(128) dB + 10log(2) dB = 17 dBmV\n(with 1280 kHz modulation rate) when one mini-slot is transmitted. The last term in the sum is the result of\nsumming the individual powers over two codes. Similarly, the maximum 64-QAM power in channel X is 56 dBmV,\nwhen all active codes are transmitted and the minimum 64-QAM power in channel X is 36.24 dBmV – 10log(128)\ndB + 10log(2) dB = 18.18 dBmV (with 1280 kHz modulation rate) when one mini-slot is transmitted. The minimum\nQPSK power permitted in channel X while transmitting, for example, 2 mini-slots is 20 dBmV (with 1280 kHz\nmodulation rate), and the minimum 64-QAM power permitted in channel X, while transmitting 2 mini-slots, is 21.2\ndBmV (with 1280 kHz modulation rate).\nThe CM needs to implement some form of clipping on the transmitted waveform at the higher output powers in\norder to prevent peak to average ratio (PAR) issues.\nThe power received at the CMTS in a spreader-on frame will sometimes be less than the nominal power of a\nspreader-off frame because of such factors as: 1) broadcast opportunities not used by any CM; 2) unicast grants not\nused by one or more CMs; or 3) mini-slots assigned to the NULL SID.\n6.2.19.2.2 S-CDMA Transmit Power Calculations When Maximum Scheduled Codes is Enabled\nIn S-CDMA mode on channels on which Maximum Scheduled Codes is enabled, the CM determines its target\ntransmit power per channel Pt as follows, for each channel which is active. Define for each upstream channel, for\nexample, upstream channel X:\n       Pr = reported power level (dBmV) of CM in MIB (operational transmit power of the spreader-off ranging burst\n       referenced to 64-QAM modulation) for channel X.\n\n\n28\n     Revised step 4 and 5 per PHYv3.0-N-06.0340-1 by GO on 1/11/07.\n\n\n                                                                        \n12/07/17                                                 CableLabs                                                     77\n\fCM-SP-PHYv3.0-C01-171207                                              Data-Over-Cable Service Interface Specifications\n\n\n       Phi_S = min[Pmax - Gconst] over all spreader-on burst profiles used by the CM in channel X (see Table 6–7, Table\n       6–8, and Table 6–9).\n       Plow_S = max[17 - Gconst] + 10 log(number_active_codes / number_of_codes_per_mini-slot) where the maximum\n       is over all burst profiles used by the CM in channel X (see Table 6–7, Table 6–8, and Table 6–9).\n       Pmax_T = Maximum target transmit power permitted for the CM in channel X in TDMA mode (see Table 6–7,\n       Table 6–8, and Table 6–9) for the constellation used in ranging.\n       Phi_T = min[Pmax_T - Gconst] over all spreader-off burst profiles used by the CM in channel X (see Table 6–7,\n       Table 6–8, and Table 6–9).\n       Pon = Pr clipped at the maximum spreader-on limit.\n       Psf = CM Power Shortfall.\n       Phr = S-CDMA Power Headroom in dB. Equivalent to the value of the Ranging Response Message TLV-11\n       divided by 4.\n       ∆P = power level adjustment in dB sent from CMTS to CM for channel X.\nIn the event of a UCD which changes the Phi for an active channel [MULPI3.0], the CM sets Pr = Phi - Pload for that\nchannel when the MAP change count matches the change count in the new UCD, where the new (changed) Phi for\nthe channel and the current Pload for the channel are used in the calculation. 29\nThe CM updates its power per channel in each channel by the following steps:\n1.     Pr = Pr + ∆P //Add power level adjustment (for each channel) to reported power level for each channel.\n2.     Pr = min[Pr, Phi_T] //Clip at max TDMA power limit per channel.\n3.     Pr = max[Pr, Plow_S] //Clip at min S-CDMA power limit per channel.\n4.     Test, IF[Pr < Plow_multi], ignore command and restore previous Pr        //Power per channel from this command\n       would violate the set Dynamic Range Window.\n5.     Test, IF[Pr > Phi_T -Pload_min_set], ignore command and restore previous Pr       //Power per channel from this\n       command would violate the set Dynamic Range Window.\n6.     Pon = min[Pr, Phi_S-Pload_min_set] //Clip at max S-CDMA power limit per channel for the multiple channel dynamic\n       range limitation, as set by Pload_min_set.\nIn spreader-off frames, the CM transmits in channel off with target power:\n       Pt = Pr + Gconst\nBased on the spreader-off transmit power in channel X, the CM updates its power shortfall in channel X according\nto the following steps:\nwith only one channel in the Transmit Channel Set:\n       Psf = Pt - (56 - Pload_min_set) // Difference between spreader-off and max spreader-on target powers in channel X;\n       Psf = max[Psf 0] // Set Psf to 0 if Pt is less than 56 dBmV - Pload_min_set in channel X;\nand with more than one channel in the Transmit Channel Set:\n       Psf = Pt - (53 - Pload_min_set) // Difference between spreader-off and max spreader-on target powers in channel X;\n       Psf = max[Psf, 0] // Set Psf to 0 if Pt is less than 53 dBmV - Pload_min_set in channel X.\nIn spreader-on frames, the CM transmits each code i with target power:\n       Pt, i = Pon + Gconst, i - 10 log(number_active_codes) + Phr\ni.e., the clipped reported power in channel X plus the constellation gain Gconst, i of that code, less a factor taking into\naccount the number of active codes, plus the Power Headroom Phr. Phr is the power (in dB) added to account for\n\n29\n     Paragraph added per PHYv3.0-N-08.0611-3 on 4/10/08 by KN.\n\n\n                                                                         \n78                                                         CableLabs                                               12/07/17\n\fPhysical Layer Specification                                                          CM-SP-PHYv3.0-C01-171207\n\n\nCMs that have maximum scheduled code limits and can transmit additional power per code. The total transmit\npower in channel X, Pt, in a frame is the sum of the individual transmit powers Pt, i of each code in channel X, where\nthe sum is performed over all Nalloc allocated codes using absolute power quantities (non-dB domain).\n\n\n\n\nIf, for example, with more than one channel in the Transmit Channel Set, and the burst profile in channel X contains\nQPSK for IUCs 1, 2, 3, and 4 and 64-QAM for IUCs 9 and 10, the number of active codes is 128, and the number of\ncodes per mini-slot is 2, then Phi_S = 53 dBmV, Plow_s = 36.24 dBmV, and Phi_T = 58 dBmV. Assume Pload_min_set = 0\ndB. Assume the CM ranges channel X at spreader-off target transmit power of 57 dBmV. The CM reports for\nchannel X Psf = 57 dBmV - 53 dBmV = 4 dB. The CMTS uses Psf to set for channel X (using its vendor-specific\nalgorithm) max_scheduled_codes = 32 and Phr = 6 dB. (The S-CDMA power headroom may differ from the power\nshortfall, at the discretion of the CMTS.) The CM sets its transmitted power per code in channel X to: 30\n       Pt, i = Pon + Gconst, i - 10 log (number_active_codes) + Phr\n       = 53 dBmV + 0 dB - 21 dB + 6 dB                 // For a code with 64-QAM modulation in channel X\n       = 38 dBmV\nA parameter that may be used to illustrate the effect of increased power per code in channel X is the Effective\nTransmit Power, Peff, the power that would result in channel X hypothetically if all Na active codes were transmitted.\nIt is computed as:\n\n\n\n\nwhere the last term is the average constellation gain.\nFor a reference case with all codes transmitted in channel X using 64-QAM modulation (Gconst = 0 dB), the effective\ntransmit power reduces to:\n\n                                                     Peff = Pon + Phr\nContinuing the above example, the result is:\n\n                                                Peff = 53 dBmV + 6 dB\n                                                       = 59 dBmV\nLimiting the number of codes has given the CM an enhanced effective power of 59 dBmV, which is 6 dB above the\nnormal maximum power per channel of 53 dBmV, and 2 dB above the ranging power of 57 dBmV. In this example,\nthe CMTS used its discretion to ask for 2 dB more enhancement in channel X than was needed (Phr = 6 dB vs Psf = 4\ndB), perhaps due to some known impairment in the channel.\nThe effective_SNR is an SNR estimate for a given code corresponding to the effective transmit power in channel X.\nIt is defined as the measured SNR at the last station maintenance, minus the CM power shortfall, plus the power\nheadroom, plus the difference in constellation gain between the ranging burst and the code under consideration. Its\nequation is:\n\n                     effective_SNR = measured_SNR - Psf + Phr + (Gconst, i - Gconst, ranging)\nwhere Gconst, ranging is the constellation gain of the ranging burst in channel X that resulted in the SNR\nmeasurement.\n\n\n30\n     Revised this paragraph per PHYv3.0-N-06.0340-1 by GO on 1/12/07.\n\n\n                                                                        \n12/07/17                                                 CableLabs                                                 79\n\fCM-SP-PHYv3.0-C01-171207                                          Data-Over-Cable Service Interface Specifications\n\n\nIn the MIB, effective_SNR corresponds to a reference case with 64-QAM modulation (Gconst, i = 0 dB):\n\n                            effective_SNR = measured_SNR - Psf + Phr - Gconst, ranging\nContinuing the example, if the measured SNR in channel X in the last station maintenance was 17 dB, using QPSK\nmodulation (Gconst, ranging = -1.2 dB), then the effective SNR referenced to 64-QAM modulation is:\n\n                            effective_SNR = 17dB - 4dB + 6dB + 1.2 dB = 20.2 dB\n6.2.19.3 Transmit Power Step Size\nThe step resolution in transmit power for each channel MUST be 0.5 dB or less. The step size accuracy MUST be\nwithin ±0.4 dB. For example, the actual power increase in a channel X resulting from a command to increase the\npower level by 1 dB in a CM's next transmitted burst in channel X MUST be between 0.6 dB and 1.4 dB.\nAll active channels with no power change commanded MUST NOT change by more than 0.1 dB during a burst even\nwith a power change command to any subset of the other active channels.\nAfter a change in the Dynamic Range Window (i.e., Pload_min_set), the transmit power MUST NOT change by more\nthan 0.4 dB in any of the active channels when they resume transmission (referenced against any commanded\nchange in their transmit power).\nA relaxation in step size accuracy to 1.4 dB is allowed for one gain change (and one setting of Dynamic Range\nWindow) for each 12 dB, when changing the power control range in either direction (from low-end to high-end\npower and vice versa). The locations of these gain changes (increasing and decreasing to provide hysteresis), MUST\nbe at least 2 dB apart, thus enabling the use of large step attenuators in the coverage of the full power control range.\n                                                                                                             31\n6.2.19.4 Transmit Power Requirements for Multiple Transmit Channel mode Not Enabled\nWith Multiple Transmit Channel mode disabled, the CM MUST operate as in [DOCSIS RFI 2.0], with the following\nexceptions.\n•      The minimum upstream power Pmin used by the CM MUST be as given in Table 6–10 below, superseding the\n       minimum upstream power requirements in [DOCSIS RFI 2.0].\n•      The CM MUST replace the value of 53 in the equation for Phi_S in [DOCSIS RFI 2.0] with 56 since this value\n       is actually intended to be Pmax from Table 6–7 above.\n•      Maximum upstream power prior to registration:\n       •    If the Extended Upstream Transmit Power Support TLV in the MDD is OFF, the CM MUST use a\n            maximum upstream power Pmax as given in Table 6–7 above, superseding the maximum upstream power\n            requirements in [DOCSIS RFI 2.0].\n       •    If the Extended Upstream Transmit Power Support TLV in the MDD is ON, the CM MAY exceed the\n            maximum upstream power Pmax as given in Table 6–7 above. When the Extended Upstream Transmit\n            Power Support TLV in the MDD is ON and the CM has not successfully ranged at a power at or below\n            Pmax, the CM MUST continue to range at power levels above the Pmax listed in Table 6–7 by an amount that\n            is vendor-specific, meeting operator requirements. However, the CM MUST NOT exceed a target transmit\n            power level of 61 dBmV. Note that all fidelity requirements specified in Section 6.2.22 still apply when the\n            CM is operating over an extended transmit power range.\n•      Maximum upstream power after registration:\n       •    The CM MUST use a maximum ups
