                                                     CM-SP-PHYv3.1-I17-190917\n\n\nThe spurious performance requirements do not apply to any upstream channel from the time the output power on\nany active upstream channel has varied by more than ±3 dB since the last global reconfiguration time through the\nend of the next global reconfiguration time changes, excluding transmit power changes due to UCD-induced\nchange in P1.6hi [DOCSIS MULPIv3.1].\nIn Table 11, inband spurious emissions includes noise, carrier leakage, clock lines, synthesizer spurious products,\nand other undesired transmitter products. It does not include ISI. The measurement bandwidth for inband spurious\nfor OFDM is equal to the Subcarrier Clock Frequency (25 kHz or 50 kHz) and is not a synchronous measurement.\nThe signal reference power for OFDMA inband spurious emissions is the total transmit power measured and\nadjusted (if applicable) as described in Section 7.4.12.5, and then apportioned to a single data subcarrier.\nFor S-CDMA and TDMA, the measurement bandwidth is the modulation rate (e.g., 1280 to 5120 kHz), and the\nrequirement is ≤ -50 dBc. All requirements expressed in dBc are relative to the largest equivalent DOCSIS channel\npower in the TCS, which is the largest P1.6r_n over all the channels in the TCS and is at the top of the DRW, whether\nthat channel is being transmitted or not.\nThe measurement bandwidth is 160 kHz for the Between Bursts (none of the channels in the TCS is bursting) specs\nof Table 11, except where called out as 4 MHz or 250 kHz. The signal reference power for Between Bursts\ntransmissions is the total transmit power measured and adjusted (if applicable) as described in Section 7.4.12.5.\nThe Transmitting Burst specs apply during the minislots granted to the CM (when the CM uses all or a portion of\nthe grant), and for 20 µs before and after the granted minislot for OFDMA. The Between Bursts specs apply except\nduring a used grant of minislots on any active channel for the CM, and 20 us before and after the used grant for\nOFDMA. The signal reference power for Transmitting Burst transmissions, other than inband, is the total transmit\npower measured and adjusted (if applicable) as described in Section 7.4.12.5.\nFor the purpose of spurious emissions definitions, a granted burst refers to a burst of minislots to be transmitted at\nthe same time from the same CM; these minislots are not necessarily contiguous in frequency.\nFor Initial Ranging and before completion of Fine Ranging, spurious emissions requirements use Table 11, Table\n12 , and Table 13; and with 100% Grant Spectrum equal to the bandwidth of the modulation spectrum of the\ntransmission, and if transmissions use subcarrier power which is X dB lower than indicated by P1.6low, then the\nspurious emissions requirements in absolute terms are relaxed by X dB.\nSpurious emissions requirements for grants of 10% or less of the TCS (100% grant spectrum) may be relaxed by 2\ndB in an amount of spectrum equal to:\n•   measurement BW * ceil(10% of the TCS / measurement BW)\n•   anywhere in the whole upstream spectrum for emission requirements specified in Table 12 for Table 13\nA 2 dB relief applies in the measurement bandwidth. This relief does not apply to between bursts emission\nrequirements.\n                                            Table 11 - Spurious Emissions\n\n                Parameter                         Transmitting Burst                      Between Bursts3\n\nInband                                        -45 dBc OFDMA 100% grant4,5,6     -72 dBc\n\n                                              -51 dBc OFDMA 5% grant 4,5,6\n\n                                              -50 dBc S-CDMA/TDMA\n                                              (NOTE: also see MER\n                                              requirement)\nAdjacent Band                                 See Table 13                      -72 dBc\nWithin the upstream operating range 5-42      See ge is 5-65 MHz:\nCM Discrete Spurious Emissions Limits1\n65 to 87.5 MHz                                    -50 dBc                               -36 dBmV\n87.5 to 116 MHz                                   -50 dBmV                              -50 dBmV\n116 to 1218 MHz                                   -50 dBmV                              -50 dBmV\nFor the case where the upstream operating\nrange is 5-85 MHz:\nCM Integrated Spurious Emissions Limits (all\nin 4 MHz, includes discrete spurs)1\n85 to 108 MHz                                     -45 dBc                               -31 dBmV\n85 to 108 MHz (Should)                            -50 dBc                               -36 dBmV\n108 to 136 MHz                                    -40 dBmV                              -40 dBmV\n136 to 1218 MHz                                   -45 dBmV                              max(-45 dBmV, -40 dB ref downstream) 2\nFor the case where the upstream operating\nrange is 5-85 MHz:\nCM Discrete Spurious Emissions Limits1\n85 to 108 MHz                                     -50 dBc                               -36 dBmV\n108 to 1218                                       -50 dBmV                              -50 dBmV\nFor the case where the upstream operating\nrange is 5-204 MHz:\nCM Integrated Spurious Emissions Limits (all\nin 4 MHz, includes discrete spurs)1\n204 to 258 MHz                                    -50 dBc                               -36 dBmV\n204 to 258 MHz (Should)                           -60 dBc                               -41 dBmV\n258 to 1218 MHz                                   -45 dBmV                              max(-45 dBmV, -40 dB ref downstream)2\nFor the case where the upstream operating\nrange is 5-204 MHz:\nCM Discrete Spurious Emissions Limits1\n204 to 258 MHz                                    -50 dBc                               -36 dBmV\n258 to 1218 MHz                                   -50 dBmV                              -50 dBmV\nTable Notes:\nNote 1 These spec limits exclude a single discrete spur related to the tuned received channel; this single discrete spur is to be no\n  greater than -40 dBmV.\nNote 2 \"dB ref downstream\" is relative to the received downstream signal level. Some spurious outputs are proportional to the\n  receive signal level.\n\n\n\n09/17/19                                                  CableLabs                                                              82\n\fPhysical Layer Specification                                                                CM-SP-PHYv3.1-I17-190917\n\n\n                 Parameter                                  Transmitting Burst                  Between Bursts3\n\nNote 3 Relative to a 400 kHz transmission of an OFDMA channel with P1.6r_n at the top of the DRW.\nNote 4 Up to 5 subcarriers within the entire upstream bandwidth with discrete spurs may be excluded from the MER calculation if\n  they fall within transmitted minislots. These 5 spurs are the same spurs that may be excluded for spurious emissions and not an\n  additional or different set.\nNote 5 This value is to be met when P1.6load = P1.6load_min_set.\nNote 6 Receive equalization is allowed if an MER test approach is used, to take ISI out of the measurement; measurements other\n  than MER-based to find spurs or other unwanted power may be applied to this requirement.\n\n7.4.12.5.1.1 Spurious Emissions in the Upstream Frequency Range\nTable 12 lists the required spurious level in a measurement interval. The initial measurement interval at which to\nstart measuring the spurious emissions (from the transmitted burst's modulation edge) is 400 kHz from the edge of\nthe transmission's modulation spectrum. Measurements should start at the initial distance and be repeated at\nincreasing distance from the carrier until the upstream band edge or spectrum adjacent to other modulated spectrum\nis reached.\nFor OFDMA transmissions with non-zero transmit windowing, the CM MUST meet the required performance\nmeasured within the 2.0 MHz adjacent to the modulated spectrum using slicer values from a CMTS burst receiver\nor equivalent, synchronized to the downstream transmission provided to the CM.\nIn the rest of the spectrum, the CM MUST meet the required performance measured with a bandpass filter (e.g., an\nunsynchronized measurement).\nFor OFDMA transmissions with zero transmit windowing, CM MUST meet the required performance using\nsynchronized measurements across the complete upstream spectrum.\nFor legacy transmissions, the measurement is performed in the indicated bandwidth and distance from the\ntransmitted legacy channel edge.\nSpurious emissions allocation for far out spurious emissions =\n        Round{ SpurFloor + 10*log10(Measurement bandwidth/Under-grant hold Bandwidth),0.1}.\nFor transmission bursts with modulation spectrum less than the Under-grant Hold Bandwidth, the spurious power\nrequirement is calculated as above, but increased by 10*log10 (Under-grant Hold Bandwidth/Grant Bandwidth).\n Table 12 - Spurious Emissions Requirements in the Upstream Frequency Range for Grants of Under-grant\n                                      Hold Bandwidth and Larger\n\n100% Grant         SpurFloor (dBc)             Under-grant         Under-grant Hold   Measurement        Specification in the\n Spectrum                                      Hold #Users         Bandwidth (MHz)     Bandwidth           Interval (dBc)\n   (MHz)                                                                                 (MHz)2\nUp to 64           -60.0                      40                   100% Grant         1.6                Round{ SpurFloor +\n                                                                   Spectrum/40                           10*log10( Measurement\n                                                                                                         Bandwidth/Under-grant\n ),0.1}\n\n\n[e.g.,142        [-58.3]                [27]                [5.3]                                   [-55.7]\nMHz]\n[e.g., 190       [-57.0]                [20]                [9.5]                                   [-57.0]\nMHz]\nGreater than     max{ -57 +             Floor{ 0.2 + 10^(   100% Grant            12.8              Round{ SpurFloor +\n192              10*log10(100%          (-44 -              Spectrum)/(Under-                       10*log10 (Measurement\n                 Grant Spectrum/192     SpurFloor)/10) }    grant Hold Number                       Bandwidth/Under-grant\n                 MHZ), -60}                                 of Users)                               Hold Bandwidth),0.1}\n[e.g., 200       [-56.8]                [19]                [10.5]                                  [-55.9]\nMHz]\n Note 1 Spurious Emissions Requirements in the Upstream Frequency Range Relative to the Per Channel Transmitted Burst\n   Power Level for Each Channel for Grants of Under-grant Hold Bandwidth and Larger.\n Note 2 The measurement bandwidth is a contiguous sliding measurement window.\n\nThe CM MUST control transmissions such that within the measurement bandwidth of Table 12 - Spurious\nEmissions Requirements in the Upstream Frequency Range for Grants of Under-grant Hold Bandwidth and Larger,\nspurious emissions measured for individual subcarriers contain no more than +3 dB power larger than the required\naverage power of the spurious emissions in the full measurement bandwidth divided by the number of subcarriers\nin the measurement bandwidth. When non synchronous measurements are made, only 25 kHz measurement\nbandwidth is used.\nFor legacy transmissions, and optionally for OFDMA transmissions, bandpass measurements rather than\nsynchronous measurements may be applied.\nAs an example illustrating use of Table 12 for legacy channels, consider a TCS with a single 1.6 MHz SC-QAM\nchannel (1.28 Msym/s) and a single 6.4 MHz SC-QAM channel (5.12 Msym/s). The grant BW is then 8.0 MHz and\nthe 100% grant spectrum is 8.0 MHz. So the spurfloor is -60 dBc, and the emissions specification is -51 dBc or\nequivalently -44 dBr.\nAs an example illustrating the smaller measurement bandwidth requirements, consider 94 MHz 100% grant\nspectrum, with -58.7 dBc spurious emissions allowed in 3.2 MHz measurement bandwidth, with the measurement\nbandwidth starting as close as 400 kHz from the modulation edge of the transmitted burst. If the subcarrier spacing\nis 25 kHz, there are 128 subcarriers in the 3.2 MHz measurement bandwidth. Each subcarrier has, on average, a\nrequirement of -58.7 dBc - 21.1 dB = -79.8 dBc, but the requirement is relaxed to -79.8 dBc + 3 dB = -76.8 dBc\n(noting that -21.07 dB corresponds to 1/128th). The under-grant hold bandwidth is 2.35 MHz for this example.\nWhen a 100% grant has 65 dBmV transmit power, a grant of 2.4 MHz has 49.1 dBmV power. With a single\nOFDMA channel and its 100% grant power at 65 dBmV, the spurious emissions requirement with a grant of 2.4\nMHz, measured in 25 kHz is 49.1 dBmV - 76.8 dBc = -27.7 dBmV. -76.8 dBc corresponds to -57.1 dBr for this\nexample (since 2.35 MHz/25 kHz is a factor of 94, or 19.7 dB).\n\n7.4.12.5.1.2 Adjacent Channel Spurious Emissions\nSpurious emissions from a transmitted burst may occur in adjacent spectrum, which could be occupied by a legacy\ncarrier of any allowed modulation rate or by OFDMA subcarriers.\nTable 13 lists the required adjacent channel spurious emission levels when there is a transmitted burst with\nbandwidth at the Under-grant Hold Bandwidth. The measurement is performed in an adjacent channel interval of\n400 kHz adjacent to the transmitted burst modulation spectrum. For OFDMA transmissions, the measurement is\nperformed starting on an adjacent subcarrier of the transmitted spectrum (both above and below), using the slicer\nvalues from a CMTS burst receiver or equivalent synchronized to the downstream transmission provided to the\n\n\n\n\n09/17/19                                               CableLabs                                                       84\n\fPhysical Layer Specification                                                            CM-SP-PHYv3.1-I17-190917\n\n\nCM. For legacy transmissions, the measurement is performed in an adjacent channel interval of 400 kHz bandwidth\nadjacent to the transmitted legacy channel edge.\nFirstly, it should be noted that the measurement bandwidth for Table 13 is less than the measurement bandwidths in\nTable 12. Thus comparing the two tables in terms of the specification \"dBc\" values requires appropriate scaling.\nSecondly, Table 13 provides specification \"dBc\" only for grants of a specific amount for each row, while Table\n12 provides \"dBc\" specification for grants of all sizes from the Under-grant Hold Bandwidth to 100%.\nFor transmission bursts with modulation spectrum less than the Under-grant Hold Bandwidth, the spurious power\nrequirement is calculated as above, but increased by 10*log10(Under-grant Hold Bandwidth/Grant Bandwidth).\nFor transmission bursts with modulation spectrum greater than the Under-grant Hold Bandwidth, the spurious\npower requirement in the adjacent 400 kHz is calculated by converting the requirement to absolute power \"dBmV\"\nfor a grant of precisely Under-grant Hold Bandwidth from Table 13, and similarly computing the absolute power\n\"dBmV\" from Table 12 for a grant equal to:\nThe Given Grant - The Under-grant Hold Bandwidth.\nThen the absolute power calculated from Table 12 is scaled back in exact proportion of 400 kHz compared to the\nmeasurement bandwidth in Table 12. Then the power from Table 13 is added to the scaled apportioned power from\nTable 12 to produce the requirement for the adjacent 400 kHz measurement with a larger grant than the Under-\ngrant Hold Bandwidth. The requirement for adjacent spurious power in adjacent 400 kHz is:\n  P1(Grant Bandwidth - Under-grant Hold Bandwidth) = absolut MER\" and \"unequalized MER\" refer\nto a measurement with linear distortions equalized or not equalized, respectively, by the test equipment receive\nequalizer. The requirements in this section refer only to unequalized MER, as described for each requirement. MER\nis measured on each modulated data subcarrier and non-boosted pilot (MER is computed based on the unboosted\npilot power) in a minislot of a granted burst and averaged for all the subcarriers in each minislot. MER includes the\neffects of Inter-Carrier Interference (ICI), spurious emissions, phase noise, noise, distortion, and all other undesired\ntransmitter degradations with an exception for a select number of discrete spurs impacting a select number of\nsubcarriers. MER requirements are measured with a calibrated test instrument that synchronizes to the OFDMA\nsignal, applies a receive equalizer in the test instrument that removes MER contributions from nominal channel\nimperfections related to the measurement equipment, and calculates the value. The equalizer in the test instrument\nis calculated, applied and frozen for the CM testing. Receiver equalization of CM linear distortion is not provided;\nhence this is considered to be a measurement of unequalized MER, even though the test equipment contains a fixed\nequalizer setting.\n\n7.4.12.5.3.1 Definitions\nMER is defined as follows for OFDMA. The transmitted RF waveform at the F connector of the CM (after\nappropriate down conversion) is filtered, converted to baseband, sampled, and processed using standard OFDMA\nreceiver methods, with the exception that receiver equalization is not provided. The processed values are used in\nthe following formula. No external noise (AWGN) is added to the signal.\nThe carrier frequency offset, carrier amplitude, carrier phase offset, and timing will be adjusted during each burst to\nmaximize MER as follows:\n•     One carrier amplitude adjustment common for all subcarriers and OFDM symbols in burst.\n\n\n09/17/19                                             CableLabs                                                      86\n\fPhysical Layer Specification                                                                    CM-SP-PHYv3.1-I17-190917\n\n\n•      One carrier frequency offset common for all subcarriers resulting in phase offset ramping across OFDM\n       symbols in bursts.\n•      One timing adjustment resulting in phase ramp across subcarriers.\n•      One carrier phase offset common to all subcarriers per OFDM symbol in addition to the phase ramp.\nMERi is computed as an average of all the subcarriers in a minislot for the ith minislot in the OFDMA grant:\nwhere:\n\n\n\n\n          Eavg is the average constellation energy for equally likely symbols,\n          M is the number of symbols averaged,\n          N is the number of subcarriers in a minislot,\n          e­j,k is the error vector from the jth subcarrier in the minislot and kth received symbol to the ideal transmitted\n          QAM symbol of the appropriate modulation order.\nA sufficient number of OFDMA symbols are to be included in the time average so that the measurement\nuncertainty from the number of symbols is less than other limitations of the test equipment.\nMER with a 100% grant is defined as the condition when all OFDMA non-excluded subcarriers and any legacy\nchannels in the transmit channel set are granted to the CM. For purposes of testing MER, a grant of all OFDMA\nminislots and any legacy channels in the transmit channel set may be used; there may be non-excluded subcarriers\nthat are not within minislots.\nMER with a 5% grant is defined as the condition when less than or equal to 5% of the available OFDMA minislots\nand no legacy channels have been granted to the CM.\n\n7.4.12.5.3.2 Requirements\nUnless otherwise stated, the CM MUST meet or exceed the following MER limits over the full transmit power\nrange, all modulation orders, all grant configurations and over the full upstream frequency range.\nThe following flat channel measurements with no tilt (Table 14) are made after the pre-equalizer coefficients have\nbeen set to their optimum values. The receiver uses best effort synchronization to optimize the MER measurement.\n                                Table 14 - Upstream MER Requirements (with Pre-Equalization)\n\n                 Parameter                                                              Value\n    MER (100% grant)                             Each minislot MER ≥ 44 dB (Notes 1,2, 3)\n    MER (5% grant)                               Each minislot MER ≥ 50 dB (Notes 1,2)\n    Pre-equalizer constraints                    Coefficients set to their optimum values\n    Table Notes:\n    Note 1 Up to 5 subcarriers within the entire upstream bandwidth with discrete spurs may be excluded from the MER calculation\n      if they fall within transmitted minislots. These 5 spurs are the same spurs that may be excluded for spurious emissions and\n      not an additional or different set.\n    Note 2 This value is to be met when P1.6load = P1.6load_min_set.\n    Note 3 For testing 100% grant, a grant of all OFDMA minislots and any legacy channels may be used.\n\nThe following flat channel measurements (Table 15) are made with the pre-equalizer coefficients set to unity and\nno tilt and the receiver implementing best effort synchronization. For this measurement, the receiver may also\napply partial equalization. The partial equalizer is not to correct for the portion of the CM's time-domain impulse\nresponse greater than 200 ns or frequency-domain amplitude response greater than +1 dB or less than -3dB from\nthe average amplitude. An additional 1 dB attenuation in the amplitude response is allowed in the upper 10% of the\n\n\n\n\n09/17/19                                                         CableLabs                                                    87\n\fCM-SP-PHYv3.1-I17-190917                                                Data-Over-Cable Service Interface Specifications\n\n\nspecified passband frequency. It is not expected that the partial equalizer is implemented on CMTS receiver. A\npartial equalizer could be implemented offline via commercial receivers or simulation tools.\n                              Table 15 - Upstream MER Requirements (no Pre-Equalization\n\n               Parameter                                                               Value\n MER (100% grant)                               Each minislot MER ≥ 40 dB (Notes 1,2)\n MER (5% grant)                                 Each minislot MER ≥ 40 dB (Notes 1,2)\n Pre-equalizer constraints                      Pre-equalization not used\n  Table Notes:\n  Note 1 Up to 5 subcarriers within the entire upstream bandwidth with discrete spurs may be excluded from the MER\n    calculation if they fall within transmitted minislots. These 5 spurs are the same spurs that may be excluded for spurious\n    emissions and not an additional or different set.\n  Note 2    This value is to be met when P1.6load = P1.6load_min_set.",73],["7.4.13 Cable Modem Transmitter Output Requirements","7.4.13 Cable Modem Transmitter Output Requirements\nThe CM MUST output an RF Modulated signal with characteristics delineated in Table 16 - CM Transmitter\nOutput Signal Characteristics.\n                                  Table 16- CM Transmitter Output Signal Characteristics\n\n               Parameter                                                               Value\n Frequency                                     Support and be configurable to a permitted subset (see Section 7.2.3 for allowed\n                                               combinations) of the following list of frequency ranges:\n                                               5-42 MHz\n                                               5-65 MHz\n                                               5-85 MHz\n                                               5-117 MHz\n                                               5-204 MHz\n                                               NOT to cause harmful interference above these frequencies for any configured option\n                                               may support > 204 MHz\n Signal Type                                   OFDMA\n Maximum OFDMA Channel                         95 MHz\n Bandwidth\n Minimum OFDMA Occupied                        6.4 MHz for 25 kHz subcarrier spacing\n Bandwidth                                     10 MHz for 50 kHz subcarrier spacing\n Number of Independently                       Minimum of 2\n configurable OFDMA channels\n Subcarrier Channel Spacing                    25 kHz, 50 kHz\n FFT Size                                      50 kHz: 2048 (2K FFT); 1900 Maximum active subcarriers\n                                               25 kHz: 4096 (4K FFT); 3800 Maximum active subcarriers\n Sampling Rate                                 102.4 MHz\n FFT Time Duration                             40 µs (25 kHz subcarriers)\n                                               20 µs (50 kHz subcarriers)\n Modulation Type                               BPSK, QPSK, 8-QAM, 16-QAM, 32-QAM, 64-QAM, 128-QAM, 256-QAM, 512-QAM,\n                                               1024-QAM, 2048-QAM, 4096-QAM\n Bit Loading                                   Variable from minislot to minislot\n                                               Constant for subcarriers of the same type in the minislot\n                                               Support zero valued subcarriers per profile and minislot\n Pilot Tones                                   14 data patterns and 2 subslot patterns, minislot subcarrier size and length dependent\n                                               - see Section 7.4.16.\n Cyclic Prefix Options                         Samples        µsec\n                                               96              0.9375\n                                               128            1.25\n                                               160            1.5625\n                                               192            1.875\n                                               224            2.1875\n\n\n\n09/17/19                                                        CableLabs                                                         88\n\fPhysical Layer Specification                                                            CM-SP-PHYv3.1-I17-190917\n\n\n             Parameter                                                      Value\n                                      256            2.5\n                                      288            2.8125\n                                      320            3.125\n                                      384            3.75\n                                      512            5.0\n                                      640            6.25\n Windowing Size Options               Samples     µsec\n                                      0           0\n                                      32          0.3125\n                                      64          0.625\n                                      96          0.9375\n                                      128         1.25\n                                      160         1.5625\n                                      192         1.875\n                                      224         2.1875\n                                      Raised cosine absorbed by CP\n Level                                Total average output power of 65 dBmV (See item # 1 immediately following this\n                                      table)\n                                      Total average output power greater than 65 dBmV (See item # 2 following this table)\n Output Impedance                     75 ohms\n Output Return Loss                   > 6 dB 5 MHz - fmax (fmax = 42/65/85/204 MHz)\n Connector                            F connector per [ISO/IEC-61169-24] or [SCTE 02]\n\nThe following is an itemized list of CM Transmitter Output Signal Characteristics based on Table 16 above.\n1. The CM MUST be capable of transmitting a total average output power of 65 dBmV.\n2. The CM MAY be capable of transmitting a total average output power greater than 65 dBmV.",88]],"viewer":{"atp_file":"pdf/CM-TP-PHYv3.1-ATP-I01-181218.pdf","atp_page":1,"spec_file":"pdf/CM-SP-PHYv3.1-I17-190917.pdf","spec_pages":[73,88],"atp_revision":"I01 Issued","spec_revision":"I17 Issued"}},"TC1416 / PHY 39.31":{"version":"D3.1","atp_page":null,"atp":"","spec":[["7.4.2 Time and Frequency Synchronization","7.4.2    Time and Frequency Synchronization ................................................................................................ 52",5]],"viewer":{"atp_file":"pdf/CM-TP-PHYv3.1-ATP-I01-181218.pdf","atp_page":1,"spec_file":"pdf/CM-SP-PHYv3.1-I17-190917.pdf","spec_pages":[5],"atp_revision":"I01 Issued","spec_revision":"I17 Issued"}},"TC1417 / PHY 40.31":{"version":"D3.1","atp_page":null,"atp":"","spec":[["7.4.17 Upstream Pre-Equalization","7.4.17 Upstream Pre-Equalization\nA CM MUST implement a linear pre-equalizer with a single complex coefficient per subcarrier.\nThe CMTS MUST be able to direct a CM to pre-equalize its upstream transmission using CMTS-assigned pre-\nequalization coefficients as a step in the ranging process.\nThe CMTS uses the CM's probe signal for pre-equalizer coefficient updates. The probes are described in Section\n7.4.15.3. The message used to send information required for updating the pre-equalizer coefficients is described in\nthe Ranging Response (RNG-RSP) section of [DOCSIS MULPIv3.1].\nThe CMTS MAY specify the subcarriers (i.e., frequency range) over which coefficient updates is to be performed.\nThe CMTS MUST have the ability to scale the transmission power per subcarrier when configuring the probe\ntransmission using the Range Response message.\nThe CM MUST scale its transmission power per channel when transmitting the probe as required by the CMTS in\nthe P-MAP message. The range of the scaling values is: 0 to [10log(skip+1)] dB. Skip is defined in Section\n7.4.15.3.4.\nThe CM MUST use a default value of 1+j0 for all pre-equalizer coefficients of the used and unused subcarriers.\nThe CM MUST set to zero all pre-equalizer coefficients that correspond to the excluded subcarriers.\nThe CM MUST set the pre-equalizer coefficient to 1+j0 for any subcarrier whose status is changed from excluded\nto non-excluded. At the next probe opportunity the CM MUST use a pre-equalization coefficient of 1+j0 on the\nsubcarriers whose status has changed.\nThe CM MUST update the pre-equalizer coefficients according to the RNG-RSP message as described below.\nThe RNG-RSP MAC message carries the pre-equalization adjustment information.\n\n\n09/17/19                                            CableLabs                                                    110\n\fPhysical Layer Specification                                                          CM-SP-PHYv3.1-I17-190917\n\n\nThe RNG_RSP message sent by the CMTS specifies whether the pre-equalization coefficients sent by the CMTS\nare for coefficient initialization or for coefficient adjustment. If coefficient initialization is specified, the CM\nMUST replace the pre-equalizer coefficients with the coefficients sent by the CMTS. In the case of an adjustment,\nthe CM MUST multiply the coefficients values sent by the CMTS with the current pre-equalization coefficient\nvalues, to get the new coefficients, as follows:\n       Ck(i+1)=Ck(i) * Ak(i)\n               where:\n       Ck(i) is the pre-equalizer coefficient of the k-th subcarrier, as used in the last probe transmission, Ck(i+1) is\n       the updated pre-equalizer coefficient of the k-th subcarrier and Ak(i) is the update coefficient information\n       received in the RNG-RSP as a response to the corresponding probe transmission. \"*\" indicates a complex\n       multiplication.\nThe CMTS MUST use complex numbers for the update coefficients values in the form of I+j*Q where I and Q are\nboth using 16-bit fractional two's complement notation -\"s1.14\" (sign bit, integer bit, and 14 fractional bits).\nThe CMTS MUST be able to calculate and distribute initial pre-equalizer coefficients to reduce the channel\namplitude variation, by 0.8 dB or more corresponding to a 3 dB increase in MER from 16 dB to 19 dB, under the\nfollowing conditions:\n•   As measured by a spectrum analyzer or equivalent, on upstream probes.\n•   The probe signal power into CMTS burst receiver is +5.4 dBmV ±1 dB (approximately 0 dBmV per 6.4 MHz).\n•   An OFDMA channel with 22 MHz encompassed spectrum, where all subcarriers within the encompassed\n    spectrum are active subcarriers, is measured.\nPre-equalization operation subject to these conditions is verified using the following method:\nThe test modulator generates the first transmission using a compliant probe:\n•   This transmission is input into the spectrum analyzer, with an initial :flat\" test channel, achieving 0.3 dB p-p\n    amplitude variation or less after calibration of the spectrum analyzer (corresponding to a residual MER of 35\n    dB).\n•   Add a micro-reflection into the test channel with an amplitude of -16 dB ±0.5 dB and a delay of 0.3125\n    microseconds ±0.5 nanoseconds compared to main path.\n•   Verify the channel (except for the echo) changes by no more than 0.3 dB p-p, in addition to the 2.78 dB p-p\n    signal amplitude variation induced by the micro-reflection (the 0.3 dB tolerance allows the maximum\n    amplitude variation to increase to 3.08 dB p-p corresponding to total MER of 15.3 dB or a residual MER of 35\n    dB).\nThe test modulator generates the second transmission using a compliant probe sent to both the spectrum analyzer\nand the CMTS burst receiver (unit under test) with a CNR > 35 dB:\n•   The spectrum analyzer measures and records the amplitude variation over the spectrum of subcarriers (this is\n    the :reference amplitude variation measurement\" of the test).\n•   The CMTS burst receiver develops pre-equalizer coefficients.\n•   The CMTS formats and transmits compliant commands for the pre-equalizer coefficients.\n•   The downstream test receiver validates reception of pre-equalization coefficients.\nPre-equalization coefficients are implemented by the test modulator prior to the third transmission:\n•   The spectrum analyzer measures and records the amplitude variation over the spectrum of subcarriers for this\n    third transmission from the test modulator, which has been pre-equalized.\n•   The reduction in this third amplitude variation measurement at the spectrum analyzer compared to the initial\n    amplitude variation measurement of the second transmission is measured.\n•   The required minimum reduction in amplitude variation or better is observed.\n\n\n09/17/19                                            CableLabs                                                      111\n\fCM-SP-PHYv3.1-I17-190917                                   Data-Over-Cable Service Interface Specifications\n\n\nThe CM MUST normalize the new calculated coefficients as follows:\n       mean (abs (Ck)^2 ) = 1\n      (mean value computed over all pre-equalizer coefficients corresponding to the used and unused subcarriers).\nThe CM MUST pre-equalize all transmissions other than probe signals, as defined by the CMTS via the RNG_RSP\nmessage. The CM MUST pre-equalize all probe transmissions unless the bit in the P-MAP message that defines the\npresence or absence of pre-equalization, is set to \"equalizer disabled\".\nThe CM MUST be able to transmit a probe signal with or without pre-equalization (all coefficients are reset to\n1+j*0) as instructed by the CMTS using the P-MAP message described in [DOCSIS MULPIv3.1].\nThe CM MUST reset all its pre-equalizer coefficients in the following cases:\n1. Before its first transmission after receiving the first UCD message from the CMTS. See [DOCSIS MULPIv3.1].\n2. Before its first transmission after a change in at least one of the following parameters: upstream channel\nfrequency (the frequency of subcarrier with index zero), subcarrier spacing, Cyclic Prefix size, Rolloff Period\nduration, upstream channel change (CM is moved to a different upstream channel ID).\n\n7.5     Downstream Transmit and Receive",110],["7.5.9 Fidelity Requirements","7.5.9          Fidelity Requirements ...................................................................................................................... 142",6]],"viewer":{"atp_file":"pdf/CM-TP-PHYv3.1-ATP-I01-181218.pdf","atp_page":1,"spec_file":"pdf/CM-SP-PHYv3.1-I17-190917.pdf","spec_pages":[110,6],"atp_revision":"I01 Issued","spec_revision":"I17 Issued"}},"PHY-90.40":{"version":"D4.0","atp_page":1,"atp":"3.1\tBasic CM OFDM/FDD Input (PHY-90.40) (Mallesh)\t95\nPart 1: Cable Modem Downstream Input Test\t107\nCable modem input Test Procedure\t108","spec":[["7.3.2.1 Downstream CM Spectrum","7.3.2.1       Downstream CM Spectrum\nThe FDD CM MUST support a minimum of five independently configurable OFDM channels each occupying a\nspectrum of up to 192 MHz in the downstream.\nThe demodulator in the FDD CM MUST support receiving downstream transmissions to at least 1794 MHz.\nThe demodulator in the FDD CM MUST support agile placement of the OFDM channels within the entire\nsupported downstream range.\n\n\n\n\n98                                                   CableLabs                                                  12/02/20\n\fPhysical Layer Specification                                                         CM-SP-PHYv4.0-I03-201202\n\n\nThe FDD CM MUST support a downstream lower band edge within the frequency range shown in Table 31 - FDD\nCM Diplex Filter Band Edge Frequencies.\nThe FDD CM MUST support a 1794 MHz downstream upper band edge. Support in this context includes the\ncapability to demodulate up to the supported band edge.\nFor each of the upstream upper band edges supported, the FDD CM MUST support a Downstream Lower Band\nEdge within the frequency range shown in Table 31 - FDD CM Diplex Filter Band Edge Frequencies. Support in\nthis context includes the capability to demodulate down to this supported band edge.\nThe FDD CM could be optimized to operate with any supported downstream upper band edge. The nature and\noperation of this optimization is vendor-specific.",98],["7.3.5 FDD Downstream Transmit and Receive","7.3.5    FDD Downstream Transmit and Receive ..................................................................................... 123\n8      PHY-MAC CONVERGENCE ................................................................................................................. 137\n9      PROACTIVE NETWORK MAINTENANCE ........................................................................................ 138\nAPPENDIX I               ICI FROM CWT SOUNDING SIGNAL (INFORMATIVE) .............................................. 139\n    I.1       ICI Caused by Sounding Signal on Adjacent US Subcarriers ............................................................... 139\n    I.2       ICI Caused by Sounding Signal on Adjacent DS Subcarriers ............................................................... 139\nAPPENDIX II                  EXAMPLE USE OF CWT SOUNDING TO FORM IGS (INFORMATIVE) ................ 141\nAPPENDIX III                 CMTS PROPOSED CONFIGURATION PARAMETERS (INFORMATIVE) ............. 142\nAPPENDIX IV                  FDD RPD/RMD RF OUTPUT PROFILES AT INTERFACE C (INFORMATIVE) ..... 143\nAPPENDIX V                   ACKNOWLEDGEMENTS (INFORMATIVE) ............................................................... 145\nAPPENDIX VI                  REVISION HISTORY (INFORMATIVE) ....................................................................... 146\n\n\n\n\n12/02/20                                                                  CableLabs n\n\n12/02/20                                                                   CableLabs                                                                                  7\n\fCM-SP-PHYv4.0-I03-201202                                         Data-Over-Cable Service Interface Specifications\n\n\n1 SCOPE\n1.1     Introduction and Purpose\nThis specification is part of the DOCSIS family of specifications developed by Cable Television Laboratories\n(CableLabs). In particular, this specification is part of a series of specifications that defines the sixth generation of\nhigh-speed data-over-cable systems, commonly referred to as the DOCSIS 4.0 specifications. This specification\nwas developed for the benefit of the cable industry, and includes contributions by operators and vendors from\nNorth and South America, Europe, China, and other regions.\nThis generation of the DOCSIS specifications builds upon the previous generations of DOCSIS specifications\n(commonly referred to as the DOCSIS 3.1 and earlier specifications), leveraging the existing Media Access Control\n(MAC) and Physical (PHY) layers. It includes backward compatibility for the existing PHY layers in order to\nenable a seamless migration to the new technology. Further, the DOCSIS 4.0 specifications introduces Full Duplex\n(FDX) DOCSIS PHY layer technology as an expansion of the OFDM PHY layer introduced in the [DOCSIS\nPHYv3.1] specification to increase upstream capacity without significant loss of downstream capacity versus\nDOCSIS 3.1. The DOCSIS 4.0 specification also builds upon DOCSIS 3.1 OFDM and OFDMA technology with\nan extended Frequency Division Duplex (FDD) DOCSIS alternative. DOCSIS 4.0 FDD supports legacy high-split\nand also provides extended splits up to 684 MHz in an operational band plan which is referred to as Ultra-high\nSplit (UHS). DOCSIS 4.0 FDD also introduces expansion of usable downstream spectrum up to 1794 MHz. Both\nthe FDX and FDD DOCSIS 4.0 alternatives are based on OFDM PHY. Many sections refer to basic OFDM\nsublayer definitions described in [DOCSIS PHYv3.1].\nThere are differences in the cable spectrum planning practices adopted for different networks in the world. For the\nPHY layer defined in this specification, there is flexibility to deploy the technology in any spectrum plan; therefore,\nno special accommodation for different regions of the world is required for this new PHY layer.\nHowever, due to the inclusion of the DOCSIS 3.0 PHY layers for backward-compatibility purposes, there is still a\nneed for different region-specific physical layer technologies. Therefore, three options for physical layer\ntechnologies are included in this specification, which have equal priority and are not required to be interoperable.\nOne technology option is based on the downstream channel identification plan that is deployed in North America\nusing 6 MHz spacing. The second technology option is based on the corresponding European multi-program\ntelevision distribution. The third technology option is based on the corresponding Chinese multi-program television\ndistribution. All three options have the same status, notwithstanding that the document structure does not reflect\nthis equal priority. The first of these options is defined in Sections 5 and 6, whereas the second is defined by\nreplacing the content of those sections with the content of annex C of [DOCSIS PHYv3.1]. The third is defined by\nreplacing the content of those sections with the content of annex D of [DOCSIS PHYv3.1]. Correspondingly, [ITU-\nT J.83-B] and [CTA 542] apply only to the first option, and [EN 300 429] applies to the second and third.\nCompliance with this document requires compliance with one of these implementations, but not with all three. It is\nnot required that equipment built to one option interoperate with equipment built to the others.\nCompliance with frequency planning and EMC requirements is not covered by this specification and remains the\noperators' responsibility. In this respect, [FCC15] and [FCC76] are relevant to the USA; [CAN/CSA CISPR 22-10]\nand [ICES 003 Class A] to Canada; [EG 201 212], [EN 50083-1], [EN 50083-2], [EN 50083-7], [EN 61000-6-1],\nand [EN 61000-6-3] are relevant to the European Union; and [GB 8898-2011] and [GB/T 11318.1-1996] are\nrelevant to China.\nSee also [DOCSIS PHYv3.1], section 1.1.\n\n1.2     Background\n\n1.2.1    Broadband Access Network\nA coaxial-based broadband access network is assumed. This may take the form of either an all-coax or hybrid-\nfiber/coax (HFC) network. The generic term \"cable network\" is used here to cover all cases.\nA cable network uses a tree-and-branch architecture with analog transmission. The key functional characteristics\nassumed in this document are the following:\n\n\n\n8                                                     CableLabs                                                12/02/20\n\fPhysical Layer Specification                                                       CM-SP-PHYv4.0-I03-201202\n\n\n    •     Two-way transmission.\n    •     A maximum optical/electrical spacing between the CMTS and the most distant CM of 100 miles (160 km)\n          in each direction, although typical maximum separation may be 10-15 miles (16-24 km).\n\n1.2.2     Network and System Architecture\n\n1.2.2.1    The DOCSIS Network\nThe elements that participate in the provisioning of DOCSIS services are shown in Figure 1.\n\n\n\n\n                                          Figure 1 - The DOCSIS Network\n\n\nThe CM connects to the operator's HFC network and to a home network, bridging packets between them. Many\nCPE devices can connect to the CMs' LAN interfaces. CPE can be embedded with the CM in a single device, or\nthey can be separated into standalone devices, as shown in Figure 1. CPE may use IPv4, IPv6 or both forms of IP\naddressing. Examples of typical CPE are gateways, home routers, set-top devices, personal computers, etc.\nThe CMTS connects the operator's back office and core network to the HFC network. The CMTS's main function\nis to forward packets between these two domains, and optionally to forward packets between upstream and\ndownstream channels on the HFC network. The CMTS performs this forwarding with any combination of link-\nlayer (bridging) and network-layer (routing) semantics.\nFor a DOCSIS 4.0 system, a distributed architecture is assumed. Thus, where DOCSIS 4.0 specifications use the\n\"CMTS\" terminology it is implied to refer to legacy CMTS functionality as instantiated in the elements of the\ndistributed architecture.\nVarious applications are used to provide back office configuration and other support to the devices on the DOCSIS\nnetwork. These applications use IPv4 and/or IPv6 as appropriate to the particular operator's deployment. The\nfollowing applications include:\nProvisioning Systems:\n    •     The DHCP servers provide the CM with initial configuration information, including the device IP\n          address(es), when the CM boots.\n    •     The Configuration File server is used to download configuration files to CMs when they boot.\n          Configuration files are in binary format and permit the configuration of the CM's parameters.\n    •     The Software Download server is used to download software upgrades to the CM.\n    •     The Time Protocol server provides Time Protocol clients, typically CMs, with the current time of day.\n    •     The Certificate Revocation server provides certificate status.\n\n\n\n12/02/20                                             CableLabs                                                   9\n\fCM-SP-PHYv4.0-I03-201202                                      Data-Over-Cable Service Interface Specifications\n\n\nNetwork Management System (NMS):\n     •   The SNMP Manager allows the operator to configure and monitor SNMP Agents, typically the CM and\n         the CMTS.\n     •   The Syslog server collects messages pertaining to the operation of devices.\n     •   The IPDR Collector server allows the operator to collect bulk statistics in an efficient manner.\n\n1.2.3    Service Goals\nAs cable operators have widely deployed high-speed data services on cable television systems, the demand for\nbandwidth has increased. To this end, CableLabs' member companies have decided to add new features to the\nDOCSIS specification for the purpose of increasing capacity, increasing peak speeds, improving scalability,\nenhancing network maintenance practices, and deploying new service offerings.\nThe DOCSIS system allows transparent bi-directional transfer of Internet Protocol (IP) traffic, between the cable\nsystem headend and customer locations, over an all-coaxial or Hybrid-Fiber/Coax (HFC) cable network. This is\nshown in simplified form in Figure 2.\n                                                                                             CM\n                                                                                         Customer\n                                                                                          Premises\n                                                                                         Equipment\n                                                                                          Interface\n         Wide Area                                           Cable\n          Network                                           Network\n                       CMTS\n                     Network Side                                              Cable Modem            Customer\n                      Interface       CMTS\n                                                                                                      Premises\n                                                                                                      Equipment\n\n                     Figure 2 - Transparent IP Traffic through the Data-Over-Cable System\n\n1.2.4    Statement of Compatibility\nThis specification defines the DOCSIS 4.0 interface. Prior generations of DOCSIS were commonly referred to as\nthe DOCSIS 1.0, 1.1, 2.0, 3.0, and 3.1 interfaces. DOCSIS 4.0 is backward-compatible with some equipment built\nto the previous specifications. DOCSIS 4.0-compliant CMs interoperate seamlessly with DOCSIS 4.0, DOCSIS 3.1\nand DOCSIS 3.0 CMTSs. DOCSIS 4.0-compliant CMTSs seamlessly support DOCSIS 4.0, DOCSIS 3.1, DOCSIS\n3.0, DOCSIS 2.0, and DOCSIS 1.1 CMs.\n\n\n\n\n10                                                  CableLabs                                              12/02/20\n\fPhysical Layer Specification                                                                                                                    CM-SP-PHYv4.0-I03-201202\n\n\n1.2.5    Reference Architecture\n\n                     DOCSIS 4.0 Distributed CMTS Reference Architecture\n                                                                                                                                       Distributed CMTS\n\n                                                                                              FMA-OSSI                         FMA Management/Control Apps\n               Operations Support Systems\n                  PacketCable Servers                                                                                                                       PacketCable\n                Lawful Intercept Mediation                                                                                     MAC Manager\n                                                                                                                                                             Aggregator\n                                                                                                DQoS/\n                                                                                                PCMM\n\n\n                   R-OSSI                 DQoS/                                               CM-OSSI\n ist of the specifications in the DOCSIS 4.0 series is provided in Table 1. For further information, please refer to\nhttps://www.cablelabs.com/.\n\n\n\n\n12/02/20                                                                                  CableLabs                                                                              11\n\fCM-SP-PHYv4.0-I03-201202                                           Data-Over-Cable Service Interface Specifications\n\n\n                                   Table 1 - DOCSIS 4.0 Series of Specifications\n\n          Designation                                                        Title\n     CM-SP-PHYv4.0               Physical Layer Specification\n     CM-SP-MULPIv4.0             MAC and Upper Layer Protocols Interface Specification\n     CM-SP-CM-OSSIv4.0           Cable Modem Operations Support System Interface Specification\n     CM-SP-CCAP-OSSIv4.0         CCAP™ Operations Support System Interface Specification\n     CM-SP-SECv4.0               Security Specification\n\nThis specification defines the interface for the physical layer.\nRelated DOCSIS specifications are listed in Table 2.\n                                    Table 2 - DOCSIS 4.0 Related Specifications\n\n          Designation                                                        Title\n     CM-SP-PHYv3.1               Physical Layer Specification\n     CM-SP-MULPIv3.1             MAC and Upper Layer Protocols Interface Specification\n     CM-SP-CM-OSSIv3.1           Cable Modem Operations Support System Interface Specification\n     CM-SP-CCAP-OSSIv3.1         CCAP Operations Support System Interface Specification\n     CM-SP-SECv3.1               Security Specification\n     CM-SP-CMCIv3.0              Cable Modem CPE Interface Specification\n     CM-SP-eDOCSIS               eDOCSIS™ Specification\n     CM-SP-DRFI                  Downstream Radio Frequency Interface Specification\n     CM-SP-DTI                   DOCSIS Timing Interface Specification\n     CM-SP-DEPI                  Downstream External PHY Interface Specification\n     CM-SP-DSG                   DOCSIS Set-Top Gateway Interface Specification\n     CM-SP-FMA-SYS               Flexible MAC Architecture System Specification\n     CM-SP-FMA-OSSI              Flexible MAC Architecture Operations Support System Interface Specification\n     CM-SP-FMA-MMI               Flexible MAC Architecture MAC Manager Interface Specification\n     CM-SP-FMA-PAI               Flexible MAC Architecture PacketCable Aggregator Interface Specification\n     CM-SP-GCP                   Generic Control Plane Specification\n     CM-SP-L2VPN                 Layer 2 Virtual Private Networks Specification\n     CM-SP-R-DEPI                Remote Downstream External PHY Interface Specification\n     CM-SP-R-DTI                 Remote DOCSIS Timing Interface Specification\n     CM-SP-R-OOB                 Remote Out-of-Band Specification\n     CM-SP-R-OSSI                Remote PHY OSS Interface Specification\n     CM-SP-R-PHY                 Remote PHY Specification\n     CM-SP-R-UEPI                Remote Upstream External PHY Interface Specification\n     CM-SP-TEI                   TDM Emulation Interfaces Specification\n\n\n1.3     Requirements\nThroughout this document, the words that are used to define the significance of particular requirements are\ncapitalized. These words are:\n     \"MUST\"              This word means that the item is an absolute requirement of this specification.\n     \"MUST NOT\"          This phrase means that the item is an absolute prohibition of this specification.\n     \"SHOULD\"            This word means that there may exist valid reasons in particular circumstances to ignore this item,\n                         but the full implications should be understood, and the case carefully weighed before choosing a\n                         different course.\n\n\n\n\n12                                                        CableLabs                                                 12/02/20\n\fPhysical Layer Specification                                                                 CM-SP-PHYv4.0-I03-201202\n\n\n   \"SHOULD NOT\"           This phrase means that there may exist valid reasons in particular circumstances when the listed\n                          behavior is acceptable or even useful, but the full implications should be understood, and the case\n                          carefully weighed before implementing any behavior described with this label.\n   \"MAY\"                  This word means that this item is truly optional. One vendor may choose to include the item\n                          because a particular marketplace requires it or because it enhances the product, for example;\n                          another vendor may omit the same item.\n\nThis document defines many features and parameters, and a valid range for each parameter is usually specified.\nEquipment (CM and CMTS) requirements are always explicitly stated. Equipment is required to comply with all\nmandatory (MUST and MUST NOT) requirements to be considered compliant with this specification. Support of\nnon-mandatory features and parameter values is optional.\n\n1.4    Conventions\nIn this specification, the following convention applies any time a bit field is displayed in a figure. The bit field\nshould be interpreted by reading the figure from left to right, then top to bottom, with the most-significant bit\n(MSB) being the first bit read, and the least-significant bit (LSB) being the last bit read.\n\n1.5    Organization of Document\nSection 1 provides an overview of the DOCSIS 4.0 series of specifications including the DOCSIS reference\narchitecture and statement of compatibility.\nSection 2 includes a list of normative and informative references used within this specification or related\nspecifications.\nSection 3 defines the terms used throughout this specification or related specifications.\nSection 4 defines the abbreviations and acronyms used throughout this specification or related specifications.\nSection 5 provides a technical overview and lists the key features of DOCSIS 4.0 technology for the functional area\nof this specification; it also describes the key functional assumptions for the DOCSIS 4.0 system.\nSection 6 defines the PHY sublayer for SC-QAM.\nSection 7 defines the interface and related requirements for operation with the DOCSIS 4.0 channels, as well as for\ncombined operation of DOCSIS 3.0, DOCSIS 3.1 and DOCSIS 4.0 channels. This is addressed for each of: the CM\ndownstream and upstream physical layer; and for the CMTS downstream upstream physical layer.\nSection 8 defines PHY-MAC convergence - how information is transferred between the MAC layer and the PHY\nlayer - in both the upstream and downstream.\nSection 9 defines the requirements supporting Proactive Network Maintenance (PNM).\nThe appendices contain informative material that provides more detailed explanations and examples of certain\naspects of this specification.\n\n\n\n\n12/02/20                                                CableLabs                                                              13\n\fCM-SP-PHYv4.0-I03-201202                                           Data-Over-Cable Service Interface Specifications\n\n\n2 REFERENCES\n2.1    Normative References\nIn order to claim compliance with this specification, it is necessary to conform to the following standards and other\nworks as indicated, in addition to the other requirements of this specification. Notwithstanding, intellectual\nproperty rights may be required to use or implement such normative references.\nAll references are subject to revision, and parties to agreement based on this specification are encouraged to\ninvestigate the possibility of applying the most recent editions of the documents listed below.\n [CAN/CSA           Information technology equipment - Radio disturbance characteristics - Limits and methods of\n CISPR 22-10]
