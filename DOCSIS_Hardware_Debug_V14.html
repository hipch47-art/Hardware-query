the CM output at the customer location to the headend.\n                         Table 4 - Typical Upstream RF Channel Transmission Characteristics\n\n                              Parameter                                                          Value\nFrequency range                                                        FDX: 5 to 85 MHz and 108 to 684 MHz\n                                                                       FDD high-split backward compatibility: 5 MHz to 204 MHz\n                                                                       FDD UHS (DOCSIS 3.1 CMs): 5 MHz to 204 MHz\n                                                                       FDD UHS (DOCSIS 4.0 CMs): 5 to 85 and 108 to xxx MHz\n                                                                        (where xxx = 300, 396, 492, or 684 MHz)\nOne way transit delay from most distant customer to headend.           ≤ 0.400 ms (typically much less)\nCarrier-to-interference plus ingress (the sum of noise, distortion,    Not less than 25 dB\ncommon-path distortion and cross modulation and the sum of discrete\nand broadband ingress signals, impulse noise excluded) ratio\nCarrier hum modulation                                                 Not greater than -26 dBc (5.0%)\nMaximum amplitude variation across the 6 MHz channel (digital          ≤ 2.78 dB pk-pk/6 MHz\nchannels)\nGroup Delay Variation                                                  ≤163 ns over 24 MHz\nMicro-reflections bound for dominant single echo                       -16 dBc for echoes ≤ 0.5 µs\n                                                                       -22 dBc for echoes ≤ 1.0 µs\n                                                                       -29 dBc for echoes ≤ 1.5 µs\n                                                                       -35 dBc for echoes > 2.0 µs\n                                                                       -42 dBc for echoes > 3.0 µs\n                                                                       -51 dBc for echoes > 4.5 µs\nSeasonal and diurnal reverse gain (loss) variation                     Not greater than 14 dB min to max\nNOTE: Cascaded group delay could possibly exceed the ≤163 ns value within approximately 10 MHz of the upstream spectrum's\nlower and upper band edges, depending on cascade depth, diplex filter design, and actual band split.\n\n\n5.2.2.2.1      Availability\nCable network availability is typically greater than 99.9%.\n\n5.2.3     Transmission Levels\nThe nominal power level of the upstream CM signal(s) will be as low as possible to achieve the required margin\nabove noise and interference. Uniform power loading per unit bandwidth is commonly followed in setting upstream\nsignal levels, with specific levels established by the cable network operator to achieve the required carrier-to-noise\nand carrier-to-interference ratios.\n\n5.2.4     Frequency Inversion\nThere will be no frequency inversion in the transmission path in either the downstream or the upstream directions,\ni.e., a positive change in frequency at the input to the cable network will result in a positive change in frequency at\nthe output.\n\n\n\n\n36                                                      CableLabs                                                  12/02/20\n\fPhysical Layer Specification                                                          CM-SP-PHYv4.0-I03-201202\n\n\n6 PHY SUBLAYER FOR SC-QAM\n6.1     Scope\nThis section applies to cases where a DOCSIS 4.0 CM or CMTS is operating with simultaneous operation of SC-\nQAM and OFDM/OFDMA channels unless otherwise noted. Throughout this entire document, \"OFDM\" pertains\nto downstream, \"OFDMA\" pertains to upstream, and \"SC-QAM\" pertains to either a) DOCSIS 3.0 or earlier\ndownstream channels, or b) TDMA, ATDMA, collectively, from DOCSIS 3.0 or earlier, for the upstream channels.\nThe S-CDMA support is not required for the DOCSIS 4.0 CM and CMTS.\nThis specification defines the electrical characteristics and signal processing operations for a CM and CMTS. It is\nthe intent of this specification to define an interoperable DOCSIS 4.0 CM and CMTS such that any implementation\nof a DOCSIS 4.0 CM can work with any DOCSIS 4.0 or DOCSIS 3.1 CMTS. It is not the intent of this\nspecification to imply any specific implementation.\nAs the requirements for a DOCSIS 4.0 CM and CMTS are largely unchanged relative to SC-QAM operation, this\nsection is composed primarily of references to the appropriate DOCSIS 3.0 specification sections for the specific\nrequirements for a DOCSIS 4.0 CM and CMTS, as well as any deltas relative to those requirements.\nA DOCSIS 4.0 CM MUST comply with the referenced requirements in the [DOCSIS PHYv3.0] and [DOCSIS\nDRFI] specifications noted in this section, with the exception of any deltas called out in this section (which will be\nidentified with separate requirement statements). A DOCSIS 4.0 CMTS MUST comply with the referenced\nrequirements in the [DOCSIS PHYv3.0] and [DOCSIS DRFI] specifications noted in this section, with the\nexception of any deltas called out in this section (which will be identified with separate requirement statements).\n\n6.2     Upstream Transmit and Receive\n\nThis section is based on section 6.2 of [DOCSIS PHYv3.0].\n\n6.2.1    Overview\nSee section 6.2.1 of [DOCSIS PHYv3.0], with the exceptions noted in Section 7.2 for the FDX CM and Section 7.3\nfor the FDD CM.\n\n6.2.2    Signal Processing Requirements\nSee section 6.2.2 of [DOCSIS PHYv3.0].\n\n6.2.3    Modulation Formats\nSee section 6.2.3 of [DOCSIS PHYv3.0].\n\n6.2.4    R-S Encode\nSee section 6.2.4 of [DOCSIS PHYv3.0].\n\n6.2.5    Upstream R-S Frame Structure (Multiple Transmit Channel Mode Enabled)\nSee section 6.2.5 of [DOCSIS PHYv3.0].\n\n6.2.6    Upstream R-S Frame Structure (Multiple Transmit Channel Mode Disabled)\nSee section 6.2.6 of [DOCSIS PHYv3.0].\n\n6.2.7    TDMA Byte Interleaver\nSee section 6.2.7 of [DOCSIS PHYv3.0].\n\n\n\n\n12/02/20                                            CableLabs                                                      37\n\fCM-SP-PHYv4.0-I03-201202                                    Data-Over-Cable Service Interface Specifications\n\n\n6.2.8   Scrambler (randomizer)\nSee section 6.2.8 of [DOCSIS PHYv3.0].\n\n6.2.9   TCM Encoder\nSee section 6.2.9 of [DOCSIS PHYv3.0].\n\n6.2.10 Preamble Prepend\nSee section 6.2.10 of [DOCSIS PHYv3.0].\n\n6.2.11 Modulation Rates\nSee section 6.2.11 of [DOCSIS PHYv3.0].\n\n6.2.12 S-CDMA Framer and Interleaver\nSee section 6.2.12 of [DOCSIS PHYv3.0].\n\n6.2.13 S-CDMA Framer\nSee section 6.2.13 of [DOCSIS PHYv3.0].\n\n6.2.14 Symbol Mapping\nSee section 6.2.14 of [DOCSIS PHYv3.0].\n\n6.2.15 S-CDMA Spreader\nSee section 6.2.15 of [DOCSIS PHYv3.0].\n\n6.2.16 Transmit Pre-Equalizer\nSee section 6.2.16 of [DOCSIS PHYv3.0].\n\n6.2.17 Spectral Shaping\nSee section 6.2.17 of [DOCSIS PHYv3.0].\n\n6.2.18 Relative Processing Delays\nSee section 6.2.18 of [DOCSIS PHYv3.0].\n\n6.2.19 Transmit Power Requirements\nFor the case in which a DOCSIS 4.0 CM is operating with a DOCSIS 3.0 CMTS regardless of channel type, the\ntransmit power requirements are described in Section 7.2.4.12.4 for the FDX CM and in Section 7.3.4.12.4 for the\nFDD CM. The requirements in Section 7.2.4.12.4 or 7.3.4.12.4 apply even when all upstream channels on the\nDOCSIS 4.0 CM are SC-QAM.\n\n6.2.20 Burst Profiles\nSee section 6.2.20 of [DOCSIS PHYv3.0].\n\n6.2.21 Burst Timing Convention\nSee section 6.2.21 of [DOCSIS PHYv3.0].\n\n\n\n\n38                                                CableLabs                                            12/02/20\n\fPhysical Layer Specification                                                             CM-SP-PHYv4.0-I03-201202\n\n\n6.2.22 Fidelity Requirements\nFor the case in which a DOCSIS 4.0 CM is operating with a DOCSIS 4.0 CMTS regardless of channel type, the\nfidelity requirements are described in Section 7.2.4.12.7 for FDX CMs and Section 7.3.4.12.7 for FDD CM. The\nrequirements in Sections 7.2.4.12.7 and 7.3.4.12.7 apply even when all upstream channels on the DOCSIS 3.1 CM\nare SC-QAM. For this case there are no MER requirements for SC-QAM channels. So the Sections 7.2.4.12.7.2\nand 7.3.4.12.7.2 do not apply for this case.\n\n6.2.23 Upstream Demodulator Input Power Characteristics\nSee section 6.2.23 of [DOCSIS PHYv3.0].\n\n6.2.24 Upstream Electrical Output from the CM\nFor the case in which a DOCSIS 4.0 CM is operating with a DOCSIS 3.1 CMTS regardless of channel type, the\nupstream electrical output requirements are described in Section 7.2.4.13 (FDX CM) and 7.3.4.13 (FDD CM). The\nrequirements in these sections apply even when all upstream channels on the DOCSIS 4.0 CM are SC-QAM.\n                   Table 5 - CM Transmitter Output Signal Characteristics for SC-QAM channels\n\n            Parameter                                                     Value\nFrequency                       Support and be configurable to a permitted subset (see Section7.2.2.3 for allowed\n                                combinations) of the following frequency range:\n                                5 MHz to 85 MHz\n                                NOT to cause harmful interference above these frequencies for any configured option.\nSignal Type                     TDMA\nModulation Type                 QPSK, 8-QAM, 16-QAM, 32-QAM, and 64-QAM\nModulation Rate (nominal)       TDMA: 1280, 2560, and 5120 kHz\n                                Optional pre-3.0-DOCSIS operation,\n                                TDMA: 160, 320, and 640 kHz\nBandwidth                       TDMA: 1600, 3200, and 6400 kHz\n                                Optional pre-3.0-DOCSIS operation,\n                                TDMA: 200, 400, and 800 kHz\nLevel                           Total average output power of 65 dBmV.\n                                (See item # 1 immediately following this table)\n                                Total average output power greater than 65 dBmV.\n                                (See item # 2 following this table)\nOutput Impedance                75 ohms\nOutput Return Loss              > 6 dB 5 MHz to 85 MHz\nConnector                       F connector per [ISO/IEC-61169-24] or [SCTE 02]\n\n\nThe following is an itemized list of CM Transmitter Output Signal Characteristics based on Table 5 above.\n    1.   The DOCSIS 4.0 CM MUST be capable of transmitting a total average output power of 65 dBmV when\n         operating in DOCSIS 3.1 mode.\n    2.   The DOCSIS 4.0 CM MAY be capable of transmitting a total average output power greater than 65 dBmV\n         when operating in DOCSIS 3.1 mode.\n\n6.2.25 Upstream CM Transmitter Capabilities\nFor the case in which a DOCSIS 4.0 CM is operating with a DOCSIS 3.0 CMTS or where a DOCSIS 4.0 CMTS is\noperating with a DOCSIS 3.0 CM; see section 6.2.25 of [DOCSIS PHYv3.0].\nFor the case in which a DOCSIS 4.0 CM is operating with a DOCSIS 4.0 CMTS regardless of channel type, the\ntransmitter capabilities are described in [DOCSIS PHYv3.1].\n\n\n\n\n12/02/20                                             CableLabs                                                        39\n\fCM-SP-PHYv4.0-I03-201202                                       Data-Over-Cable Service Interface Specifications\n\n\n6.3       Downstream Transmit\n\nThis section is based on section 6.3 of [DOCSIS DRFI].\n\n6.3.1      Downstream Protocol\nSee section 6.3.1 of [DOCSIS DRFI].\n\n6.3.2      Spectrum Format\nSee section 6.3.2 of [DOCSIS DRFI].\n\n6.3.3      Scalable Interleaving to Support Video and High-Speed Data Services\nSee section 6.3.3 of [DOCSIS DRFI].\n\n6.3.4      Downstream Frequency Plan\nSee section 6.3.4 of [DOCSIS DRFI].\n\n6.3.5      DRFI Output Electrical\nApplies only the case where a DOCSIS 4.0 device is operating in DOCSIS 3.0 mode only.\nFor legacy SC-QAMs, the EQAM and CMTS MUST support the electrical output requirements specified in the\nfollowing sections and tables of [DOCSIS DRFI]:\n      •    Section 6.3.5, DRFI Output Electrical\n      •    Section 6.3.5.1, CMTS or EQAM Output Electrical\n      •    Table titled: RF Output Electrical Requirements, in Section 6\n      •    Section 6.3.5.1.1, Power per Channel CMTS or EQAM\n      •    Table titled: DRFI Device Output Power, in Section 6\n      •    Section 6.3.5.1.2, Independence of Individual Channels within the Multiple Channels on a Single RF Port\n      •    Section 6.3.5.1.3, Out-of-Band Noise and Spurious Requirements for CMTS or EQAM\n      •    Table titled: EQAM or CMTS Output Out-of-Band Noise and Spurious Emissions Requirements for\n           N ≤ 8, in Section 6\n      •    Table titled: EQAM or CMTS Output Out-of-Band Noise and Spurious Emissions Requirements N ≥ 9\n           and N' ≥ N/4, in Section 6\n      •    Table titled: EQAM or CMTS Output Out-of-Band Noise and Spurious Emissions Requirements N ≥ 9\n           and N' < N/4, in Section 6\n\n6.3.6      CMTS or EQAM Clock Generation\nApplies only to the case where a DOCSIS 4.0 CMTS is operating in a DOCSIS 3.0 mode only.\nSee section 6.3.6 of [DOCSIS DRFI].\n\n6.3.7      Downstream Symbol Clock Jitter for Synchronous Operation\nApplies only to the case where a DOCSIS 4.0 CMTS is operating in a DOCSIS 3.0 mode only.\nSee section 6.3.7 of [DOCSIS DRFI].\n\n6.3.8      Downstream Symbol Clock Drift for Synchronous Operation\nApplies only to the case where a DOCSIS 4.0 CMTS is operating in a DOCSIS 3.0 mode only.\n\n\n40                                                   CableLabs                                          12/02/20\n\fPhysical Layer Specification                                                    CM-SP-PHYv4.0-I03-201202\n\n\nSee section 6.3.8 of [DOCSIS DRFI].\n\n6.3.9     Timestamp Jitter\nSee section 6.3.9 of [DOCSIS DRFI].\n\n6.4     Downstream Receive\n\nThis section is based on section 6.3 of [DOCSIS PHYv3.0].\n\n6.4.1     Downstream Protocol and Interleaving Support\nSee section 6.3.1 of [DOCSIS PHYv3.0].\n\n6.4.2     Downstream Electrical Input to the CM\nSee section 6.3.2 of [DOCSIS PHYv3.0], with the exception noted below.\nA CM MUST support at least 32 active downstream SC-QAM channels.\nA CMTS MUST support at least 32 active downstream SC-QAM channels.\n\n6.4.3     CM BER Performance\nSee section 6.3.3 of [DOCSIS PHYv3.0].\n\n6.4.3.1    FDX CM BER Performance Above the FDX Transition Band\nThe CM BER performance of an FDX CM operating in FDX mode receiving SC-QAM channels between 804\nMHz and 1002 MHz with a flat receive PSD in the presence of AWGN is given in sections 6.3.3.1.1 and 6.3.3.2.1\nof [DOCSIS PHYv3.0].\nImplementation loss of the FDX CM when in FDX mode MUST be such that the CM achieves a post-FEC BER\nless than or equal to 10-8 when operating at a carrier to noise ratio (ES/N0) as shown in Table 6 - Minimum CNR\nPerformance 804 MHz to 1002 MHz for FDX CM Operating in FDX Mode. If it is not possible to measure post-\nFEC BER directly, Codeword Error Ratio, RC (as defined in section 6.3.3.1.1 of [DOCSIS PHYv3.0]) may be used.\nIn this case, the FDX CM MUST achieve a Codeword Error Ratio of less than or equal to 9 x 10-7 when operating\nat a carrier to noise ratio (ES/N0), as shown in Table 6 - Minimum CNR Performance 804 MHz to 1002 MHz for\nFDX CM Operating in FDX Mode below.\n        Table 6 - Minimum CNR Performance 804 MHz to 1002 MHz for FDX CM Operating in FDX Mode\n\n              SC-QAM Modulation              Receive Signal Level              Minimum CNR\n                   Order                        (dBmV/6MHz)                        (dB)\n                       256                          -6 to +15                        30\n                       256                         -15 to <-6                        33\n                       64                          -15 to +15                       23.5\n\n\nFor an FDX CM not operating in FDX mode, the requirements in [DOCSIS PHYv3.0] apply for downstream SC-\nQAM performance.\n\n6.4.4     Downstream Multiple Receiver Capabilities\nSee section 6.3.4 of [DOCSIS PHYv3.0].\n\n6.4.5     Non-Synchronous DS Channel Support\nApplies only to the case where a DOCSIS 4.0 CM operating with a DOCSIS 3.0 CMTS.\nSee section 6.3.5 of [DOCSIS PHYv3.0].\n\n\n\n12/02/20                                         CableLabs                                                 41\n\fCM-SP-PHYv4.0-I03-201202                                     Data-Over-Cable Service Interface Specifications\n\n\n7 PHY SUBLAYER FOR OFDM\n7.1    Scope\nThis specification defines the electrical characteristics and signal processing operations for a cable modem (CM)\nand Cable Modem Termination System (CMTS). It is the intent of this specification to define an interoperable CM\nand CMTS such that any implementation of a CM can work with any CMTS. It is not the intent of this\nspecification to imply any specific implementation.\nThis section describes CM and CMTS physical layer requirements for DOCSIS 4.0-compliant devices in either\nFull-Duplex DOCSIS (FDX) or Frequency Division Duplexed (FDD) environments.\nDOCSIS 4.0 FDX is an expansion of the DOCSIS 3.1 specification that is targeted at significantly increasing\nupstream capacity by using the spectrum currently used for downstream transmission for simultaneous upstream\nand downstream communications via full duplex communications. Therefore, many sections refer to basic OFDM\nsublayer definitions described in the [DOCSIS PHYv3.1] specification.\nDOCSIS 4.0 FDD is an expansion of the DOCSIS 3.1 specification that is targeted at significantly increasing\nupstream and downstream capacity by extending the available upstream dedicated spectrum beyond previously\ndefined upper bounds to as much as 684 MHz and also extending the available downstream spectrum capabilities to\n1794 MHz, while maintaining spectrum separation between upstream and downstream transmissions at a\npredefined frequency.\nThe following sections are intended to treat separately the PHY OFDM sublayer requirements for FDX or FDD\ncapability requirements. Section 7.2 and its subsections address the PHY sublayer requirements specific to\nDOCSIS 4.0 FDX functionality. Section 7.3 and its subsections address the PHY sublayer requirements specific to\nDOCSIS 4.0 FDD functionality.\n\n7.2    PHY Sublayer for FDX OFDM\nFull Duplex capability requires additional functions to be added to the DOCSIS 3.1 requirements. These new\nfunctions are specified in this specification. As with previous generations of DOCSIS technologies, DOCSIS 4.0-\ncompliant devices will be backward-compatible with previous generations of DOCSIS technology. The FDX\nAllocated Spectrum is subdivided into FDX channels that can be assigned to modems according to system\nrequirements. FDX channels carry both upstream and downstream traffic. The CMTS assignment of FDX channels\nwithin the FDX band for Full Duplex DOCSIS operation can be done incrementally over time as a transition\nstrategy, from existing DOCSIS networks to Full Duplex DOCSIS networks, as FDX-capable CMTSs and modems\nbecome available.\nFor an FDX DOCSIS system, a distributed architecture is assumed due to the echo cancellation functionality that is\nrequired. Thus, this portion of the specification refers to the physical layer functionality of an FDX-capable CMTS\nas the FDX Node. The CMTS is occasionally used to refer to the total functionality across the MAC layer and the\nPhysical layer.\nAn FDX-compliant FDX Node supports simultaneous upstream and downstream communications over each FDX\nchannel; this is enabled by cancellation techniques for self-interference and echo cancellation. FDX-compliant\ncable modems will operate in frequency division duplexing mode, where on any FDX channel, the CM is either\ntransmitting in the upstream or receiving in the downstream. An FDX-compliant CMTS allocates FDX channels to\ncable modems by providing modems access to upstream and downstream channels through FDD; a CM's operation\non an FDX channel in either US or DS can be changed by the CMTS. FDX channels can be bonded with non-FDX\nchannels and with other FDX channels.\nTo avoid the risk of co-channel interference (CCI) and adjacent channel interference (ACI) between CMs, the\nCMTS schedules transmissions and grants such that a CM does not transmit at the same time as other CMs that are\nsusceptible to interference from the transmitting CM are receiving. CM to CM interference susceptibility is\nmeasured through a sounding process that is defined in the specification. After measuring CM to CM interference\nsusceptibility, the CMTS creates groups of CMs that are susceptible to interfering with one another, called\n\n\n\n\n42                                                 CableLabs                                            12/02/20\n\fPhysical Layer Specification                                                                        CM-SP-PHYv4.0-I03-201202\n\n\nInterference Groups (IG), and schedules transmissions and grants to CMs to avoid having a CM transmit when\nother CMs in its IG are receiving.\nA DOCSIS 4.0-compliant CM supports two modes of operation related to FDX:\n    1.   DOCSIS 3.1 mode: The FDX CM behaves identically to a DOCSIS 3.1-compliant cable modem and\n         adheres to the requirements in section 7 of [DOCSIS PHYv3.1]. An FDX CM is in this mode if it is on a\n         non-FDX plant or it is on an FDX plant but configured to operate in DOCSIS 3.1 mode.\n    2.   FDX mode: An FDX CM is in this mode when it is on an FDX plant and is configured for FDX operation.\n         In this mode the CM adheres to the requirements in this specification. This includes when in both non-\n         FDX and FDX operational states.\nTransitioning between modes 1 and 2 requires a CM reboot.",5]],"viewer":{"atp_file":"pdf/CM-TP-PHYv4.0-ATP-D01-23xxxx_Clean-23Aug16.pdf","atp_page":1,"spec_file":"pdf/CM-SP-PHYv4.0-I03-201202.pdf","spec_pages":[5],"atp_revision":"D01 Draft · DOCX 已轉 PDF","spec_revision":"I03 Issued"}},"PHY-92.40":{"version":"D4.0","atp_page":null,"atp":"","spec":[["7.3.2.3 Upstream CM Spectrum","7.3.2.3    Upstream CM Spectrum\nIndividual CM implementations can limit the spectrum over which the CM is able to transmit upstream signals.\nAs a result, in order to be compliant with this specification an FDD CM MUST support at least two of the\nfollowing upstream upper band edges: 204 MHz; 300 MHz; 396 MHz; 492 MHz; and/or 684 MHz as shown in\nTable 31 - FDD CM Diplex Filter Band Edge Frequencies.\nThe FDD CM MAY support more than two of the following upstream upper band edges: 204 MHz; 300 MHz; 396\nMHz; 492 MHz; and/or 684 MHz as shown in Table 31 - FDD CM Diplex Filter Band Edge Frequencies.\nThe diplex filters listed in Table 31 are defined for FDD technology.\n                            Table 31 - FDD CM Diplex Filter Band Edge Frequencies\n\n            Split Name          Diplex Filter Start Frequency            Diplex Filter Stop Frequency\n                                (Upstream upper band edge)              (Downstream lower band edge)\n                                            (MHz)                                    (MHz)\n              High-Split                     204*                                     258\n              UHS-300                         300                              300 MHz–372 MHz\n              UHS-396                         396                              396 MHz–492 MHz\n              UHS-492                         492                              492 MHz–606 MHz\n              UHS-684                         684                              684 MHz–834 MHz\n\n*Note: For cable modems, the 204 MHz upstream upper band edge is a special case for compatibility with DOCSIS\n       3.1 high-split networks. In this case, the FDD CM supports the full band 5 MHz to 204 MHz from a single\n       (legacy) TCS, therefore, including the range 85 MHz to 108 MHz. For all other supported diplex filters, the\n       FDD CM's upstream occurs in two TCSs isolated by an additional diplex filter over the range 85 MHz to 108\n       MHz. For these cases, the range 85 MHz to 108 MHz is unusable for US transmission. This is further\n       described and illustrated in Section 7.3.2.5 and Figure 25. Also, refer to Section 7.3.4 for additional details\n       regarding the TCS and TCS_FDD.\n\n\n\n\n12/02/20                                            CableLabs                                                     99\n\fCM-SP-PHYv4.0-I03-201202                                      Data-Over-Cable Service Interface Specifications\n\n\nThe FDD CM MUST be configurable to operate with any supported upstream upper band edge. The nature and\noperation of this configurability is vendor-specific. Possible forms of configurability include a hardware switch on\nthe modem housing, a software-controlled diplex filter responsive to OSSI commands, or other forms.\nThe FDD CM also complies with the following requirements:\n      •   The FDD CM modulator MUST support upstream transmissions from 5 MHz to 204 MHz in a single\n          (legacy) TCS, including the frequency range from 85 MHz to 108 MHz when using a 204 MHz diplex\n          filter and the transmit power requirements in [DOCSIS PHYv3.1].\n      •   The FDD CM modulator MUST support upstream transmissions from 5 MHz to 85 MHz (legacy TCS)\n          and from 108 MHz to the upstream upper band edge (TCS_FDD) when using any of UHS-300, UHS-396,\n          UHS-492, or UHS-684 diplex filter options; in these cases, upstream transmission between 85 MHz and\n          108 MHz is not required.\n      •   The FDD CM MUST support a minimum of 7 independently configurable OFDMA upstream channels,\n          each occupying a spectrum of up to 96 MHz.\n      •   The FDD CM MUST be capable of transmitting on all upstream channels simultaneously.\n      •   The FDD CM MUST support a minimum of 4 upstream SC-QAM channels in the range of 5 MHz to 85\n          MHz. The FDD CM MAY support a minimum of 8 upstream SC-QAM channels in the range 5 MHz to\n          85 MHz. This is the total number of upstream SC-QAM channels, and not additional channels with\n          respect to a DOCSIS 3.1 CM.",99],["7.3.4 Upstream Transmit and Receive","7.3.4    Upstream Transmit and Receive .................................................................................................. 102",5]],"viewer":{"atp_file":"pdf/CM-TP-PHYv4.0-ATP-D01-23xxxx_Clean-23Aug16.pdf","atp_page":1,"spec_file":"pdf/CM-SP-PHYv4.0-I03-201202.pdf","spec_pages":[99,5],"atp_revision":"D01 Draft · DOCX 已轉 PDF","spec_revision":"I03 Issued"}},"PHY-93.40":{"version":"D4.0","atp_page":null,"atp":"","spec":[["7.3.4 Upstream Transmit and Receive","7.3.4    Upstream Transmit and Receive .................................................................................................. 102",5]],"viewer":{"atp_file":"pdf/CM-TP-PHYv4.0-ATP-D01-23xxxx_Clean-23Aug16.pdf","atp_page":1,"spec_file":"pdf/CM-SP-PHYv4.0-I03-201202.pdf","spec_pages":[5],"atp_revision":"D01 Draft · DOCX 已轉 PDF","spec_revision":"I03 Issued"}},"PHY-94.40":{"version":"D4.0","atp_page":1,"atp":"3.5\tTC FDD / US Upstream Noise/spurious Burst ON (PHY-94.40)\t151\n[Insert Procedure name here.]\t160","spec":[["7.3.4 Upstream Transmit and Receive","7.3.4    Upstream Transmit and Receive .................................................................................................. 102",5]],"viewer":{"atp_file":"pdf/CM-TP-PHYv4.0-ATP-D01-23xxxx_Clean-23Aug16.pdf","atp_page":1,"spec_file":"pdf/CM-SP-PHYv4.0-I03-201202.pdf","spec_pages":[5],"atp_revision":"D01 Draft · DOCX 已轉 PDF","spec_revision":"I03 Issued"}},"PHY-95.40":{"version":"D4.0","atp_page":1,"atp":"3.6\tTC FDD / US Upstream Noise/spurious Burst OFF (PHY-95.40)\t160","spec":[["7.3.4 Upstream Transmit and Receive","7.3.4    Upstream Transmit and Receive ........................
